# Stage 6: The rocket. Design, test, decide, land.
# ~90 min, ~15 in-game years. Heartbeat: the calendar and delta-v margin. Almost no construction:
# the stage is the rocket workshop and the test campaign.

stage: 6
name: The rocket
opening_problem: "One engine fires on a pad. You need a vehicle of several stages, a way to steer it, a capsule that keeps someone alive, and a lander that sets down gently on a world with no air."
heartbeat: calendar
labor_tier: departments
gate:
  id: gate_landing
  name: A living pilot on the Moon
  condition:
    state: ["crewed_landing_survived == true"]
  score: "In-game year of the successful landing. A pilot's death costs two years (new vehicle, new pilot) and the run continues."
  routes: [A_direct, B_parking_orbit, T_single_stage]

pressures:
  - id: calendar
    name: Years
    drives: year
    heartbeat: true
    rises_with: ["every test month; every fix"]
    red_when: "never; it is the score"
    effect_when_red: "n/a"
    answers: [test_campaign]
    introduced_in_beat: 1
  - id: dv_margin
    name: Delta-v margin
    drives: dv_margin_km_s
    rises_with: ["payload growth (suit, escape tower, life support days) eats margin; guidance errors need margin to absorb"]
    red_when: "dv_margin_km_s < 0.3"
    effect_when_red: "Guidance flaws become fatal instead of survivable; the workshop says so"
    answers: [rocket_workshop, midcourse_correction]
    introduced_in_beat: 1
  - id: flaw_backlog
    name: Known flaws
    drives: known_flaws
    rises_with: ["every test that reveals one"]
    red_when: "any known flaw is unfixed at launch"
    effect_when_red: "The launch screen lists them and their severity"
    answers: [test_campaign]
    introduced_in_beat: 6

workshops:
  - id: rocket_workshop
    name: Rocket workshop
    opens_with: rocket_workshop
    loop: "Per stage: propellant mass, propellants, tank material, feed. Δv per stage and total against the mission budget. Change anything, see the bar move."
    dials:
      - {id: stage_count, name: "Stages", range: [1, 4], added_by: rocket_workshop,
         effect: "One stage cannot reach orbit with this era's structures; the screen shows why. Two reaches orbit; three or four reach the Moon",
         basis: "Δv = v_e ln(m0/mf); staging resets the mass ratio"}
      - {id: propellant_mass, name: "Propellant per stage (t)", range: [1, 1000], added_by: rocket_workshop,
         effect: "The logarithm: doubling propellant never doubles Δv",
         basis: "Rocket equation"}
      - {id: propellants, name: "Propellants", options: [ethanol_lox, kerosene_lox, hypergolic], added_by: rocket_workshop,
         effect: "Only what your chemistry makes. Play values: 280 s, 310 s; hypergolic 290 s but storable (lander)",
         basis: "Simplified Isp; see open questions"}
      - {id: tank_material, name: "Tanks", options: [steel, aluminum], added_by: rocket_workshop,
         effect: "Structural fraction 0.14 vs 0.09 (play values). Aluminum only if has_duralumin",
         basis: "Simplification"}
      - {id: feed, name: "Feed per stage", options: [pressure_fed, turbopump], added_by: rocket_workshop,
         effect: "Pressure-fed: +0.08 structural fraction, -25 s. Right for the lander, wrong for the booster",
         basis: "Tank pressure must exceed chamber pressure"}
      - {id: route, name: "Route", options: [direct_ascent, parking_orbit], added_by: guidance_choice,
         effect: "Direct: Luna-style, tight windows, no restart. Parking orbit: an upper-stage restart in orbit, more windows, needs inertial guidance",
         basis: "Luna 2/9 flew direct; Apollo used parking orbits"}
    outputs: [dv_total_km_s, dv_margin_km_s, liftoff_mass_t, flaws_expected]

  - id: test_campaign
    name: Test campaign
    opens_with: test_campaign
    loop: "Choose a test type (static fire, tanking, vacuum chamber, uncrewed orbital, impactor, uncrewed landing). Each costs months and oxygen and can reveal flaws of its kind. Fix or not. Launch when you judge the odds. See failure-modes.md."
    dials:
      - {id: test_type, name: "Test", options: [static_fire, tanking_hold, vacuum_chamber, orbital_flight, impactor, uncrewed_landing], added_by: test_campaign,
         effect: "Each kind reveals only its own flaw categories, and says which. Flight tests are expensive and teach the most",
         basis: "How real programs found their problems"}
      - {id: launch, name: "Launch crewed mission", options: [go], added_by: test_campaign,
         effect: "Lists every known unfixed flaw with severity, and the categories no test has covered. Then flies",
         basis: "The final skill decision"}
    outputs: [flaws_revealed, months_spent, categories_covered]

nodes:

  # ---- Beat 1: the design -----------------------------------------------------------------------------------------------
  - id: rocket_workshop
    name: Rocket workshop
    stage: 6
    beat: 1
    kind: workshop
    workshop: rocket_workshop
    critical_path: true
    problem: "Engines and tanks exist, but nobody has worked out how big each stage must be to reach the Moon."
    requires:
      nodes: [gate_engine]
      labor_person_days: 200000
    unlocks:
      effects: ["Mission budget 15.3 km/s: ~9.4 to orbit incl. losses, ~3.1 toward the Moon, ~2.8 to brake and land. Single-stage and black-powder attempts are shown inside the workshop as what-ifs, not built"]
    reads_state: [feed_system, has_duralumin, has_kerosene, has_ethanol, has_hypergolics, calc_hours]
    writes_state: [vehicle_design, dv_margin_km_s]
    pages_bundle: orbital_mechanics
    without_pages: "Different route: the Δv targets on the bar are blank until the computing office has spent calc_hours computing them"
    numbers_status: "Rocket equation exact; structural fractions and Isp are play values"
    sources: ["https://en.wikipedia.org/wiki/Tsiolkovsky_rocket_equation"]
    tags: [substantive]
    trap_lesson: "A single steel stage tops out near 5.8 km/s on alcohol and 6.4 on kerosene, even with zero payload. Orbit needs 9.4."
    notebook: >
      Δv = v_e ln(m_full/m_empty). Because of the logarithm, doubling propellant never doubles speed.
      Staging is the escape: drop the empty tank so the rest of the burn doesn't carry it. Every lunar
      rocket ever flown had at least three stages including the lander.

  - id: stage_separation
    name: Staging hardware
    stage: 6
    beat: 1
    kind: project
    critical_path: true
    problem: "A spent stage must let go cleanly, in thin air, at high speed, without hitting the stage above."
    requires:
      nodes: [rocket_workshop]
      resources: {steel_kg: 2500}
      labor_person_days: 600000
    unlocks:
      effects: ["Explosive bolts plus solid retro and ullage motors (if has_solids; else black-powder bolts and springs with separation_recontact risk)"]
    reads_state: [has_solids]
    writes_state: [has_staging]
    pages_bundle: liquid_rocket_engines
    without_pages: "2x labor; a separation flaw is added to the first design"
    numbers_status: "Estimate"
    sources: ["https://en.wikipedia.org/wiki/Multistage_rocket"]
    tags: []
    notebook: >
      Bolts with small charges cut the spent stage loose. Small rockets push it back or nudge the next
      stage forward, which also settles the floating propellant toward the pumps. Some designs light
      the next engine while still attached, called hot staging.

  # ---- Beat 2: guidance -----------------------------------------------------------------------------------------------------
  - id: guidance_choice
    name: Guidance
    stage: 6
    beat: 2
    kind: decision_option
    route: [A_direct, B_parking_orbit]
    critical_path: true
    problem: "Your gyroscopes drift, and beyond the horizon the ground can't see the rocket."
    requires:
      nodes: [rocket_workshop, tracking_network, gyroscopes]
      resources: {copper_kg: 3000, alloy_steel_kg: 500}
      labor_person_days: 2000000
    unlocks:
      effects:
        - "Radio command: the ground measures speed by Doppler and radios the cutoff. Precise near Earth; direct-ascent only. Hidden flaw cutoff_signal_delay"
        - "Inertial platform: onboard, works anywhere, needs bearing_quality and calc_hours. Enables the parking-orbit route. Hidden flaw gyro_drift"
        - "Adds the route dial"
    reads_state: [guidance_quality, bearing_quality, calc_hours]
    writes_state: [guidance_mode]
    pages_bundle: guidance
    without_pages: "Inertial costs 4x labor"
    numbers_status: "Luna 1's late cutoff (+175 m/s, missed by ~5,900 km) sourced"
    sources: ["https://en.wikipedia.org/wiki/Luna_1"]
    tags: [substantive]
    notebook: >
      In January 1959 the Soviet Luna 1 got its ground cutoff command late. The extra 175 meters per
      second meant it missed the Moon by nearly 6,000 km and became the first spacecraft to orbit the
      Sun. An inertial platform carries the measurement onboard, and carries its own drift.

  - id: midcourse_correction
    name: Midcourse correction
    stage: 6
    beat: 2
    kind: upgrade
    critical_path: false
    problem: "A small error at cutoff grows into thousands of kilometers by the Moon."
    requires:
      nodes: [guidance_choice]
      state: ["has_hypergolics == true OR has_solids == true"]
      resources: {steel_kg: 200}
      labor_person_days: 500000
    unlocks:
      effects: ["A small burn halfway corrects the aim: guidance flaws become survivable with margin. Costs ~0.1 km/s of margin"]
    reads_state: [has_tracking]
    writes_state: [has_midcourse, dv_margin_km_s]
    pages_bundle: orbital_mechanics
    without_pages: "Needs calc_hours"
    numbers_status: "Luna 9 used a midcourse correction (sourced)"
    sources: ["https://nssdc.gsfc.nasa.gov/nmc/spacecraft/display.action?id=1966-006A"]
    tags: [accelerant, safety]
    notebook: >
      A meter per second of error at cutoff shifts arrival by hundreds of kilometers. Tracking the
      actual path and firing a small engine for a few seconds fixes it cheaply.

  # ---- Beat 3: the pilot ----------------------------------------------------------------------------------------------------------
  - id: capsule
    name: Capsule and life support
    stage: 6
    beat: 3
    kind: project
    critical_path: true
    problem: "Above about 18 km the fluids in a body boil at body temperature; the pilot needs a sealed vessel of air, and it fills with carbon dioxide within hours."
    requires:
      nodes: [rocket_workshop, welding]
      state: ["has_caustic == true"]
      resources: {steel_kg: 800, glass_kg: 50, caustic_kg: 200}
      labor_person_days: 1500000
    milestones:
      - {at: 0.5, id: pressure_hull, effect: "1.6 t sealed capsule (1.3 t if has_duralumin)"}
      - {at: 1.0, id: life_support, effect: "Four days of oxygen and hydroxide CO2 absorbers; thermal control for lunar day or night"}
    unlocks:
      effects: ["The workshop's payload. Vacuum-chamber tests reveal capsule_leak and co2_scrubber_saturation"]
    reads_state: [has_duralumin, welders_trained, has_lox]
    writes_state: [capsule_mass_t, life_support_days]
    pages_bundle: life_support
    without_pages: "2x labor; leaks found in testing"
    numbers_status: "Armstrong limit ~18 km (6.3 kPa) sourced; masses are the mockup's"
    sources: ["https://en.wikipedia.org/wiki/Armstrong_limit"]
    tags: [substantive]
    notebook: >
      At about 18 km, pressure falls so low that water boils at 37 C. A capsule holds breathable air
      in; because this is one-way it needs no heat shield. A resting person exhales about a kilogram
      of CO2 a day, which a canister of hydroxide binds as carbonate.

  - id: crew_safety
    name: Pressure suit and escape tower
    stage: 6
    beat: 3
    kind: upgrade
    critical_path: false
    problem: "If the capsule leaks, or the booster fails climbing out, the pilot dies with it."
    requires:
      nodes: [capsule]
      any_of: [[solid_motors], [chlor_alkali]]
      resources: {steel_kg: 600, rubber_substitute_kg: 30}
      labor_person_days: 1000000
    unlocks:
      effects: ["Suit: a leak isn't fatal. Escape tower (needs solids): booster failures before staging cost a vehicle, not a pilot. Both add payload mass: dv_margin -0.15 km/s"]
    reads_state: [has_solids]
    writes_state: [has_pressure_suit, has_escape_system, dv_margin_km_s]
    pages_bundle: life_support
    without_pages: "2x labor"
    numbers_status: "Mercury, Apollo, Soyuz escape towers documented"
    sources: ["https://en.wikipedia.org/wiki/Launch_escape_system"]
    tags: [substantive, safety]
    notebook: >
      A suit is a wearable capsule. An escape tower is a small solid rocket that yanks the capsule
      clear in seconds if the booster fails. Both are mass thrown away on every good flight; that
      trade, mass for survival, is the whole story of crewed spaceflight.

  # ---- Beat 4: the lander --------------------------------------------------------------------------------------------------------
  - id: lander_stage
    name: Lander
    stage: 6
    beat: 4
    kind: project
    critical_path: true
    problem: "The Moon has no air to slow you down; every meter per second of arrival speed must be cancelled by an engine, and the pilot can't judge height over a gray featureless surface."
    requires:
      nodes: [rocket_workshop, electronics_lab]
      any_of: [[hypergolic_propellants], [regenerative_cooling]]
      resources: {steel_kg: 3000, copper_kg: 100}
      labor_person_days: 2500000
    milestones:
      - {at: 0.4, id: braking_engine, effect: "~2.8 km/s braking stage; pressure-fed is right here. LOX version adds lox_boiloff and engine_restart_failure risks"}
      - {at: 0.7, id: radar_altimeter, effect: "Radio pulse timing gives height and descent rate; triggers the burn"}
      - {at: 1.0, id: legs, effect: "Crushable legs: 3 m/s and 12 degree slopes"}
    unlocks:
      effects: ["The workshop's final stage. Throttle is a separate upgrade"]
    reads_state: [has_hypergolics, has_duralumin, has_tubes]
    writes_state: [lander_design, has_radar_altimeter, landing_tolerance]
    pages_bundle: liquid_rocket_engines
    without_pages: "2x labor"
    numbers_status: "Luna 9: braked from ~2.6 km/s in 46 s, radar-triggered at 75 km (sourced)"
    sources: ["https://nssdc.gsfc.nasa.gov/nmc/spacecraft/display.action?id=1966-006A"]
    tags: [substantive]
    notebook: >
      A spacecraft falling toward the Moon arrives at about 2.5 km/s, and only its own engine can slow
      it. Luna 9 fired its braking engine for 46 seconds from 75 km, triggered by a radar altimeter,
      and set down at a few meters per second.

  - id: lander_throttle
    name: Throttleable descent engine
    stage: 6
    beat: 4
    kind: upgrade
    critical_path: false
    problem: "An engine that only runs at full thrust overshoots to zero speed high above the ground or slams into it."
    requires:
      nodes: [lander_stage]
      state: ["injector_quality >= 1"]
      resources: {alloy_steel_kg: 200}
      labor_person_days: 800000
    unlocks:
      effects: ["Hover and divert: removes landing_boulder_field; landing margin needed falls"]
    reads_state: [injector_quality]
    writes_state: [lander_throttle]
    pages_bundle: liquid_rocket_engines
    without_pages: "3x labor"
    numbers_status: "Apollo LM descent engine throttled ~10-65% (sourced)"
    sources: ["https://en.wikipedia.org/wiki/Descent_propulsion_system"]
    tags: [accelerant, safety]
    notebook: >
      At low flow the injector sprays poorly and combustion goes unstable, which is why throttling is
      hard. The Apollo descent engine managed it, and Armstrong used it to fly past a boulder field
      with seconds of fuel to spare.

  # ---- Beat 5-7: test, decide, launch -----------------------------------------------------------------------------------------------
  - id: test_campaign
    name: Test campaign
    stage: 6
    beat: 5
    kind: workshop
    workshop: test_campaign
    critical_path: true
    problem: "Every design hides flaws you can't see on paper."
    requires:
      nodes: [rocket_workshop, stage_separation, capsule, lander_stage, guidance_choice]
    unlocks:
      effects: ["Opens the test campaign. Flaws are deterministic from the design and state, hidden until the right test type exposes them. Uncrewed flights cost a vehicle and months and reveal the most"]
    reads_state: [instrumentation_level, welders_trained, flight_tests]
    writes_state: [known_flaws, fixed_flaws, flight_tests, year]
    pages_bundle: liquid_rocket_engines
    without_pages: "Flaws are revealed at a lower rate per test"
    numbers_status: "Game system; see failure-modes.md"
    sources: []
    tags: [substantive]
    notebook: >
      Testing never proves a rocket works; it only reveals ways it doesn't. The skill is deciding when
      you've found enough: every month costs score, every unfound flaw risks the pilot.

  - id: gate_landing
    name: "Gate: a living pilot on the Moon"
    stage: 6
    beat: 7
    kind: gate
    critical_path: true
    problem: "One person, one way, alive on the lunar surface."
    requires:
      nodes: [test_campaign, launch_complex]
      state: ["dv_margin_km_s >= 0", "crewed_landing_survived == true"]
    unlocks:
      effects: ["Run ends. Score: the year of the landing"]
    reads_state: [known_flaws, fixed_flaws, has_pressure_suit, has_escape_system, has_midcourse, lander_throttle, dv_margin_km_s]
    notebook: >
      Energy got you to the pad. A checklist decided whether the rocket worked: cold, precision,
      guidance, air. The year on the calendar is your score.
