      resources: {copper_kg: 3000, steel_kg: 8000}
      labor_person_days: 1500000
    unlocks:
      jobs: [liquefy_air]
      effects: ["Continuous liquid air; simple, no moving parts in the cold; energy-hungry"]
    reads_state: [max_pressure_atm, has_dewar]
    writes_state: [has_liquid_air, cryo_process]
    pages_bundle: cryogenics
    without_pages: "3x labor; the regenerative counterflow trick is the key idea"
    fallback: "Cascade liquefaction (small batches)"
    energy_effect: "Compressor load; roughly 1 kWh per kg liquid air in an early plant (estimate)"
    numbers_status: "Hampson and Linde patents (1895) and Linde's ~3 L/h first yield are sourced; energy per kg is an estimate"
    sources:
      - "https://en.wikipedia.org/wiki/Hampson%E2%80%93Linde_cycle"
      - "https://en.wikipedia.org/wiki/Carl_von_Linde"
    tags: []
    notebook: >
      Compressed air cools slightly when it expands through a valve, the Joule-Thomson effect.
      Linde's trick was to send that slightly cooled air back past the incoming high-pressure air,
      so each round starts colder than the last. After a few days, air drips out as a pale blue
      liquid. Linde's first machine made about three liters an hour in 1895.

  - id: claude_expander
    name: Expansion-engine liquefier
    stage: 4
    kind: decision_option
    critical_path: false
    route: [B_claude]
    problem: "Throttling through a valve wastes most of the cooling that compressed air could give."
    requires:
      nodes: [compressors, dewar_flasks, alloy_steels]
      resources: {alloy_steel_kg: 4000, copper_kg: 3000}
      labor_person_days: 2500000
    unlocks:
