# Stage 4: Electricity and chemistry. A grid, electrochemistry, compressed gas, liquid oxygen.
# ~90 min, ~25 in-game years. Heartbeat: kilowatts.

stage: 4
name: Electricity and chemistry
opening_problem: "You can make current, but only next to the engine that makes it, and your chemists still can't make most of what a rocket is built from."
heartbeat: power_balance
labor_tier: works
gate:
  id: gate_liquid_oxygen
  name: Liquid oxygen on tap
  condition:
    energy_w_per_person: 2500
    state: ["lox_kg_per_day >= 500"]
  routes: [A_linde, B_claude, T_cascade]

pressures:
  - id: power_balance
    name: Power
    drives: power_balance_kw
    heartbeat: true
    rises_with: ["every motor, arc furnace, electrolysis cell, compressor and lamp draws kilowatts; the player chooses what runs"]
    red_when: "load exceeds generation"
    effect_when_red: "Brownout: every electrical load runs at the available fraction; the arc furnace freezes its charge"
    answers: [distribution_grid, steam_turbine, water_turbine, power_station_expansion]
    introduced_in_beat: 1
  - id: alkali_acid_demand
    name: Chemicals
    drives: chemical_balance
    rises_with: ["glass, soap-free cleaning, alumina, caustic for scrubbers all want alkali; every process wants acid"]
    red_when: "demand exceeds supply for 30 days"
    effect_when_red: "Glass and chemistry jobs stall"
    answers: [soda_ash, chlor_alkali, sulfuric_acid]
    introduced_in_beat: 3
  - id: fuel_balance
    name: Fuel
    drives: fuel_balance
    rises_with: ["boilers for the power station and steam heat for chemistry"]
    red_when: "fuel use exceeds production"
    effect_when_red: "Power station output falls; brownout follows"
    answers: [coal_mining, hot_blast, steam_turbine, water_turbine]
    introduced_in_beat: 1

workshops:
  - id: engine_workshop
    extends: true
    dials:
      - {id: transmission, name: "Transmission", options: [dc_local, ac_transformed], added_by: distribution_grid,
         effect: "DC: a kilometer before losses bite. AC with transformers: the whole colony. Line loss shown as a percentage",
         basis: "Loss ∝ I²R; transformers trade current for voltage"}
      - {id: prime_mover, name: "Prime mover", options: [piston, turbine, water_turbine], added_by: steam_turbine,
         effect: "Turbine: about twice the electricity per ton of coal, needs steel_quality 2+ and good bearings. Water turbine: no fuel, river sites only",
         basis: "Parsons 1884"}
  - id: liquefier_workshop
    name: Liquefier workshop
    opens_with: cascade_liquefier
    loop: "Design a cold plant: pressure, exchanger, expansion method, column. Outputs liters per day, kW per kg, purity. Runs for in-game days before the first drop; the player watches the temperature fall."
    dials:
      - {id: method, name: "Method", options: [cascade, throttle_regenerative, expansion_engine], added_by: cascade_liquefier,
         effect: "Cascade: liters a day, laboratory only. Throttle with regenerative exchange (Linde): continuous, simple, ~2 kWh/kg (estimate). Expansion engine (Claude): about half the energy, needs a cold precision piston",
         basis: "Pictet/Cailletet 1877; Hampson and Linde 1895; Claude 1902"}
      - {id: pressure, name: "Compressor pressure (atm)", range: [20, 200], added_by: compressors,
         effect: "Higher pressure: more cooling per pass, more compressor power, thicker vessels (steel_quality read)",
         basis: "Joule-Thomson cooling per bar is small; regenerative exchange multiplies it"}
      - {id: exchanger_length, name: "Heat exchanger", range: [1, 10], added_by: linde_liquefier,
         effect: "Longer counterflow: each pass starts colder. Too short never reaches -190 C; the screen shows the asymptote",
         basis: "Hampson-Linde cycle ([Wikipedia](https://en.wikipedia.org/wiki/Hampson%E2%80%93Linde_cycle))"}
      - {id: column, name: "Rectifying column trays", range: [0, 40], added_by: air_separation,
         effect: "Zero trays: liquid air, 21% oxygen. Each tray separates a little more: 30+ trays give 99% oxygen",
         basis: "Oxygen boils at -183 C, nitrogen at -196 C"}
    outputs: [liters_per_day, kwh_per_kg, purity_pct, days_to_first_drop]

nodes:

  # ---- Beat 1: the grid ---------------------------------------------------------------------------------------------
  - id: distribution_grid
    name: Transmission and transformers
    stage: 4
    beat: 1
    kind: workshop
    workshop: engine_workshop
    critical_path: true
    problem: "Every workshop needs its own engine and dynamo, because current can't travel far from the machine that makes it."
    requires:
      nodes: [gate_generator]
      resources: {copper_kg: 30000, iron_kg: 15000, glass_kg: 2000}
      labor_person_days: 2500000
    unlocks:
      effects: ["Engine workshop gains transmission dials: voltage, AC/DC. Power stations can serve the whole colony. Introduces the power balance bar: generation vs the loads you switch on"]
    reads_state: [has_insulated_wire, dynamo_output_kw]
    writes_state: [grid_kw, has_ac, power_balance_kw]
    pages_bundle: electricity
    without_pages: "Different route: DC only at first (range a kilometer); the transformer appears after a year of line losses shown on the screen"
    numbers_status: "Transformer principle and 1880s AC systems sourced; quantities are estimates"
    sources: ["https://en.wikipedia.org/wiki/Transformer"]
    tags: [substantive, labor_sink]
    notebook: >
      Power lost in a wire rises with the square of the current. A transformer, two coils on one
      iron core, raises voltage and lowers current by the same factor, so the same power crosses a
      thin wire with a hundredth of the loss. It only works with alternating current.

  - id: steam_turbine
    name: Steam turbine
    stage: 4
    beat: 1
    kind: upgrade
    critical_path: false
    problem: "Piston engines shake and wear at generator speeds, and the power station is out of room."
    requires:
      nodes: [distribution_grid, open_hearth]
      state: ["power_balance_kw < 0"]
      resources: {steel_kg: 20000, copper_kg: 3000}
      labor_person_days: 2000000
    unlocks:
      effects: ["Power station efficiency about doubles; large smooth output. Reads bearing_quality"]
    reads_state: [steel_quality, bearing_quality]
    writes_state: [power_station_efficiency]
    pages_bundle: steam_engines
    without_pages: "3x labor; blades fail until balancing is learned"
    numbers_status: "Parsons 1884 sourced; gain is an estimate"
    sources: ["https://en.wikipedia.org/wiki/Steam_turbine"]
    tags: [accelerant, substantive]
    notebook: >
      Steam in a turbine expands through rings of blades like wind through a windmill, many stages
      in a row. Parsons' 1884 machine drove a dynamo at 18,000 rpm. A turbopump in Stage 5 is the
      same idea, shrunk and driven much harder.

  - id: power_station_expansion
    name: Power station expansion
    stage: 4
    beat: 1
    kind: project
    critical_path: false
    problem: "Every new load you switch on browns out the last one."
    requires:
      nodes: [distribution_grid]
      state: ["power_balance_kw < 0"]
      resources: {iron_kg: 20000, copper_kg: 5000}
      labor_person_days: 800000
    unlocks:
      effects: ["+250 kW generation per build (repeatable). Fuel use rises accordingly; hydro sites give it free"]
    reads_state: [hydro_kw, fuel_balance]
    writes_state: [grid_kw, power_balance_kw]
    pages_bundle: none
    without_pages: "No penalty"
    numbers_status: "Game values"
    sources: []
    tags: [repeatable]
    notebook: >
      Generation has to match load moment to moment; there's no stockpile of electricity. A power
      station is a promise of fuel burned continuously, which is why hydro sites are worth a fight.

  # ---- Beat 2: electricity as heat ------------------------------------------------------------------------------------
  - id: arc_furnace
    name: Electric arc furnace
    stage: 4
    beat: 2
    kind: project
    critical_path: true
    problem: "Some metals and compounds need temperatures no fuel flame reaches."
    requires:
      nodes: [distribution_grid]
      resources: {graphite_kg: 5000, steel_kg: 10000, clay_kg: 20000}
      labor_person_days: 1200000
    unlocks:
      jobs: [run_arc_furnace]
      effects: ["Electric steel; calcium carbide (acetylene for welding); ferroalloys if the ores are found. A 500 kW load"]
    reads_state: [grid_kw, mineral_sites]
    writes_state: [has_arc_furnace, has_carbide]
    pages_bundle: metallurgy_2
    without_pages: "2x labor"
    numbers_status: "Moissan/Willson carbide 1892, Heroult 1900 sourced"
    sources: ["https://en.wikipedia.org/wiki/Electric_arc_furnace"]
    tags: []
    notebook: >
      An arc between carbon electrodes reaches thousands of degrees with no fuel gases to
      contaminate the charge. Lime and coke in an arc furnace make calcium carbide, which fizzes
      into acetylene in water.

  - id: alloy_steels
    name: Alloy and tool steels
    stage: 4
    beat: 2
    kind: decision_option
    critical_path: false
    problem: "Cutting tools soften at red heat, and turbine parts creep and crack when hot."
    requires:
      nodes: [arc_furnace]
      state: ["mineral_sites has chromite OR mineral_sites has tungsten OR mineral_sites has nickel"]
      resources: {chromium_ore_kg: 10000}
      labor_person_days: 1200000
    unlocks:
      jobs: [make_alloy_steel]
      effects: ["Choose what to alloy for, given the ores found: tool steel (shop hours x2), stainless (acid plant life), heat-resistant (turbines, later injectors). Each is a separate small project"]
    reads_state: [mineral_sites]
    writes_state: [has_alloy_steel, shop_hours_balance]
    pages_bundle: metallurgy_2
    without_pages: "3x labor; many trial heats"
    numbers_status: "High-speed steel 1900, stainless 1910s sourced"
    sources: ["https://en.wikipedia.org/wiki/High-speed_steel"]
    tags: [substantive, accelerant]
    notebook: >
      Carbon steel loses its hardness when hot, so a lathe cutting fast burns its own tool soft.
      Tungsten and chromium give steel carbides that stay hard at red heat. Enough chromium and it
      stops rusting; nickel keeps it tough when cold.

  - id: welding
    name: Welding
    stage: 4
    beat: 2
    kind: project
    critical_path: true
    problem: "Riveted seams leak under pressure and add weight; thin tanks and pipes need continuous joints."
    requires:
      nodes: [arc_furnace]
      resources: {steel_kg: 3000, copper_kg: 1000}
      labor_person_days: 700000
    unlocks:
      jobs: [weld]
      effects: ["Arc welding now; oxy-acetylene once oxygen is available. Thin-wall tanks and pressure pipework. Trains welders; weld flaws in Stage 5-6 read welders_trained"]
    reads_state: [has_carbide]
    writes_state: [welders_trained]
    pages_bundle: machine_tools
    without_pages: "2x labor; porous welds until fluxes are right"
    numbers_status: "Early arc welding and oxy-acetylene (c. 1903) sourced"
    sources: ["https://en.wikipedia.org/wiki/Oxy-fuel_welding_and_cutting"]
    tags: [skill_builder]
    notebook: >
      A weld joins metal into one piece, so a tank can be thinner and lighter than a riveted one.
      Welding thin sheet well is a skill, and so is finding the flaw hidden inside a weld.

  # ---- Beat 3: alkali and acid at scale ---------------------------------------------------------------------------------
  - id: soda_ash
    name: Soda ash
    stage: 4
    beat: 3
    kind: decision_option
    critical_path: false
    problem: "Glass and chemistry need alkali by the ton, and burning plants for potash eats forest."
    requires:
      nodes: [sulfuric_acid]
      state: ["chemical_balance < 0"]
      resources: {salt_kg: 20000, lime_kg: 10000}
      labor_person_days: 800000
    unlocks:
      jobs: [make_soda_ash]
      effects: ["Leblanc now (fuel-hungry, HCl fumes: scar hcl_pollution) or Solvay if coke-oven ammonia is captured (clean, needs coal_seam_choice). The choice is shown with both costs"]
    reads_state: [has_coke]
    writes_state: [has_soda_ash, hcl_pollution]
    pages_bundle: industrial_chemistry
    without_pages: "Leblanc only, 2x labor"
    numbers_status: "Leblanc and Solvay (1861) sourced"
    sources: ["https://en.wikipedia.org/wiki/Solvay_process"]
    tags: [substantive, scar]
    notebook: >
      Leblanc turns salt into soda with acid, coal and limestone, and belches hydrochloric acid that
      killed fields around 19th-century works. Solvay's process uses brine, limestone and ammonia
      it recovers and reuses. Leblanc now and Solvay later leaves a scar but gets glass moving sooner.

  - id: chlor_alkali
    name: Brine electrolysis
    stage: 4
    beat: 3
    kind: project
    critical_path: false
    problem: "You need caustic soda, chlorine and hydrogen, and chemistry alone makes them slowly and dirtily."
    requires:
      nodes: [distribution_grid]
      state: ["chemical_balance < 0 OR power_balance_kw > 200"]
      resources: {salt_kg: 30000, iron_kg: 5000, graphite_kg: 1000}
      labor_person_days: 1000000
    unlocks:
      jobs: [electrolyze_brine]
      effects: ["Caustic (alumina refining, CO2 scrubbers), chlorine, hydrogen. A 300 kW load"]
    reads_state: [grid_kw]
    writes_state: [has_caustic, has_hydrogen]
    pages_bundle: industrial_chemistry
    without_pages: "2x labor"
    numbers_status: "Castner-Kellner (1890s) sourced"
    sources: ["https://en.wikipedia.org/wiki/Chloralkali_process"]
    tags: [accelerant]
    notebook: >
      Pass current through salt water and it splits: chlorine at one electrode, hydrogen and sodium
      hydroxide at the other. Electricity does the work that used to take acids and furnaces.

  # ---- Beat 4: the cold problem ----------------------------------------------------------------------------------------
  - id: compressors
    name: Multistage compressors
    stage: 4
    beat: 4
    kind: project
    critical_path: true
    problem: "You can't hold gas at a hundred atmospheres; single-stage pumps overheat and leak."
    requires:
      nodes: [welding, bearings_lubrication]
      state: ["tolerance_mm <= 0.1"]
      resources: {steel_kg: 15000}
      labor_person_days: 1200000
    unlocks:
      effects: ["Compressed gas to ~200 atm with intercooling. Adds the pressure dial to the liquefier workshop. A 200 kW load"]
    reads_state: [steel_quality, tolerance_mm]
    writes_state: [max_pressure_atm]
    pages_bundle: cryogenics
    without_pages: "2x labor"
    numbers_status: "Estimate"
    sources: ["https://en.wikipedia.org/wiki/Gas_compressor"]
    tags: []
    notebook: >
      Squeezing a gas heats it, and hot gas is harder to squeeze. Multistage compressors compress a
      little, cool the gas in a water jacket, then compress again. The pistons need the machine
      shop's best fit and the cylinders thick steel.

  - id: vacuum_and_dewar
    name: High vacuum and insulated flasks
    stage: 4
    beat: 4
    kind: project
    critical_path: true
    problem: "Anything colder than ice boils away in minutes in an ordinary container, and no pump gets the air out of glass."
    requires:
      nodes: [glassworks, distribution_grid]
      resources: {mercury_kg: 200, glass_kg: 1000, silver_kg: 20}
      labor_person_days: 700000
    milestones:
      - {at: 0.5, id: mercury_pump, effect: "Sprengel pumps: high vacuum in glass; incandescent lamps as a side effect"}
    unlocks:
      effects: ["Dewar flasks: store and move cryogenic liquids. High vacuum also underlies Stage 5 vacuum tubes"]
    reads_state: [glassblowers_trained]
    writes_state: [has_high_vacuum, has_dewar]
    pages_bundle: cryogenics
    without_pages: "2x labor"
    numbers_status: "Sprengel 1865, Dewar 1892 sourced"
    sources: ["https://en.wikipedia.org/wiki/Vacuum_flask", "https://en.wikipedia.org/wiki/Sprengel_pump"]
    tags: []
    notebook: >
      Heat moves by conduction, convection and radiation. A vacuum between two glass walls stops the
      first two and silvering reflects most of the third. Sprengel's mercury-drop pump made the vacuum;
      Dewar built the flask in 1892 to keep his liquefied gases.

  # ---- Beat 5: the liquefier -----------------------------------------------------------------------------------------------
  - id: cascade_liquefier
    name: Cascade liquefaction
    stage: 4
    beat: 5
    kind: workshop
    workshop: liquefier_workshop
    route: [T_cascade]
    critical_path: true
    problem: "Air won't liquefy until about -190 C, and nothing you have gets close."
    requires:
      nodes: [compressors, vacuum_and_dewar]
      resources: {steel_kg: 3000, copper_kg: 1000}
      labor_person_days: 600000
    unlocks:
      effects: ["Opens the liquefier workshop with the method dial set to cascade: a few liters a day, proving it can be done. The screen shows why it can't scale"]
    writes_state: [has_liquid_air, cryo_process]
    pages_bundle: cryogenics
    without_pages: "Same"
    numbers_status: "Pictet and Cailletet 1877 sourced; the scale cap is a simplification"
    sources: ["https://en.wikipedia.org/wiki/Liquid_oxygen"]
    tags: [trap, substantive]
    trap_lesson: "A cascade chills each gas with the one liquefied before it: a chain of fragile stages, each capping the next. It proved oxygen could be liquefied; it never made tons."
    notebook: >
      In 1877 Pictet and Cailletet each liquefied a few drops of oxygen by cooling it step by step
      with other liquefied gases. Industrial liquid air waited eighteen years for a process that
      fed on its own cold.

  - id: linde_liquefier
    name: Regenerative liquefier
    stage: 4
    beat: 5
    kind: decision_option
    route: [A_linde]
    critical_path: true
    problem: "Throttling compressed air cools it only slightly. Unless the cold is kept and reused, it never adds up."
    requires:
      nodes: [cascade_liquefier]
      resources: {copper_kg: 3000, steel_kg: 8000}
      labor_person_days: 1200000
    unlocks:
      effects: ["method: throttle_regenerative; adds the exchanger_length dial. Continuous liquid air, no moving parts in the cold, ~2 kWh/kg (estimate)"]
    reads_state: [max_pressure_atm]
    writes_state: [has_liquid_air, cryo_process]
    pages_bundle: cryogenics
    without_pages: "Different route: the exchanger dial starts at 1 and the plant visibly stalls above -100 C; the counterflow idea is offered after 2 failed runs"
    numbers_status: "Hampson and Linde 1895; Linde's ~3 L/h first yield sourced; energy per kg is an estimate"
    sources: ["https://en.wikipedia.org/wiki/Hampson%E2%80%93Linde_cycle"]
    tags: [substantive]
    notebook: >
      Compressed air cools slightly when it expands through a valve. Linde's trick was to send that
      slightly cooled air back past the incoming air, so each round starts colder than the last.
      After days, air drips out as a pale blue liquid.

  - id: claude_expander
    name: Expansion-engine liquefier
    stage: 4
    beat: 5
    kind: decision_option
    route: [B_claude]
    critical_path: false
    problem: "Throttling through a valve wastes most of the cooling that compressed air could give."
    requires:
      nodes: [cascade_liquefier, alloy_steels]
      state: ["tolerance_mm <= 0.05"]
      resources: {alloy_steel_kg: 4000, copper_kg: 3000}
      labor_person_days: 2000000
    unlocks:
      effects: ["method: expansion_engine. About half the kWh/kg of Linde; needs a precise cold piston and lubricants that don't freeze. Trains machinists"]
    reads_state: [tolerance_mm, bearing_quality]
    writes_state: [has_liquid_air, cryo_process, machinists_trained]
    pages_bundle: cryogenics
    without_pages: "4x labor; cold lubrication fails repeatedly"
    numbers_status: "Claude 1902 sourced; efficiency ratio is an estimate"
    sources: ["https://en.wikipedia.org/wiki/Georges_Claude"]
    tags: [substantive, accelerant, skill_builder]
    notebook: >
      Gas that expands while pushing a piston does work, and that work comes out of its heat, so
      it cools far more than gas expanding through a valve. Claude's engine ran at around -140 C
      in 1902, which meant finding lubricants that didn't freeze.

  - id: air_separation
    name: Rectifying column
    stage: 4
    beat: 5
    kind: project
    critical_path: true
    problem: "Liquid air is four-fifths nitrogen, and a rocket burning it would lose most of its punch."
    requires:
      any_of: [[linde_liquefier], [claude_expander]]
      resources: {copper_kg: 5000, steel_kg: 5000}
      labor_person_days: 1000000
    unlocks:
      jobs: [separate_oxygen]
      effects: ["Adds the column dial. Liquid oxygen above 99%; liquid nitrogen as by-product. lox_kg_per_day is now a number on screen"]
    reads_state: [cryo_process]
    writes_state: [lox_kg_per_day, has_lox]
    pages_bundle: cryogenics
    without_pages: "Different route: partial boil-off separation (poor purity) until the column is found from watching which gas boils first"
    numbers_status: "Linde's column 1902; boiling points sourced"
    sources: ["https://en.wikipedia.org/wiki/Air_separation"]
    tags: [substantive]
    notebook: >
      Nitrogen boils at -196 C and oxygen at -183 C, a small gap but enough. In a tall column,
      rising vapor and falling liquid pass over each other on trays; at each tray a little more
      nitrogen escapes upward and a little more oxygen runs down.

  # ---- Beat 6: the light metal (optional) -------------------------------------------------------------------------------------
  - id: aluminum
    name: Aluminum
    stage: 4
    beat: 6
    kind: project
    critical_path: false
    problem: "A preview of the rocket workshop shows a steel vehicle about two and a half times the mass of an aluminum one."
    requires:
      nodes: [chlor_alkali, arc_furnace]
      state: ["mineral_sites has bauxite", "power_balance_kw > 500"]
      resources: {bauxite_kg: 50000, graphite_kg: 10000, steel_kg: 10000}
      labor_person_days: 3000000
    milestones:
      - {at: 0.4, id: bayer_alumina, effect: "Caustic digestion of bauxite: pure alumina"}
      - {at: 0.7, id: cryolite, effect: "Synthetic cryolite from fluorite and acid: the solvent for alumina"}
      - {at: 1.0, id: hall_heroult, effect: "Molten-salt electrolysis: aluminum at ~20 kWh/kg (estimate). An 800 kW load per ton/day"}
    unlocks:
      jobs: [smelt_aluminum]
      effects: ["Later: age-hardened alloy (duralumin) as a small follow-on project unlocks aluminum tanks (structural fraction 0.09 vs 0.14) in the rocket workshop"]
    reads_state: [grid_kw, mineral_sites, has_caustic]
    writes_state: [has_aluminum, has_duralumin]
    pages_bundle: industrial_chemistry
    without_pages: "4x labor; finding a solvent for alumina is the non-obvious step"
    numbers_status: "Bayer 1888, Hall-Heroult 1886, theoretical 6.23 kWh/kg, ~15 in 2003 sourced; early figure is an estimate. Cryolite must be synthetic here"
    sources: ["https://en.wikipedia.org/wiki/Hall%E2%80%93H%C3%A9roult_process", "https://en.wikipedia.org/wiki/Seydi%C5%9Fehir_mine"]
    tags: [substantive, accelerant, labor_sink]
    notebook: >
      Aluminum holds its oxygen too tightly for carbon to steal it. Hall and Heroult both found in
      1886 that alumina dissolves in molten cryolite at about 960 C and a strong current then splits
      it. It takes many times more electricity per kilogram than steel takes in coal.

  # ---- Beat 7: liquid fuel (optional) ----------------------------------------------------------------------------------------------
  - id: oil
    name: Oil wells and refinery
    stage: 4
    beat: 7
    kind: project
    critical_path: false
    problem: "Your chemists want a liquid fuel that doesn't need farmland, and the survey marks oil seeps to the southeast."
    requires:
      nodes: [open_hearth]
      state: ["mineral_sites has oil_seeps", "rail_km > 0"]
      resources: {steel_kg: 40000, wood_kg: 50000}
      labor_person_days: 3000000
    milestones:
      - {at: 0.5, id: first_well, effect: "Cable-tool rig strikes oil: crude for burning"}
      - {at: 1.0, id: refinery, effect: "Fractional distillation: kerosene, lubricating oil, fuel oil"}
    unlocks:
      jobs: [pump_crude, refine_crude]
      effects: ["Kerosene: the denser rocket fuel option (workshop Isp 310 vs 280). Mineral oil improves bearing_quality"]
    reads_state: [mineral_sites, rail_km]
    writes_state: [has_kerosene, bearing_quality]
    pages_bundle: survey_oil_hydro
    without_pages: "Hand-dug pits at seeps (tiny yield) until drilling is learned, 2x labor"
    numbers_status: "Oil at Batman (SE Turkey) and Baku; depths and rates are estimates"
    sources: ["https://en.wikipedia.org/wiki/Petroleum_industry_in_Azerbaijan"]
    tags: [substantive, accelerant, labor_sink]
    notebook: >
      A cable-tool rig lifts a heavy bit and drops it, pounding a hole through rock. Crude is a
      mixture of hydrocarbon chains; heat it and collect what condenses at each temperature:
      gasoline, then kerosene, then heavier oils. Kerosene became the rocket fuel of choice because
      it's dense and easy to handle.

  - id: gate_liquid_oxygen
    name: "Gate: liquid oxygen on tap"
    stage: 4
    beat: 8
    kind: gate
    critical_path: true
    problem: "The colony makes liquid oxygen in bulk, every day."
    requires:
      nodes: [air_separation, welding]
      state: ["energy_w_per_person >= 2500", "lox_kg_per_day >= 500"]
    unlocks:
      effects: ["Stage 5 opens: precision and propulsion"]
    reads_state: [has_aluminum, has_kerosene, cryo_process, has_alloy_steel, power_balance_kw]
    notebook: >
      A rocket is mostly oxidizer by mass, and now you can make it. Everything from here is about
      burning it fast, hot, and without the engine destroying itself.
