    reads_state: [has_liquid_air, cryo_process]
    writes_state: [lox_kg_per_day, has_lox]
    pages_bundle: cryogenics
    without_pages: "3x labor"
    fallback: "Let liquid air boil partly away (nitrogen boils first); poor purity"
    energy_effect: "Part of the liquefaction load"
    numbers_status: "Linde's rectification column (1902); oxygen boils at -183 C and nitrogen at -196 C (sourced)"
    sources: ["https://en.wikipedia.org/wiki/Air_separation", "https://en.wikipedia.org/wiki/Liquid_oxygen"]
    tags: []
    notebook: >
      Nitrogen boils at -196 C and oxygen at -183 C, a small gap but enough. In a tall column,
      rising vapor and falling liquid pass over and over each other on trays. At each tray a
      little more nitrogen escapes upward and a little more oxygen runs down. The bottom collects
      nearly pure liquid oxygen, pale blue and faintly magnetic.

