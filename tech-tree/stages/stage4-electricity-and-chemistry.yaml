    reads_state: [tolerance_mm, machinists_trained]
    writes_state: [has_liquid_air, cryo_process]
    pages_bundle: cryogenics
    without_pages: "4x labor; cold lubrication fails repeatedly"
    fallback: "Linde"
    energy_effect: "Less electricity per kg than Linde"
    numbers_status: "Georges Claude's expansion engine process (1902) is sourced; efficiency ratio is an estimate"
    sources: ["https://en.wikipedia.org/wiki/Georges_Claude"]
    tags: [skill_builder]
    notebook: >
      Gas that expands while pushing a piston does work, and that work comes out of its heat, so
      it cools far more than gas expanding through a valve. Georges Claude built an expansion
      engine that ran at around -140 C in 1902, which meant finding lubricants that didn't freeze.
      Modern plants use tiny turbines instead of pistons.

  - id: cascade_liquefier
    name: Cascade liquefaction
    stage: 4
    kind: decision_option
    critical_path: false
    route: [T_cascade]
    problem: "You want liquid oxygen without building a high-pressure regenerative plant."
    requires:
      nodes: [compressors, dewar_flasks]
      resources: {steel_kg: 3000, copper_kg: 1000}
      labor_person_days: 700000
    unlocks:
      effects: ["Liquid oxygen in laboratory batches of liters per day; can't reach the gate's 500 kg/day without dozens of plants"]
    reads_state: []
    writes_state: [has_liquid_air]
    pages_bundle: cryogenics
    without_pages: "Same"
    fallback: "Linde or Claude"
    energy_effect: "Small"
    numbers_status: "Cascade methods (Pictet, Cailletet 1877; Kamerlingh Onnes) are sourced; the scale cap is a game simplification"
    sources: ["https://en.wikipedia.org/wiki/Liquid_oxygen"]
    tags: [trap]
    trap_lesson: "A cascade chills each gas with the one liquefied before it. It proved oxygen could be liquefied in 1877, but it's a laboratory method that doesn't scale to tons."
    notebook: >
      In 1877 Raoul Pictet and Louis Cailletet each liquefied a few drops of oxygen by cooling it
      step by step with other liquefied gases. It proved the point and won them fame, but a
      cascade is a chain of fragile stages, and each one limits the next. Industrial liquid air
      waited another 18 years for a process that fed on its own cold.

  - id: air_separation
    name: Rectifying column
