# Stage 2: Iron  (redesigned; see ../stage2-redesign.md)
# Bloomery iron to the first working steam engine.
# Target: ~90 min of play, ~22 in-game years, ~25 substantive decisions, several hundred small ones.
#
# Three layers: pressures (bars that move on their own), workshops (design screens with dials),
# nodes (projects, upgrades, forks). Nodes carry `beat` (1-8) for the order they're introduced.

stage: 2
name: Iron
opening_problem: "Copper and bronze keep your crews working, but copper ore is scarce and iron ore is everywhere, if you can get a fire hot enough."
heartbeat: fuel_balance
labor_tier: people
gate:
  id: gate_steam
  name: A working steam engine
  condition:
    energy_w_per_person: 600
    state: ["mine_drained_by_engine == true", "mine_water_m < 0"]   # built AND the mine really drained (2026-09-27)
  routes: [A_newcomen, B_watt, C_high_pressure, T_savery]

# Job rates per worker-day (open question 25; owner playtest 2026-09-27: Stage 2 had none, so nothing
# past the bloomery could ever be made). All estimates unless noted; sources in the node comments.
jobs:
  mine_iron_ore:
    name: Mine iron ore
    what: "30 kg of ore a day with a tool"                       # deposit_choice comment
    why: "Every bloom and every ton of cast iron starts as ore someone dug."
    outputs: {iron_ore_kg: 30}
    tool: true
  smelt_iron_bloom:
    name: Smelt iron (bloomery)
    what: "Uses 30 kg ore and 30 kg charcoal. Makes 6 kg of bloom"   # charcoal:ore ~1:1, ~17-20% of ore as bloom (bloomery sources)
    why: "Iron never melts in a bloomery; the ore is reduced to a spongy bloom soaked in slag."
    inputs: {iron_ore_kg: 30, charcoal_kg: 30}
    outputs: {bloom_kg: 6}
    burns: {charcoal_kg: 30}
  smith_bloom:
    name: Smith the bloom
    what: "Uses 15 kg bloom and 6 kg charcoal. Makes 10 kg of bar iron"   # a third lost to scale and slag (bloom_smithing notebook)
    why: "Hammering squeezes the slag out and welds the iron grains into a bar you can work."
    inputs: {bloom_kg: 15, charcoal_kg: 6}
    outputs: {iron_kg: 10}
    burns: {charcoal_kg: 6}
  forge_iron_tools:
    name: Forge iron tools
    what: "Uses 1.5 kg iron and half a kg of charcoal per tool. Makes 4 tools"   # bloom_smithing comment
    why: "Iron tools last three times as long as bronze."
    inputs: {iron_kg: 6, charcoal_kg: 2}
    outputs: {iron_tools: 4}
    burns: {charcoal_kg: 2}
  mine_coal:
    name: Mine coal
    what: "400 kg of coal a day with a tool"                      # coal_seam_choice comment says 500 at the outcrop; estimate
    why: "Coal is fuel nobody had to grow this century."
    outputs: {coal_kg: 400}
    tool: true
  coke_coal:
    name: Coke coal
    what: "Uses 160 kg coal. Makes 100 kg coke"                   # coke yield 60-70% (coal_seam_choice)
    why: "Coke is strong enough to hold up a tall furnace charge; raw coal crumbles and smothers it."
    inputs: {coal_kg: 160}
    outputs: {coke_kg: 100}
  quarry_stone:
    name: Quarry stone
    what: "250 kg of limestone a day with a tool"
    why: "Stone for furnace stacks, and limestone for lime."
    outputs: {stone_kg: 250}
    tool: true
  burn_lime:
    name: Burn lime
    what: "Uses 100 kg limestone and 50 kg wood. Makes 56 kg lime"   # lime_burning comment; 56% by mass is exact
    why: "Lime lets furnace slag flow without taking the iron with it."
    inputs: {stone_kg: 100, wood_kg: 50}
    outputs: {lime_kg: 56}
    burns: {wood_kg: 50}
  run_blast_furnace:
    name: Run the blast furnace
    what: "Uses 60 kg ore, 50 kg charcoal and 4 kg lime. Makes 30 kg iron"   # ~1 t/day from a crew of ~30; ~1.5 t charcoal per t
    why: "Iron with 4% carbon melts: tons a day instead of kilograms."
    inputs: {iron_ore_kg: 60, charcoal_kg: 50, lime_kg: 4}
    outputs: {iron_kg: 30}
    burns: {charcoal_kg: 50}
  run_coke_furnace:
    name: Run the coke furnace
    what: "Uses 60 kg ore, 80 kg coke and 4 kg lime. Makes 30 kg iron"   # coke burns ~1.6x charcoal by mass here; estimate
    why: "The same furnace on coke: no trees burned."
    inputs: {iron_ore_kg: 60, coke_kg: 80, lime_kg: 4}
    outputs: {iron_kg: 30}
    burns: {coke_kg: 80}
  bail_mine:
    name: Bail the mine
    what: "Rag-and-chain pumps: each pumper lifts water back out of the workings"   # 100 pumpers hold ~2,000 t of digging a month; estimate
    why: "Every mine below the water table is a well you're trying to keep empty."
    tool: true
  tend_engine:
    name: Tend the engine
    what: "Uses 250 kg coal a day. Delivers 10 kWh of pumping work"   # a 4 kW Newcomen on ~2.5 t coal/day with 10 tenders (worked example)
    why: "An engine, not people, keeps the mine dry, as long as it's fed coal."
    inputs: {coal_kg: 250}
    outputs: {engine_work_kwh: 10}

# Iron tools last three times as long as bronze (tool_wear pressure).
tools:
  iron_tools: {life_worker_days: 1200, metal: true}

# Either/or decisions, about one a year (owner playtest 2026-09-27). Starting one option closes the
# other for good.
choices:
  - id: iron_deposit
    prompt: "Two iron deposits. Dig the lean bog iron now, or build a road to the rich hillside ore?"
    options: [bog_iron, hillside_ore]
  - id: coal_seam
    prompt: "Two coal seams. Take the sulfurous one at the surface, or dig the clean one deep and far?"
    options: [near_seam, far_seam]
  - id: mine_water_plan
    prompt: "The workings are flooding. Dig a drainage tunnel to the valley, or keep opening fresh pits?"
    options: [drainage_adit, shallow_pits]
  - id: engine_path
    prompt: "Where do the machinists go: a mill that bores true cylinders, or one that rolls even boiler plate?"
    options: [boring_mill, plate_rolling]

# ---------------------------------------------------------------------------------------------
# Pressures: simulated bars. `drives` names the state variable; `red_when` is the failing threshold;
# `effect_when_red` is what the player sees stop working. Nothing here ends the run.
# ---------------------------------------------------------------------------------------------
pressures:
  - id: fuel_balance
    name: Fuel
    drives: fuel_balance
    heartbeat: true
    rises_with: ["every furnace, kiln and engine draws charcoal or coal per day"]
    red_when: "fuel_balance < 0"
    effect_when_red: "More fuel is burned than made each day: stocks are falling, and furnaces stall when they run out"
    answers: [coppicing, coal_mining, watt_engine]
    introduced_in_beat: 4
    # A flow bar: today's charcoal, coal and coke made minus used, in kg (estimates, package F shape).
    model: {per_unit_produced: {charcoal_kg: 1, coal_kg: 1, coke_kg: 1}, per_unit_consumed: {charcoal_kg: -1, coal_kg: -1, coke_kg: -1}, min: -20000, max: 20000, flow: true}

  - id: forest
    name: Forest within two days' walk
    drives: forest_cover
    rises_with: ["charcoal burning (100 kg wood per 20 kg charcoal)", "construction wood"]
    red_when: "forest_cover < 30"
    effect_when_red: "Wood per gatherer falls by half, and charcoal crews walk a day to the trees"
    answers: [coppicing, coal_mining]
    introduced_in_beat: 4
    # forest_cover moves with Stage 1's wood_distance model; this bar adds the deeper penalty.
    red_modifiers: {rate: {gather_wood: 0.5}}

  - id: mine_water
    name: Water in the mine
    drives: mine_water_m
    rises_with: ["cumulative ore and coal dug: the workings deepen ~1 m per 2,000 t (estimate)", "seasonal: wet season adds 2 m"]
    red_when: "mine_water_m > 0 (workings below the water table)"
    effect_when_red: "The deep galleries are under water: ore and coal come only from the upper workings, at 40%"
    answers: [mine_drainage_manual, drainage_adit, shallow_pits, savery_pump, newcomen_engine, watt_engine, high_pressure_engine]
    introduced_in_beat: 6
    # Estimates: digging deepens the workings ~1 m per 2,000 t; each effective pumper lifts 0.0001 m a
    # day, so hand pumping slows the water but can't beat a busy mine (200 pumpers: 0.02 m/day against
    # ~0.04 m/day of digging); each kWh of engine work 0.002 m (a 10-tender Newcomen, ~100 kWh/day,
    # drains 0.2 m a day).
    model: {per_unit_produced: {iron_ore_kg: 0.0000005, coal_kg: 0.0000005, engine_work_kwh: -0.002}, per_worker: {bail_mine: -0.0001}, min: -5, max: 30}
    red_modifiers: {rate: {mine_iron_ore: 0.4, mine_coal: 0.4}}

  - id: tools_iron
    name: Tools
    drives: tool_wear
    rises_with: ["every tool user wears a tool; iron lasts 3x bronze, quenched iron 6x"]
    red_when: "tool_wear < 1"          # tools < tool users; the engine keeps tool_wear = tools / users
    effect_when_red: "Workers without tools drop to quarter speed (as in Stage 1)"
    answers: [bloom_smithing, quench_temper]
    introduced_in_beat: 1   # carried from Stage 1 (same variable; the shell draws one Tools bar)

  - id: iron_quality
    name: Iron quality
    drives: iron_quality
    rises_with: ["sulfur from high-sulfur coke", "phosphorus from bog iron"]
    red_when: "iron_quality < 2 (of 3)"
    effect_when_red: "Iron tools wear out a third faster; the smiths report cracks at the forge"
    answers: [hillside_ore, far_seam, furnace_workshop]
    introduced_in_beat: 3
    red_modifiers: {toolLife: {iron_tools: 0.67}}

# ---------------------------------------------------------------------------------------------
# Workshops: design screens. Dials are added in the order listed, each by the node named.
# ---------------------------------------------------------------------------------------------
workshops:
  - id: furnace_workshop
    extends: true
    dials:
      - {id: ore_choice, name: "Ore", options: [bog_iron, hillside_ore], added_by: iron_prospecting,
         effect: "Grade sets yield (bog ~40% Fe, hillside ~60%); bog iron carries phosphorus and lowers iron_quality",
         basis: "Bloomeries want ore above ~50% Fe ([Rom & Bohr](https://donwagner.dk/arch-iron/resources/Rom_Bohr_Bloomery.pdf))"}
      - {id: charge_mode, name: "Charge", options: [copper, iron_bloom, iron_blast], added_by: bloomery,
         effect: "Iron bloomery: charcoal:ore near 1:1; below ~0.8 the ore doesn't reduce, above ~1.3 the iron comes out as brittle cast lumps",
         basis: "Experimental bloomery smelts ([Bloomery](https://en.wikipedia.org/wiki/Bloomery))"}
      - {id: stack_height, name: "Stack height (m)", range: [3, 10], added_by: blast_furnace,
         effect: "Above ~5 m with a strong blast, iron absorbs enough carbon to melt and run continuously: cast iron, ~1 t/day, instead of 30 kg blooms",
         basis: "Cast iron at ~4% C melts near 1,150 C"}
      - {id: blast_source, name: "Blast", options: [treadwheels, water_wheel], added_by: blast_furnace,
         effect: "A water wheel blows a tall furnace with no walkers; treadwheels need ~60 walkers per furnace (estimate)",
         basis: "Du Shi's water-powered bellows, 31 AD"}
      - {id: furnace_fuel, name: "Fuel", options: [charcoal, coke], added_by: coal_mining,
         effect: "Coke frees the forest. Coke from the high-sulfur seam carries sulfur into the iron: iron_quality -1 (hot shortness)",
         basis: "Darby's 1709 coke smelting relied on unusually low-sulfur coal"}
      - {id: flux, name: "Lime per ton of ore", range: [0, 300], added_by: lime_burning,
         effect: "Lime lets slag flow without taking iron with it: yield +25% in the blast furnace. Too much thickens the slag",
         basis: "Limestone flux forms calcium silicate slag"}
    play:
      bloom_ore_kg: 1000             # "per campaign: 1 t ore" (smelt_iron_bloom's rate note)

  - id: engine_workshop
    name: Engine workshop
    opens_with: savery_pump
    loop: "Design, see live outputs, build (costs iron and months), run. 5-10 design iterations per stage."
    dials:
      - {id: lift_height, name: "Lift height (m)", range: [5, 60], added_by: savery_pump,
         effect: "A suction pump stops at ~10 m however well it's made. Above that the Savery design needs steam pressure, and its soldered boiler bursts",
         basis: "The atmosphere supports a water column of ~10 m"}
      - {id: cylinder_diameter, name: "Cylinder diameter (m)", range: [0.3, 1.5], added_by: newcomen_engine,
         effect: "Piston force = pressure difference x area. 0.5 m at 12 strokes/min of 2 m: ~4 kW (estimate), enough to drain a mid-size mine",
         basis: "Atmospheric engine: ~50 kPa effective vacuum x piston area"}
      - {id: boiler_pressure, name: "Boiler pressure (atm)", range: [1, 6], added_by: newcomen_engine,
         effect: "More power from the same cylinder, more coal, more stress on the boiler",
         basis: "Force scales with pressure; Trevithick's engines ran several atmospheres"}
      - {id: plate, name: "Plate thickness (mm) and type", range: [3, 20], options: [hammered, rolled], added_by: newcomen_engine,
         effect: "Hoop stress = P x r / t must stay under the plate's safe limit. Hammered plate has thin spots (safe limit ~half of rolled). The screen shows a safety margin and, for margins under 1.5, the year the boiler will burst",
         basis: "Thin-wall pressure vessel: sigma = P r / t"}
      - {id: condenser, name: "Separate condenser", options: [none, separate], added_by: watt_engine,
         effect: "Cuts coal by about three quarters. Needs a bored cylinder (boring_mill) to seal against steam",
         basis: "Watt 1765; ~75% fuel saving ([Watt engine](https://en.wikipedia.org/wiki/Watt_steam_engine))"}
    outputs: [water_lifted_per_day, coal_per_day, iron_cost_kg, safety_margin, years_to_failure]
    failure_rule: "Deterministic: years_to_failure = f(safety_margin, plate type). Shown before building. A burst kills the crew, destroys the engine, and adds 1 to boiler_explosions."

# ---------------------------------------------------------------------------------------------
# Nodes
# ---------------------------------------------------------------------------------------------
nodes:

  # ---- Beat 1: finding iron -----------------------------------------------------------------
  - id: iron_prospecting
    name: Iron prospecting
    stage: 2
    beat: 1
    kind: project
    critical_path: true
    problem: "Iron ore is everywhere, but your crews can't tell rich ore from red rock."
    requires:
      nodes: [gate_reliable_smelting]
      labor_person_days: 200000   # trimmed (owner playtest 2026-09-27: a decision every year, a shorter stage); estimate
    unlocks:
      effects: ["Finds two deposits: bog iron nearby, hillside ore farther off"]
    reads_state: [bundles_taken]
    writes_state: [deposits_known]
    pages_bundle: survey_iron_coal
    without_pages: "Different route: the deposits are found in the order prospecting parties stumble on them (bog iron first, hillside after ~3 more years of searching), so the phosphorus problem is met before the choice exists"
    numbers_status: "Estimate"
    sources: ["https://donwagner.dk/arch-iron/resources/Rom_Bohr_Bloomery.pdf"]
    tags: []
    notebook: >
      Iron is the fourth most common element in the crust, but most of it is locked in rock too
      lean to smelt. Good ore is heavy for its size and leaves a red-brown streak on unglazed
      pottery. Bog iron forms where groundwater carries dissolved iron into marshes; it's easy to
      dig and full of phosphorus. Hillside hematite is richer and cleaner and usually farther away.

  - id: bog_iron
    name: Open the bog iron
    stage: 2
    beat: 1
    kind: decision_option
    critical_path: true
    problem: "Two deposits: bog iron a day's walk away, lean and phosphorus-rich, or hillside ore three days away, rich and clean, that needs a road."
    tradeoff: "Ore right away, a day's walk off. It's lean and full of phosphorus: everything made from it is a grade worse."
    requires:
      nodes: [iron_prospecting]
      labor_person_days: 60000
    unlocks:
      jobs: [mine_iron_ore]       # 30 kg/day with a tool (estimate)
      effects: ["Ore now, ~40% Fe; iron quality -1 (phosphorus)"]
    adjusts_state: {iron_quality: -1}
    reads_state: [deposits_known]
    writes_state: [iron_ore_grade, iron_ore_phosphorus, haul_distance_days]
    writes_values: {iron_ore_grade: 40, iron_ore_phosphorus: high}
    pages_bundle: survey_iron_coal
    without_pages: "See iron_prospecting"
    numbers_status: "Grades and distances are estimates; phosphorus in bog iron is well attested"
    sources: ["https://en.wikipedia.org/wiki/Bog_iron"]
    tags: [substantive]
    notebook: >
      Phosphorus dissolves into iron and can't be hammered out. A little makes iron harder; more
      makes it brittle when cold. In a bloomery some phosphorus goes into the slag, but bog iron
      carries so much that the bars stay cold-short. Ancient smiths worked around it; your Stage 3
      steelmakers will find it's the one thing the Bessemer converter can't remove.

  - id: hillside_ore
    name: Road to the hillside ore
    stage: 2
    beat: 1
    kind: decision_option
    critical_path: true
    problem: "Two deposits: bog iron a day's walk away, lean and phosphorus-rich, or hillside ore three days away, rich and clean, that needs a road."
    tradeoff: "A three-day road before the first basket of ore. Then rich, clean ore: a third more bloom from every smelt, and nothing lowers iron quality."
    requires:
      nodes: [iron_prospecting]
      resources: {blades: 2000}
      labor_person_days: 500000   # trimmed (owner playtest 2026-09-27: a decision every year, a shorter stage); estimate
    milestones:
      - {at: 0.5, id: wheelbarrows, effect: "Wheelbarrows and carts: the second half of the road goes faster"}
    unlocks:
      jobs: [mine_iron_ore]
      effects: ["Ore ~60% Fe, low phosphorus: a third more bloom per smelt"]
    modifiers: {yield: {smelt_iron_bloom: 1.33}}   # 60% vs 40% Fe; estimate
    reads_state: [deposits_known]
    writes_state: [iron_ore_grade, iron_ore_phosphorus, haul_distance_days]
    writes_values: {iron_ore_grade: 60, iron_ore_phosphorus: low}
    pages_bundle: survey_iron_coal
    without_pages: "See iron_prospecting"
    numbers_status: "Grades and distances are estimates"
    sources: ["https://donwagner.dk/arch-iron/resources/Rom_Bohr_Bloomery.pdf"]
    tags: [substantive, labor_sink]
    notebook: >
      Hematite, the red iron oxide, is the richest common iron ore: up to 70% iron by weight, and
      clean. Bloomeries want ore above about half iron; below that, so much iron goes into the slag
      that almost nothing is left to hammer. A long road to good ore is often the cheaper iron.
  # ---- Beat 2: the bloomery -----------------------------------------------------------------
  - id: bloomery
    name: Bloomery furnace
    stage: 2
    beat: 2
    kind: workshop
    workshop: furnace_workshop
    critical_path: true
    problem: "Iron doesn't melt until 1,538 C, far beyond what your copper furnaces reach."
    requires:
      any_of: [[bog_iron, pot_bellows], [bog_iron, wind_furnaces], [hillside_ore, pot_bellows], [hillside_ore, wind_furnaces]]
      resources: {clay_kg: 40000, charcoal_kg: 10000}
      labor_person_days: 500000   # trimmed (owner playtest 2026-09-27: a decision every year, a shorter stage); estimate
    unlocks:
      jobs: [smelt_iron_bloom]    # per campaign: 1 t ore + ratio x 1 t charcoal -> yield% bloom
      effects: ["Furnace workshop gains the iron charge mode: the Stage 1 air and fuel dials now apply to iron, with a narrower window"]
    reads_state: [iron_ore_grade, has_bellows, has_wind_furnaces]
    writes_state: [has_iron]
    pages_bundle: metallurgy_1
    without_pages: "Different route: the dials start at wrong defaults and the notebook entry is blank until three campaigns have run; the player finds the ratio by trial (typically 8-10 campaigns instead of 2-3)"
    numbers_status: "Charcoal:ore ~1:1 and ore-to-bloom ~0.17 are sourced from experimental smelts; campaign length is a game value"
    sources:
      - "https://en.wikipedia.org/wiki/Bloomery"
      - "https://www.tandfonline.com/doi/full/10.1080/00934690.2018.1479085"
    tags: [hard_wall_explained, substantive]
    notebook: >
      A bloomery never melts iron. At around 1,200 C, carbon monoxide strips oxygen from the ore
      and leaves a spongy lump of solid iron soaked in liquid slag, called a bloom. The rock in the
      ore melts into that slag, which is mostly iron silicate, so much of the iron leaves with the
      waste. Experimental smelts often recover only a sixth of the ore's weight as usable iron.

  - id: forced_draft_for_iron
    name: Forced draft at the iron site
    stage: 2
    beat: 2
    kind: project
    critical_path: false
    problem: "Your Stage 1 blast works only where it was built. The iron ore is somewhere else."
    tradeoff: "Bloomeries run half again as fast, for 300,000 person-days of building that the main road can't use."
    requires:
      nodes: [bloomery]
      state: ["NOT has_bellows OR NOT has_wind_furnaces"]
      resources: {pots: 300, wood_kg: 5000}
      labor_person_days: 300000   # trimmed (owner playtest 2026-09-27: a decision every year, a shorter stage); estimate
    unlocks:
      effects: ["The draft you skipped in Stage 1, built at the iron site: bloomeries run half again as fast"]
    modifiers: {rate: {smelt_iron_bloom: 1.5}}   # estimate
    reads_state: [has_bellows, has_wind_furnaces]
    writes_state: [has_bellows, has_wind_furnaces]
    pages_bundle: metallurgy_1
    without_pages: "Same"
    numbers_status: "Game structure"
    sources: []
    tags: [substantive]
    notebook: >
      Wind furnaces are tied to a ridge; bellows go where the ore is. A colony that chose wind in
      Stage 1 now pays for bellows or for porters. Real Bronze and Iron Age smelting sites cluster
      where ore, fuel and draft could all be had at once, and that was rare.

  # ---- Beat 3: smithing and steel edges -------------------------------------------------------
  - id: bloom_smithing
    name: Smithing the bloom
    stage: 2
    beat: 3
    kind: project
    critical_path: true
    problem: "The bloom is a spongy lump full of slag that crumbles if you try to use it."
    requires:
      nodes: [bloomery]
      state: ["bloom_kg > 500"]
      resources: {copper_kg: 300, charcoal_kg: 5000}
      labor_person_days: 300000   # trimmed (owner playtest 2026-09-27: a decision every year, a shorter stage); estimate
    unlocks:
      jobs: [smith_bloom, forge_iron_tools]   # bloom -> bar at two thirds; 1.5 kg bar per tool, lasts 3x bronze
      effects: ["Iron enters the tool mix: bar iron from the bloom, then iron tools that last three times as long as bronze"]
    reads_state: [trained_smiths, iron_quality]
    writes_state: []
    pages_bundle: metallurgy_1
    without_pages: "1.5x labor; first bars are slaggy"
    numbers_status: "Estimate"
    sources: []
    tags: [substantive]
    notebook: >
      Reheat the bloom to bright yellow and hammer it, and the liquid slag squirts out while the
      iron grains weld together. Repeat, fold, repeat. The slag strands left inside give wrought
      iron its fibrous grain, which is why it bends slowly before it breaks. A good smith loses a
      third of the bloom to scale and slag on the way to a bar.

  - id: quench_temper
    name: Quench trials
    stage: 2
    beat: 3
    kind: project
    critical_path: false
    problem: "Wrought-iron edges are soft; iron tools bend and need constant resharpening."
    tradeoff: "Iron tools last twice as long. The trials cost months of smiths and iron before the first success."
    requires:
      nodes: [bloom_smithing]
      state: ["iron_tools > 1000"]
      resources: {charcoal_kg: 4000, iron_kg: 500}
      labor_person_days: 200000   # trimmed (owner playtest 2026-09-27: a decision every year, a shorter stage); estimate
    unlocks:
      effects:
        - "A research loop: each trial (a month, 20 smiths, 50 kg iron) tests one carburizing time and quench. Deterministic sequence: with Metallurgy I pages, trial 2 succeeds; without, trial 6"
        - "Success: iron tools last 2x longer (6x bronze); has_steel_edges for Stage 3 machining"
    reads_state: [bundles_taken]
    writes_state: [has_steel_edges]
    modifiers: {toolLife: {iron_tools: 2}}   # the 2x in `effects`
    pages_bundle: metallurgy_1
    without_pages: "Different route: more trials, each shown with its result (too soft, cracked in the quench, right), so the player learns the window by seeing it"
    numbers_status: "Roughly 0.6-1% carbon for hardenable tool steel is standard; trial counts are game values"
    sources: ["https://en.wikipedia.org/wiki/Quenching"]
    tags: [substantive, research_loop]
    notebook: >
      Pure iron is soft. Pack it in charcoal and hold it red-hot for hours, and carbon soaks into
      the surface. Heat that steel skin until it's no longer magnetic, then plunge it into water,
      and the carbon gets trapped in a strained, very hard crystal called martensite. Too hard is
      brittle, so smiths reheat it gently to temper it back.

  # ---- Beat 4: the forest ---------------------------------------------------------------------
  - id: coppicing
    name: Coppiced woodland
    stage: 2
    beat: 4
    kind: project
    critical_path: false
    problem: "Charcoal crews walk a day or more to standing forest, and the woods are retreating."
    tradeoff: "The forest regrows fast enough to feed the furnaces for good. A long, labor-hungry project that pays back slowly."
    requires:
      nodes: [bloomery]
      state: ["forest_cover < 75"]   # was < 60, which a Stage 1 coppice could make unreachable; estimate
      labor_person_days: 800000     # was 1,500,000 (owner playtest 2026-09-27); estimate
    pressure_per_day: {wood_distance: 0.1}   # adds 0.1 cover points of regrowth a day; estimate
    unlocks:
      effects: ["Managed forest regrows on a 15-year cycle; sets a sustainable charcoal ceiling (~1 t charcoal per 4 ha per year, estimate) instead of a cliff. Repeatable: more area, more ceiling"]
    reads_state: [forest_cover]
    writes_state: [forest_cover, coppice_area]
    pages_bundle: primitive_technology
    without_pages: "Workers notice regrowth from stumps after 2 years; 1.5x labor"
    numbers_status: "Coppice rotations of 7-20 years are sourced; yields are estimates"
    sources: ["https://en.wikipedia.org/wiki/Coppicing"]
    tags: [labor_sink, substantive]
    notebook: >
      Cut many broadleaf trees near the ground and the stump sends up a crowd of straight new
      shoots. Harvest them every decade or two and the same roots keep producing for centuries.
      Medieval English ironworks ran for generations on coppice. The catch is area: one charcoal
      blast furnace could need thousands of hectares.

  - id: coal_mining
    name: Coal
    stage: 2
    beat: 4
    kind: project
    critical_path: true
    problem: "The forest can't feed both the charcoal kilns and the furnaces."
    requires:
      nodes: [bloom_smithing]   # was iron_prospecting + "forest_cover < 50 OR fuel_balance < 0": a good player
                                # never met it, and beat gating held beats 5-7 behind it (owner playtest 2026-09-27)
      labor_person_days: 250000   # trimmed (owner playtest 2026-09-27: a decision every year, a shorter stage); estimate
    unlocks:
      effects: ["Prospecting finds two seams: a sulfurous one at the surface, a clean one deep and far"]
    reads_state: [bundles_taken]
    writes_state: [has_coal]
    pages_bundle: survey_iron_coal
    without_pages: "Different route: only the near seam is found at first; its sulfur is discovered by using it. The far seam turns up after 3 more years of prospecting"
    numbers_status: "Heating values standard; rates are estimates"
    sources: ["https://en.wikipedia.org/wiki/Coal"]
    tags: [new_energy_source]
    notebook: >
      Coal is plant matter buried for millions of years and cooked until it's mostly carbon. A
      kilogram holds about as much energy as a kilogram of charcoal, but nobody had to grow it this
      century. The catch is what was buried with the plants, especially sulfur.

  - id: near_seam
    name: Work the near seam
    stage: 2
    beat: 4
    kind: decision_option
    critical_path: true
    problem: "A seam at the surface a day away, sulfurous, or a deeper, cleaner seam three days off."
    tradeoff: "Coal now, from the surface. It's sulfurous: iron made with its coke cracks at the forge (iron quality falls by one)."
    requires:
      nodes: [coal_mining]
      labor_person_days: 100000   # trimmed (owner playtest 2026-09-27: a decision every year, a shorter stage); estimate
    unlocks:
      jobs: [mine_coal, coke_coal]   # 400 kg coal per worker-day; 1.6 kg coal -> 1 kg coke (estimates)
      effects: ["Coal now; its coke carries sulfur"]
    adjusts_state: {iron_quality: -1}
    reads_state: [has_coal]
    writes_state: [coal_sulfur, has_coke]
    writes_values: {coal_sulfur: high}
    pages_bundle: survey_iron_coal
    without_pages: "See coal_mining"
    numbers_status: "Coke yield 60-70% is typical (estimate); seam properties are game values"
    sources: ["https://en.wikipedia.org/wiki/Coke_(fuel)"]
    tags: [substantive]
    notebook: >
      Bake coal without air and the tar, gas and some of the sulfur cook off, leaving coke: hard,
      porous carbon strong enough to hold up a tall furnace charge. Some sulfur stays. In iron it
      forms a film between the grains that melts at forging heat, so the bar cracks under the
      hammer. Metallurgists call it hot shortness.

  - id: far_seam
    name: Sink the far seam
    stage: 2
    beat: 4
    kind: decision_option
    critical_path: true
    problem: "A seam at the surface a day away, sulfurous, or a deeper, cleaner seam three days off."
    tradeoff: "A road and a deep pit before any coal. Then clean coke and good iron, but the deep pit floods sooner."
    requires:
      nodes: [coal_mining]
      resources: {blades: 1500}
      labor_person_days: 600000   # trimmed (owner playtest 2026-09-27: a decision every year, a shorter stage); estimate
    unlocks:
      jobs: [mine_coal, coke_coal]
      effects: ["Clean coal; the mine water rises faster"]
    pressure_per_day: {mine_water: 0.004}   # the deep pit lets in water on its own; estimate
    reads_state: [has_coal]
    writes_state: [coal_sulfur, has_coke]
    writes_values: {coal_sulfur: low}
    pages_bundle: survey_iron_coal
    without_pages: "See coal_mining"
    numbers_status: "Seam properties are game values"
    sources: ["https://en.wikipedia.org/wiki/Coal_mining"]
    tags: [substantive, labor_sink]
    notebook: >
      Coal from deeper, older seams is often lower in sulfur. Abraham Darby's success with coke in
      1709 owed a lot to the unusually clean coal near Coalbrookdale; ironmasters elsewhere who
      copied him with sulfurous coal got brittle iron and gave up for decades.
  # ---- Beat 5: the blast furnace --------------------------------------------------------------
  - id: lime_burning
    name: Lime burning
    stage: 2
    beat: 5
    kind: project
    critical_path: false
    problem: "Slag carries away too much iron, and furnace walls crumble after a few campaigns."
    requires:
      nodes: [bloomery]
      state: ["campaigns_run > 10"]
      resources: {wood_kg: 30000, clay_kg: 10000}
      labor_person_days: 250000   # trimmed (owner playtest 2026-09-27: a decision every year, a shorter stage); estimate
    unlocks:
      jobs: [quarry_stone, burn_lime]   # 100 kg limestone + 50 kg wood -> 56 kg lime
      effects: ["Adds the flux dial; lime mortar makes furnace linings last 3x as many campaigns"]
    reads_state: []
    writes_state: [has_lime]
    pages_bundle: primitive_technology
    without_pages: "No penalty; lime plaster was known here in the Neolithic"
    numbers_status: "CaCO3 -> CaO + CO2 (56% by mass) is exact; wood per kg is an estimate"
    sources: ["https://en.wikipedia.org/wiki/Lime_kiln"]
    tags: []
    notebook: >
      Heat limestone above about 900 C and it gives off carbon dioxide, leaving quicklime. Mixed
      with water and left in air, lime slowly turns back into stone, which is why mortar hardens.
      In a furnace it does a different job: it bonds with the silica in the ore and forms a slag
      that flows without stealing iron.

  - id: water_wheels
    name: Water wheels
    stage: 2
    beat: 5
    kind: project
    critical_path: false
    problem: "Working the bellows is the most exhausting job in the colony, and it caps how big a furnace can be."
    tradeoff: "Wheels blow the furnaces: every bloomery and blast furnace runs 30% faster. A large build that competes with the road to the blast furnace."
    requires:
      nodes: [bloom_smithing]
      state: ["river_sites > 0"]
      resources: {wood_kg: 40000, iron_kg: 400}
      labor_person_days: 600000   # trimmed (owner playtest 2026-09-27: a decision every year, a shorter stage); estimate
    unlocks:
      effects: ["blast_source: water_wheel becomes available; each site gives ~3 kW (estimate) and can drive bellows, a trip hammer or a boring mill, one at a time until more wheels are built. Assigning the wheel is a recurring small decision"]
    reads_state: [river_sites]
    writes_state: [water_wheels_built]
    modifiers: {rate: {smelt_iron_bloom: 1.3, run_blast_furnace: 1.3, run_coke_furnace: 1.3}}   # wheel-driven bellows; estimate
    pages_bundle: steam_engines
    without_pages: "Undershot wheels only (half output), 1.5x labor"
    numbers_status: "Du Shi (31 AD) sourced; power per wheel is an estimate"
    sources: ["https://en.wikipedia.org/wiki/Du_Shi"]
    tags: [new_energy_source, substantive]
    notebook: >
      A water wheel turns the weight of falling water into rotation. An overshot wheel, fed from the
      top, captures more than half the energy of the fall. In 31 AD a Han official named Du Shi
      connected wheels to furnace bellows. From then until steam, industry clustered on rivers.

  - id: blast_furnace
    name: Blast furnace
    stage: 2
    beat: 5
    kind: workshop
    workshop: furnace_workshop
    critical_path: true
    problem: "A bloomery makes 30 kg a day and wastes most of the iron in slag. You need tons."
    requires:
      nodes: [bloom_smithing, lime_burning]
      resources: {stone_kg: 100000, clay_kg: 60000, iron_kg: 2000}   # was 400,000 stone and a cumulative-iron condition nothing measured; estimates
      labor_person_days: 500000   # trimmed (owner playtest 2026-09-27: a decision every year, a shorter stage); estimate
    milestones:
      - {at: 0.5, id: furnace_stack_raised, effect: "The stack is up; the workshop shows the stack_height dial and a preview of tons/day before the first campaign"}
    unlocks:
      jobs: [run_blast_furnace]   # continuous; ~1 t pig iron/day; ~1.5 t charcoal or ~5 t coke per t cold-blast (estimate; hot blast cuts it)
      effects: ["Adds stack_height and blast_source dials. Cast iron output; pig iron must be fined for tools or cast for parts"]
    reads_state: [forest_cover, coppice_area, has_lime, water_wheels_built, coal_sulfur]
    writes_state: [has_cast_iron, forest_cover, iron_quality]
    pages_bundle: metallurgy_2
    without_pages: "Different route: the first two campaigns freeze (too short a stack, too weak a blast) and the notebook fills in only after; ~3 more campaigns"
    numbers_status: "Chinese cast iron by the 5th century BCE is sourced; tonnage and fuel rates are estimates"
    sources: ["https://en.wikipedia.org/wiki/History_of_metallurgy_in_China"]
    tags: [labor_sink, substantive]
    notebook: >
      Make the furnace tall, blow harder, and keep feeding ore, fuel and limestone from the top.
      Iron sinking through the hot zone absorbs carbon, and iron with about 4% carbon melts near
      1,150 C instead of 1,538 C. Now it comes out as a liquid you can tap and cast. Chinese
      founders poured cast iron by the 5th century BCE, nearly two thousand years before Europe.

  - id: coke_blast
    name: Coke in the blast furnace
    stage: 2
    beat: 5
    kind: upgrade
    critical_path: false
    problem: "The blast furnace eats a forest a year in charcoal, and the woods can't keep up."
    tradeoff: "Iron from coal instead of trees, so the forest stops shrinking for the furnace. Near-seam coke makes brittle iron."
    requires:
      nodes: [blast_furnace]
      any_of: [[near_seam], [far_seam]]
      resources: {coke_kg: 5000}
      labor_person_days: 200000   # trimmed (owner playtest 2026-09-27: a decision every year, a shorter stage); estimate
    unlocks:
      jobs: [run_coke_furnace]    # 60 kg ore + 80 kg coke + 4 kg lime -> 30 kg iron (estimate)
      effects: ["A second way to run the furnace: coke instead of charcoal, so iron no longer costs trees"]
    reads_state: [coal_sulfur]
    writes_state: []
    pages_bundle: metallurgy_2
    without_pages: "1.5x labor"
    numbers_status: "Darby's coke smelting at Coalbrookdale (1709) is sourced; rates are estimates"
    sources: ["https://en.wikipedia.org/wiki/Abraham_Darby_I"]
    tags: [substantive, new_energy_source]
    notebook: >
      Abraham Darby first smelted iron with coke at Coalbrookdale in 1709. Coke holds up a tall
      charge without crumbling, and it comes from coal instead of trees, so the size of an ironworks
      stopped depending on the size of its forest.

  - id: finery_forge
    name: Finery forge
    stage: 2
    beat: 5
    kind: project
    critical_path: false
    problem: "Cast iron shatters under a hammer; you need tough wrought iron for tools, chains and plate."
    requires:
      nodes: [blast_furnace]
      resources: {iron_kg: 1000, charcoal_kg: 8000}
      labor_person_days: 400000   # trimmed (owner playtest 2026-09-27: a decision every year, a shorter stage); estimate
    modifiers: {yield: {forge_iron_tools: 1.25}}   # tougher bar: a quarter more tools per kg; estimate
    unlocks:
      jobs: [fine_pig_iron]       # 1.3 kg pig + 1 kg charcoal -> 1 kg bar (estimate); no rates yet, see modifiers
      effects: ["Bar iron by the ton; bloomeries can be retired or kept for their lower fuel use per bar"]
    reads_state: [has_cast_iron]
    writes_state: [wrought_iron_capacity]
    pages_bundle: metallurgy_2
    without_pages: "1.5x labor"
    numbers_status: "Estimate"
    sources: ["https://en.wikipedia.org/wiki/Finery_forge"]
    tags: [substantive]
    notebook: >
      The same carbon that lets cast iron melt makes it brittle. A finery remelts pig iron in a
      blast of air so oxygen burns the carbon out, leaving a pasty lump to hammer into bars. It's
      the bloomery run backwards: add carbon to melt iron, then remove it to make iron useful.
  - id: sand_casting
    name: Sand-mold founding
    stage: 2
    beat: 5
    kind: project
    critical_path: true
    problem: "Stone and clay molds are too small and slow for pipes, cylinders and gears."
    requires:
      nodes: [blast_furnace]
      resources: {iron_kg: 3000, wood_kg: 10000}
      labor_person_days: 300000   # trimmed (owner playtest 2026-09-27: a decision every year, a shorter stage); estimate
    unlocks:
      jobs: [cast_iron_parts]
    reads_state: [has_cast_iron]
    writes_state: [has_foundry]
    pages_bundle: metallurgy_2
    without_pages: "1.5x labor; many castings full of holes"
    numbers_status: "Estimate"
    sources: ["https://en.wikipedia.org/wiki/Sand_casting"]
    tags: []
    notebook: >
      Pack damp sand with a little clay around a wooden pattern, lift the pattern out, and you
      have a cavity in the shape of the part. Pour, cool, break the sand away, reuse it. Sand lets
      gas escape, so fewer bubbles get trapped. Darby patented sand-cast iron pots in 1707, and
      cheap cast iron became an everyday material.

  - id: trip_hammer
    name: Trip hammers
    stage: 2
    beat: 5
    kind: upgrade
    critical_path: false
    problem: "Hammering bars takes more smiths than you have, and the fined iron piles up unworked."
    tradeoff: "Smiths and toolmakers work twice as fast. Only worth it once bar iron is the bottleneck."
    requires:
      nodes: [water_wheels, bloom_smithing]   # was [water_wheels, finery_forge]: hammers worked blooms before fineries (2026-09-27)
      resources: {iron_kg: 800, wood_kg: 10000}
      labor_person_days: 250000   # trimmed (owner playtest 2026-09-27: a decision every year, a shorter stage); estimate
    unlocks:
      effects: ["Bar and tool output x2 at a wheel site"]
    modifiers: {rate: {smith_bloom: 2, forge_iron_tools: 2}}   # estimate
    reads_state: [water_wheels_built]
    writes_state: []
    pages_bundle: steam_engines
    without_pages: "1.5x labor"
    numbers_status: "Estimate"
    sources: []
    tags: []
    notebook: >
      A cam on a turning shaft lifts a heavy hammer and drops it, dozens of times a minute, for as
      long as the river runs. Trip hammers turned smithing from a craft of strength into a craft
      of positioning. They were in use in Han China and spread through medieval Europe.

  # ---- Beat 6: water in the mine --------------------------------------------------------------
  - id: mine_drainage_manual
    name: Bucket chains and rag pumps
    stage: 2
    beat: 6
    kind: project
    critical_path: false
    problem: "The galleries have gone below the water table, and they're flooding faster than buckets can bail."
    requires:
      nodes: [bloom_smithing]
      state: ["mine_water_m > 0"]
      resources: {iron_kg: 1500, wood_kg: 30000}
      labor_person_days: 200000   # trimmed (owner playtest 2026-09-27: a decision every year, a shorter stage); estimate
    unlocks:
      jobs: [bail_mine]           # each pumper lifts 0.0003 m a day (mine_water model); need grows with digging
      effects: ["Pumpers can hold the water back. They are a standing labor cost the engine will later remove"]
    reads_state: [mine_water_m]
    writes_state: []
    pages_bundle: none
    without_pages: "No penalty"
    numbers_status: "Rag-and-chain pumps are well attested; flow rates are estimates"
    sources: ["https://en.wikipedia.org/wiki/Chain_pump"]
    tags: [labor_sink, teaches_bottleneck, substantive]
    notebook: >
      Every mine below the water table is a well you're trying to keep empty. A rag-and-chain pump
      drags balls of rag up a tight pipe on an endless chain, each pushing a slug of water ahead of
      it. The deeper the mine, the more people it takes to lift the same water. That growing crowd
      of pumpers is the problem the steam engine solves.

  - id: drainage_adit
    name: Drainage adit
    stage: 2
    beat: 6
    kind: project
    critical_path: false
    problem: "Pumpers are a tenth of the colony and the water still gains in the wet season."
    tradeoff: "A tunnel to the valley: a huge dig, then the mine drains itself forever with no fuel and no pumpers."
    requires:
      nodes: [mine_drainage_manual]
      state: ["terrain_allows_adit == true"]
      resources: {iron_kg: 2000, wood_kg: 60000}
      labor_person_days: 700000   # trimmed (owner playtest 2026-09-27: a decision every year, a shorter stage); estimate
    pressure_per_day: {mine_water: -0.05}   # drains by gravity, forever; estimate
    milestones:
      - {at: 0.5, id: adit_halfway, effect: "The tunnel breaks into an old gallery: pumpers needed -30%"}
    unlocks:
      effects: ["Drains the mine by gravity down to the adit level, forever, with no fuel. Water below that level still needs pumping. Only offered where a valley lies below the workings"]
    reads_state: [mine_water_m]
    writes_state: [has_adit, mine_water_m]
    pages_bundle: none
    without_pages: "No penalty"
    numbers_status: "Estimate. Historic adits ran for kilometers and took decades"
    sources: ["https://en.wikipedia.org/wiki/Adit"]
    tags: [labor_sink, substantive]
    notebook: >
      An adit is a tunnel driven from a hillside into the mine so water runs out on its own.
      Cornish and German miners cut adits kilometers long, some taking a generation. It costs
      labor once and nothing after, which is a good trade for a colony with idle hands. It can't
      go below the valley floor, so eventually the pumps come back.

  - id: shallow_pits
    name: New shallow pits
    stage: 2
    beat: 6
    kind: decision_option
    critical_path: false
    problem: "Rather than fight the water, you could abandon the deep workings and dig fresh pits."
    tradeoff: "Cheap and quick: fresh pits put the diggers back above the water for a while. The deep workings stay flooded."
    requires:
      nodes: [mine_drainage_manual]
      labor_person_days: 100000
    adjusts_state: {mine_water_m: -5}   # the new workings start 5 m above the water; estimate
    unlocks:
      effects: ["Ore and coal output return to full for ~4 years per pit as the new workings deepen; each pit clears ~50 ha of land (forest_cover -2) and adds haul distance. Repeatable. Postpones the engine, never replaces it"]
    reads_state: [forest_cover]
    writes_state: [haul_distance_days]
    pages_bundle: none
    without_pages: "Same"
    numbers_status: "Game values"
    sources: []
    tags: [substantive]
    notebook: >
      Bell pits, shallow shafts widened at the bottom, were how most coal and ore was dug before
      pumps. When one flooded or collapsed, miners moved a few meters and sank another. It works
      as long as there's land, and it leaves a pocked landscape that's still visible in old
      mining districts.

  # ---- Beat 7: fire engines -------------------------------------------------------------------
  - id: savery_pump
    name: Savery fire engine
    stage: 2
    beat: 7
    kind: workshop
    workshop: engine_workshop
    route: [T_savery]
    critical_path: false
    problem: "Pumpers can't keep up; steam might do it without pistons at all."
    tradeoff: "Cheap and quick, but a suction pump can't lift water more than about 10 m: it drains only the top of the mine."
    requires:
      nodes: [mine_drainage_manual, bloom_smithing]   # was [..., sand_casting]: a copper boiler and pipes, no big castings (2026-09-27)
      resources: {copper_kg: 800, iron_kg: 2000}
      labor_person_days: 400000
    unlocks:
      effects:
        - "Opens the engine workshop with one dial: lift height. Set it above ~10 m and the screen explains why the pump stops there and what pushing harder does to the boiler"
        - "Built at 9 m: drains the top of the mine. Pumpers -20%"
    modifiers: {rate: {bail_mine: 1.25}}   # drains the top 9 m: pumpers lift a quarter more; estimate
    reads_state: [mine_water_m]
    writes_state: [boiler_explosions, engine_type]
    pages_bundle: steam_engines
    without_pages: "Same; the trap is the same for everyone"
    numbers_status: "Suction lift of ~9-10 m and Savery's boiler failures are sourced"
    sources:
      - "https://en.wikipedia.org/wiki/Steam_power_during_the_Industrial_Revolution"
      - "https://www.britannica.com/biography/Thomas-Savery"
    tags: [trap, substantive]
    trap_lesson: "A pump that sucks can never lift water more than ~10 m, because it's air pressure, not the pump, that pushes the water up."
    notebook: >
      A suction pump doesn't pull water; it removes air above the water so the atmosphere can push
      it up the pipe. The atmosphere weighs as much as a water column about 10 meters tall, so
      that's the limit however good the pump. Savery's 1698 engine then used steam pressure to push
      water higher, and his soldered boilers burst. Mines are much deeper than 10 meters.

  - id: newcomen_engine
    name: Atmospheric engine
    stage: 2
    beat: 7
    kind: workshop
    workshop: engine_workshop
    route: [A_newcomen]
    critical_path: true
    problem: "Steam can make a vacuum; a piston in a cylinder can turn that vacuum into a pumping stroke, at any depth."
    requires:
      nodes: [sand_casting, mine_drainage_manual]
      any_of: [[near_seam], [far_seam]]   # an engine eats coal
      resources: {iron_kg: 12000, copper_kg: 1000, wood_kg: 30000}   # was 20,000 iron; estimate
      labor_person_days: 400000   # trimmed (owner playtest 2026-09-27: a decision every year, a shorter stage); estimate
    unlocks:
      jobs: [tend_engine]         # 250 kg coal -> 10 kWh of pumping per tender-day (the 4 kW worked example)
      effects:
        - "Adds cylinder_diameter, boiler_pressure and plate dials, one per design session"
        - "At 1-2 atm with a loose cast cylinder: Newcomen. Drains the mine; burns ~4x the coal of a condensing engine"
        - "The safety margin is shown before building; a thin boiler is a choice with a known date"
    reads_state: [has_coal, plate_quality]
    writes_state: [engine_type, mine_drained_by_engine, coal_per_engine_kw, boiler_explosions]
    pages_bundle: steam_engines
    without_pages: "Different route: the plate dial starts hidden and the first boiler is built at the default (margin 1.3); the dial appears after the first failure or after 2 years, whichever comes first"
    numbers_status: "Newcomen efficiency ~0.3-0.5% and Watt's ~75% saving are sourced; the 4 kW / 2-3 t coal per day example is an estimate"
    sources:
      - "https://en.wikipedia.org/wiki/Newcomen_atmospheric_engine"
      - "https://en.wikipedia.org/wiki/Steam_engine"
    tags: [substantive]
    notebook: >
      Newcomen's 1712 engine fills a cylinder with steam, then sprays in cold water. The steam
      collapses, leaving a partial vacuum, and the atmosphere pushes the piston down. The piston
      only needs to fit roughly, sealed by a layer of water on top. But the cylinder is chilled
      every stroke and reheated by the next, so most of the coal goes into warming iron back up.

  - id: boring_mill
    name: Cylinder boring mill
    stage: 2
    beat: 7
    kind: project
    critical_path: false
    route: [B_watt]
    problem: "Cast cylinders come out oval and tapered, so a tight piston jams in one place and leaks steam in another."
    tradeoff: "True cylinders: the path to the condensing engine, four times the work from the same coal."
    requires:
      nodes: [sand_casting]
      any_of: [[water_wheels], [newcomen_engine]]
      resources: {iron_kg: 8000}
      labor_person_days: 700000   # trimmed (owner playtest 2026-09-27: a decision every year, a shorter stage); estimate
    unlocks:
      effects: ["Bored cylinders: the condenser option becomes possible; machinists_trained +60 (estimate)"]
    reads_state: [draft_roster]
    writes_state: [has_boring_mill, machinists_trained]
    pages_bundle: machine_tools
    without_pages: "Different route: not offered until an engine has run 2 years and the workshop has shown its steam leakage; then 2x labor"
    numbers_status: "Wilkinson's 1774 boring machine is sourced"
    sources:
      - "https://en.wikipedia.org/wiki/John_Wilkinson_(industrialist)"
      - "https://www.gracesguide.co.uk/Early_Boring_Mills"
    tags: [skill_builder, substantive]
    notebook: >
      Earlier borers held the cutter on a bar supported at one end, so it sagged and wandered.
      John Wilkinson ran the bar right through the casting and supported it at both ends. His
      cylinders were round and straight enough that James Watt, who had spent years unable to find
      anyone to make one, could finally build his engine.

  - id: watt_engine
    name: Condensing engine
    stage: 2
    beat: 7
    kind: workshop
    workshop: engine_workshop
    route: [B_watt]
    critical_path: false
    problem: "The atmospheric engine spends most of its coal reheating the cylinder every stroke."
    requires:
      nodes: [boring_mill, newcomen_engine]
    unlocks:
      effects: ["Adds the condenser dial. A condensing design drains the same mine on ~1/4 the coal; rotative version powers Stage 3 workshops"]
    reads_state: [has_boring_mill, machinists_trained]
    writes_state: [engine_type, mine_drained_by_engine, coal_per_engine_kw]
    modifiers: {yield: {tend_engine: 4}}   # ~75% coal saving: four times the work per ton (Watt, sourced)
    pages_bundle: steam_engines
    without_pages: "Different route: the condenser dial appears only after a Newcomen engine has run for 2 years (you must see the waste before the fix is conceivable); with the pages it's available at once"
    numbers_status: "Separate condenser (1765) and ~75% fuel saving are sourced"
    sources: ["https://en.wikipedia.org/wiki/Watt_steam_engine"]
    tags: [skill_builder, substantive]
    notebook: >
      Watt condensed the steam in a separate vessel kept cold, while the working cylinder stayed
      hot all the time. Nothing gets reheated, so the fuel goes into work. His engines burned about
      a quarter of the coal of a Newcomen engine doing the same job. They needed a cylinder accurate
      enough to seal against steam, which is why the boring mill comes first.

  - id: plate_rolling
    name: Rolling mill for boiler plate
    stage: 2
    beat: 7
    kind: project
    critical_path: false
    route: [C_high_pressure]
    problem: "Hammered plate has thin spots, and the workshop's safety margin says so."
    tradeoff: "Even plate: the path to the high-pressure engine, twice the work per ton of coal and compact enough to move."
    requires:
      nodes: [finery_forge, water_wheels]
      resources: {iron_kg: 15000}
      labor_person_days: 700000   # trimmed (owner playtest 2026-09-27: a decision every year, a shorter stage); estimate
    unlocks:
      jobs: [roll_plate]
      effects: ["plate: rolled becomes available; safe stress doubles, so the same margin needs half the thickness or allows twice the pressure"]
    reads_state: []
    writes_state: [has_rolling_mill, plate_quality]
    pages_bundle: metallurgy_2
    without_pages: "2x labor"
    numbers_status: "Estimate"
    sources: ["https://en.wikipedia.org/wiki/Rolling_(metalworking)"]
    tags: [substantive]
    notebook: >
      Passing hot iron between heavy rollers squeezes it to a uniform thickness, far more evenly
      than hammering. A boiler is only as strong as its thinnest spot, because the hoop stress in a
      cylinder is pressure times radius over wall thickness. Rolled plate is what made high-pressure
      steam survivable.

  - id: high_pressure_engine
    name: High-pressure engine
    stage: 2
    beat: 7
    kind: workshop
    workshop: engine_workshop
    route: [C_high_pressure]
    critical_path: false
    problem: "Beam engines are huge; you want power small enough to move."
    requires:
      nodes: [newcomen_engine]
      any_of: [[plate_rolling], [finery_forge]]
    unlocks:
      effects: ["boiler_pressure above 3 atm becomes available. Compact engines; head start on locomotives. The margin bar decides the explosion date; rolled plate makes it safe"]
    reads_state: [plate_quality]
    writes_state: [engine_type, mine_drained_by_engine, boiler_explosions]
    modifiers: {yield: {tend_engine: 2}}   # estimate
    pages_bundle: steam_engines
    without_pages: "2x labor on the first high-pressure boiler"
    numbers_status: "Trevithick's high-pressure engines (c. 1800) are sourced; the margin model is a game design"
    sources: ["https://en.wikipedia.org/wiki/Richard_Trevithick"]
    tags: [scar, substantive]
    notebook: >
      Instead of using steam only to make a vacuum, a high-pressure engine pushes the piston with
      steam at several atmospheres. Double the pressure and you get roughly double the power from
      the same cylinder, so the engine shrinks. Richard Trevithick built them around 1800 and put
      one on wheels. The price is stored energy: a burst boiler releases it all at once.

