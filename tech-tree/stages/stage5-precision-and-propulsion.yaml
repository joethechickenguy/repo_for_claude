# Stage 5: Precision and propulsion. Bearings, electronics, guidance, a booster engine, and the ground to fire it from.
# ~90 min, ~25 in-game years. Heartbeat: test-stand time and liquid oxygen.

stage: 5
name: Precision and propulsion
opening_problem: "You can make liquid oxygen by the ton, but nobody here has ever built a machine that burns it on purpose."
heartbeat: stand_time
labor_tier: departments      # unlocked by the departments node in beat 1
gate:
  id: gate_engine
  name: A booster-class engine fires
  condition:
    energy_w_per_person: 3500
    state: ["engine_static_fire_s >= 60", "engine_thrust_kn >= 250", "has_launch_pad == true"]
  routes: [A_steam_turbopump, B_gas_generator, T_pressure_fed_booster]

pressures:
  - id: stand_time
    name: Test stand
    drives: stand_days_balance
    heartbeat: true
    rises_with: ["every static fire takes stand days and burns propellant; designs queue for the stand"]
    red_when: "queue exceeds a year"
    effect_when_red: "Engine designs wait untested; the player chooses which fires first or builds a second stand"
    answers: [test_stand, instrumentation]
    introduced_in_beat: 4
  - id: lox_supply
    name: Liquid oxygen
    drives: lox_balance
    rises_with: ["each static fire burns tons; production is the Stage 4 plant"]
    red_when: "stock < next test's need"
    effect_when_red: "Tests wait for oxygen"
    answers: [lox_plant_scaleup]
    introduced_in_beat: 4
  - id: power_balance
    name: Power
    drives: power_balance_kw
    rises_with: ["oxygen plant, arc furnaces, aluminum, machine shop"]
    red_when: "load exceeds generation"
    effect_when_red: "Brownout; oxygen output falls first"
    answers: [power_station_expansion]
    introduced_in_beat: 1

workshops:
  - id: rocket_engine_workshop
    name: Rocket engine workshop
    opens_with: first_liquid_rocket
    loop: "Design an engine, queue it for the stand, fire, read chamber pressure trace, wall temperature, thrust, and the flaw list. Fix, redesign, refire. 20-40 firings per stage."
    dials:
      - {id: mixture_ratio, name: "Oxidizer : fuel", range: [1.0, 3.0], added_by: first_liquid_rocket,
         effect: "Too fuel-rich: low performance, sooty. Too oxidizer-rich: burns through the wall. The optimum for alcohol/LOX is about 1.3-1.5, for kerosene about 2.3 (estimates for play)",
         basis: "Stoichiometry and flame temperature; engines run fuel-rich for cooling"}
      - {id: chamber_pressure, name: "Chamber pressure (bar)", range: [5, 60], added_by: first_liquid_rocket,
         effect: "Higher pressure: more thrust per kg of engine and better Isp, but the feed system must beat it. Pressure-fed caps at ~20; turbopumps go higher",
         basis: "V-2 ran at 15 bar ([enginehistory.org](https://www.enginehistory.org/Rockets/RPE02/RPE02-2.shtml))"}
      - {id: cooling, name: "Cooling", options: [none, film, regenerative], added_by: regenerative_cooling,
         effect: "None: seconds. Film (extra fuel along the wall): a minute, at an Isp cost. Regenerative (fuel through wall channels): indefinite",
         basis: "V-2 used both film and regenerative cooling"}
      - {id: injector, name: "Injector", options: [showerhead, impinging, impinging_baffled], added_by: injector_design,
         effect: "Showerhead: rough burning, instability likely. Impinging jets: fine mist, higher pressure possible. Baffles: fix combustion instability once seen",
         basis: "F-1 baffles ([NASA](https://www.nasa.gov/history/solving-combustion-instability-and-saving-americas-first-trips-to-the-moon))"}
      - {id: feed, name: "Feed system", options: [pressure_fed, peroxide_turbopump, gas_generator_turbopump], added_by: pressure_fed_booster_engine,
         effect: "Pressure-fed: simple, tanks must beat chamber pressure (heavy on a booster, fine on a lander). Turbopumps: light tanks, a precision machine that runs cryogenic on one side and hot on the other",
         basis: "V-2 peroxide turbopump; F-1 gas generator; Apollo LM descent engine pressure-fed"}
      - {id: nozzle, name: "Nozzle expansion", range: [4, 40], added_by: instrumentation,
         effect: "Sea-level engines want a short nozzle; vacuum stages want a long one. The screen shows Isp at sea level and in vacuum",
         basis: "Overexpansion and flow separation at sea level"}
    outputs: [thrust_kn, isp_sl_s, isp_vac_s, burn_time_s, flaws_found]

nodes:

  # ---- Beat 1: bearings and grinding ------------------------------------------------------------------------------------------
  - id: departments
    name: Departments
    stage: 5
    beat: 1
    kind: project
    critical_path: true
    problem: "Twelve works and an oxygen plant, and you're still setting furnace targets by hand while the engine program waits."
    requires:
      nodes: [gate_liquid_oxygen]
      state: ["works_active >= 10"]
      labor_person_days: 100000
    unlocks:
      effects: ["Labor tier: departments. Five priority sliders (metals, power, chemistry, propulsion, testing) staff the works beneath them. Works and jobs stay one expander away"]
    writes_state: [labor_tier]
    pages_bundle: none
    without_pages: "No penalty"
    numbers_status: "Game structure"
    sources: []
    tags: [substantive]
    notebook: >
      A rocket program is a management problem before it is an engineering one. Peenemunde and
      Huntsville ran as departments with budgets and priorities, and the director's job was deciding
      what got the people this year. From here, so is yours.

  - id: precision_grinding
    name: Precision grinding and ball bearings
    stage: 5
    beat: 1
    kind: project
    critical_path: true
    problem: "Shafts at thousands of rpm seize in plain bearings, and cutting tools can't finish hardened steel."
    requires:
      nodes: [gate_liquid_oxygen, alloy_steels]
      resources: {alloy_steel_kg: 5000, steel_kg: 10000}
      labor_person_days: 1800000
    unlocks:
      jobs: [grind_bearings]
      effects: ["Machine shop: gauging to 0.01 mm; bearings dial: hardened_steel (ball bearings). Gyros, turbines and turbopumps read bearing_quality"]
    reads_state: [tolerance_mm, bearing_quality]
    writes_state: [tolerance_mm, bearing_quality]
    pages_bundle: machine_tools
    without_pages: "3x labor"
    numbers_status: "Estimate"
    sources: ["https://en.wikipedia.org/wiki/Ball_bearing"]
    tags: [skill_builder, labor_sink]
    notebook: >
      A grinding wheel is millions of tiny hard teeth, and it can shape steel that's already been
      hardened, which matters because hardening warps a part. Balls ground round to a hundredth of a
      millimeter let shafts spin fast with almost no friction.

  # ---- Beat 2: electronics ------------------------------------------------------------------------------------------------------
  - id: electronics_lab
    name: Vacuum tubes and radio
    stage: 5
    beat: 2
    kind: project
    critical_path: true
    problem: "Once a rocket leaves the ground, you won't know what it's doing or why it failed."
    requires:
      nodes: [vacuum_and_dewar]
      resources: {glass_kg: 500, copper_kg: 1000, tungsten_kg: 5}
      labor_person_days: 1800000
    milestones:
      - {at: 0.3, id: diode, effect: "A hot filament in a vacuum passes current one way"}
      - {at: 0.6, id: triode, effect: "A grid between filament and plate: amplification"}
      - {at: 1.0, id: radio, effect: "Tuned circuits and amplifiers: radio links and Doppler tracking"}
    unlocks:
      jobs: [make_tubes]
      effects: ["Radio; prerequisite for telemetry, guidance and the radar altimeter. Tungsten filaments if found, carbon otherwise (shorter life)"]
    reads_state: [has_high_vacuum, glassblowers_trained, mineral_sites]
    writes_state: [has_tubes, has_radio]
    pages_bundle: vacuum_tubes_radio
    without_pages: "Different route: the grid (triode) isn't offered until the diode has been in use for two years; 3x labor"
    numbers_status: "De Forest 1906 sourced"
    sources: ["https://en.wikipedia.org/wiki/Triode"]
    tags: [research_loop]
    notebook: >
      A hot filament boils off electrons that fly to a positive plate. A wire mesh between them lets a
      tiny voltage control a large current: amplification. De Forest's 1906 triode made long-distance
      radio possible.

  - id: instrumentation
    name: Instrumentation and telemetry
    stage: 5
    beat: 2
    kind: project
    critical_path: true
    problem: "Engines on test will blow up in a fraction of a second, and nobody will see what happened first."
    requires:
      nodes: [electronics_lab, measurement]
      resources: {copper_kg: 500, glass_kg: 200}
      labor_person_days: 800000
    unlocks:
      effects: ["Pressure and strain gauges recorded fast, radioed from flight. Each test reveals flaws more often (instrumentation_level). Adds the nozzle dial"]
    writes_state: [instrumentation_level]
    pages_bundle: liquid_rocket_engines
    without_pages: "2x labor"
    numbers_status: "Game rule; see failure-modes.md"
    sources: []
    tags: [substantive]
    notebook: >
      A strain gauge is a thin wire glued to a part: when the part stretches, its resistance
      changes. Recorded on a fast oscillograph or radioed from a rocket, these signals show the
      milliseconds before a failure.

  # ---- Beat 3: gyros and control ---------------------------------------------------------------------------------------------------
  - id: gyroscopes
    name: Gyroscopes and thrust vector control
    stage: 5
    beat: 3
    kind: project
    critical_path: true
    problem: "A rocket climbing through wind tips over within seconds unless something senses which way is up and pushes back."
    requires:
      nodes: [precision_grinding]
      resources: {alloy_steel_kg: 300, copper_kg: 200, graphite_kg: 500}
      labor_person_days: 1500000
    milestones:
      - {at: 0.6, id: jet_vanes, effect: "Graphite vanes in the exhaust steer the rocket at liftoff, when fins do nothing"}
    unlocks:
      effects: ["Attitude reference and steering. guidance_quality from bearing_quality and tolerance_mm"]
    reads_state: [bearing_quality, tolerance_mm]
    writes_state: [has_gyros, has_tvc, guidance_quality]
    pages_bundle: guidance
    without_pages: "3x labor; drift is large until balancing is learned"
    numbers_status: "V-2 LEV-3 and graphite jet vanes sourced"
    sources: ["https://en.wikipedia.org/wiki/PIGA_accelerometer", "https://en.wikipedia.org/wiki/V-2_rocket"]
    tags: [skill_builder]
    notebook: >
      A fast-spinning wheel keeps its axis pointing the same way while the rocket turns around it;
      measure the angle and you know the attitude. The V-2 steered with graphite vanes in its exhaust.
      Any drift in the gyro's bearings becomes a steering error.

  # ---- Beat 4: the test stand and the first engine -------------------------------------------------------------------------------------
  - id: test_stand
    name: Engine test stand
    stage: 5
    beat: 4
    kind: project
    critical_path: true
    problem: "You have to fire engines somewhere they can explode without killing anyone, while measuring every second."
    requires:
      nodes: [portland_cement, welding]
      resources: {steel_kg: 30000, cement_kg: 200000}
      labor_person_days: 2500000
    unlocks:
      effects: ["Introduces the stand-time and oxygen bars. Repeatable: a second stand doubles throughput"]
    writes_state: [has_test_stand, stand_days_balance]
    pages_bundle: liquid_rocket_engines
    without_pages: "1.5x labor"
    numbers_status: "Estimate"
    sources: []
    tags: [labor_sink, repeatable]
    notebook: >
      A test stand holds an engine down while it pushes as hard as it would in flight. A thick
      bunker and a long propellant line keep the crew safe from the failures that will come. Most
      rocket problems were found on stands, not in flight.

  - id: first_liquid_rocket
    name: First liquid-fueled engine
    stage: 5
    beat: 4
    kind: workshop
    workshop: rocket_engine_workshop
    critical_path: true
    problem: "Nobody on your team has ever lit an engine that burns liquid oxygen."
    requires:
      nodes: [test_stand]
      any_of: [[oil], [fuel_alcohol]]
      resources: {steel_kg: 500, copper_kg: 100, lox_kg: 2000}
      labor_person_days: 300000
    unlocks:
      effects: ["Opens the rocket engine workshop with mixture ratio and chamber pressure. Pressure-fed, uncooled, showerhead: it runs for seconds and burns through. Trains rocket engineers"]
    reads_state: [draft_roster]
    writes_state: [rocket_engineers_trained]
    pages_bundle: liquid_rocket_engines
    without_pages: "Different route: the mixture dial starts at stoichiometric and the first chambers melt; the notebook fills after the third burn-through"
    numbers_status: "Goddard 1926: 2.5 s, 12.5 m, LOX and gasoline (sourced)"
    sources: ["https://www.nasa.gov/history/95-years-ago-goddards-first-liquid-fueled-rocket/"]
    tags: [substantive, skill_builder]
    notebook: >
      Goddard's first liquid rocket flew on March 16, 1926, for two and a half seconds and about 12
      meters. It was unimpressive to watch. It proved liquid propellants could be pumped, mixed and
      burned under control.

  - id: fuel_alcohol
    name: Fuel alcohol
    stage: 5
    beat: 4
    kind: project
    critical_path: false
    problem: "Engines need tons of fuel, and without oil the only liquid fuel you can make in bulk is alcohol."
    requires:
      nodes: [glassworks]
      state: ["NOT has_kerosene"]
      resources: {steel_kg: 8000, copper_kg: 4000}
      labor_person_days: 1500000
    unlocks:
      jobs: [farm_fuel_crops, ferment_and_distill]
      effects: ["75% ethanol (V-2 style; workshop Isp 280). A standing farming labor sink; cropland reads forest_cover"]
    reads_state: [forest_cover]
    writes_state: [has_ethanol, cropland_ha]
    pages_bundle: industrial_chemistry
    without_pages: "1.5x labor"
    numbers_status: "V-2 fuel of 75% ethanol sourced; crop yields are estimates"
    sources: ["https://www.enginehistory.org/Rockets/RPE02/RPE02-2.shtml"]
    tags: [substantive, labor_sink]
    notebook: >
      Yeast turns sugar into ethanol; distillation concentrates it. The V-2 burned 75% ethanol with
      water, which ran cooler and spared the chamber, at some cost in performance. Much of it came
      from potatoes.

  # ---- Beat 5: keeping the engine alive ---------------------------------------------------------------------------------------------
  - id: regenerative_cooling
    name: Cooling the chamber
    stage: 5
    beat: 5
    kind: project
    critical_path: true
    problem: "Chamber walls melt within seconds; the flame is hotter than any metal."
    requires:
      nodes: [first_liquid_rocket]
      state: ["engine_static_fire_s > 0"]
      resources: {copper_kg: 2000, alloy_steel_kg: 1000}
      labor_person_days: 1200000
    unlocks:
      effects: ["Adds the cooling dial: film, then regenerative"]
    reads_state: [welders_trained]
    writes_state: [has_regen_cooling]
    pages_bundle: liquid_rocket_engines
    without_pages: "Different route: film cooling only for two years of burns; channels appear after the film-cooled engine's Isp penalty is shown"
    numbers_status: "Regenerative cooling on the V-2 and later engines sourced"
    sources: ["https://en.wikipedia.org/wiki/Regenerative_cooling_(rocketry)"]
    tags: [substantive]
    notebook: >
      Combustion gases reach about 3,000 C, above the melting point of steel or copper. Running the
      fuel through channels in the wall before injecting it cools the metal and warms the fuel, which
      then burns a little better.

  - id: injector_design
    name: Injectors
    stage: 5
    beat: 5
    kind: project
    critical_path: true
    problem: "Fuel and oxygen pour in as streams, burn unevenly, and the pressure trace shows the chamber ringing like a bell."
    requires:
      nodes: [regenerative_cooling, precision_grinding]
      resources: {alloy_steel_kg: 500, copper_kg: 500}
      labor_person_days: 1000000
    unlocks:
      effects: ["Adds the injector dial. Impinging jets: fine mixing, higher chamber pressure. Baffles remove combustion_instability once instrumentation has shown it"]
    reads_state: [instrumentation_level]
    writes_state: [injector_quality]
    pages_bundle: liquid_rocket_engines
    without_pages: "3x labor"
    numbers_status: "Estimate"
    sources: ["https://www.nasa.gov/history/solving-combustion-instability-and-saving-americas-first-trips-to-the-moon"]
    tags: [substantive]
    notebook: >
      A drop can only burn from its surface, so the finer the spray the faster it burns. An impinging
      injector aims jets at each other so they shatter into mist. Uneven burning is where combustion
      instability starts; the F-1's engineers cured it with baffles after 2,000 tests.

  # ---- Beat 6: the feed system ---------------------------------------------------------------------------------------------------------
  - id: pressure_fed_booster_engine
    name: Pressure-fed booster
    stage: 5
    beat: 6
    kind: decision_option
    route: [T_pressure_fed_booster]
    critical_path: true
    problem: "Turbopumps look like years of machining; the pressure-fed engine already works on the stand."
    requires:
      nodes: [injector_design]
      resources: {steel_kg: 20000}
      labor_person_days: 1000000
    unlocks:
      effects: ["Adds the feed dial (pressure_fed). Scales to a booster and passes the gate. In the rocket workshop a pressure-fed first stage adds ~0.08 structural fraction and costs ~25 s Isp"]
    writes_state: [feed_system]
    pages_bundle: liquid_rocket_engines
    without_pages: "Same"
    numbers_status: "Pressure-fed upper stages and landers are attested; no pressure-fed booster has reached orbit. Penalties are workshop simplifications"
    sources: ["https://en.wikipedia.org/wiki/Pressure-fed_engine"]
    tags: [trap, substantive]
    trap_lesson: "Tank pressure must exceed chamber pressure; a booster's huge tanks then need boiler-thick walls, and the structural mass eats the Δv. Fine for a lander, ruinous for a first stage."
    notebook: >
      Pressure-fed engines are simple: gas in the tanks pushes propellant into the chamber, no pumps
      to fail. The Apollo lunar module's descent engine was one. But tank wall thickness grows with
      pressure times diameter, and a big first stage lifts a lot of steel for nothing.

  - id: hydrogen_peroxide
    name: Peroxide-steam turbopump
    stage: 5
    beat: 6
    kind: decision_option
    route: [A_steam_turbopump]
    critical_path: false
    problem: "Pushing propellant with tank pressure means booster tanks as thick as boilers."
    requires:
      nodes: [pressure_fed_booster_engine, chlor_alkali, steam_turbine]
      resources: {alloy_steel_kg: 3000, glass_kg: 1000, steel_kg: 1000}
      labor_person_days: 2500000
    milestones:
      - {at: 0.5, id: peroxide_plant, effect: "~80% hydrogen peroxide by electrolysis; decomposed over permanganate it makes hot steam"}
    unlocks:
      effects: ["feed: peroxide_turbopump. Light tanks; chamber pressure to ~25 bar. A standing peroxide hazard"]
    reads_state: [bearing_quality, has_caustic]
    writes_state: [feed_system, turbopump_quality, has_peroxide]
    pages_bundle: propellants
    without_pages: "4x labor; concentrated peroxide decomposes explosively when contaminated"
    numbers_status: "V-2 peroxide-permanganate turbopump sourced"
    sources: ["https://airandspace.si.edu/collection-objects/turbopump-steam-generator-and-frame-v-2-rocket-engine/nasm_A19600013000"]
    tags: [substantive]
    notebook: >
      A turbopump is a turbine on the same shaft as two pumps. The V-2's ran on steam from hydrogen
      peroxide poured over permanganate and delivered over a hundred kilograms of propellant a
      second. It runs cryogenic on one side and hot on the other.

  - id: gas_generator_turbopump
    name: Gas-generator turbopump
    stage: 5
    beat: 6
    kind: decision_option
    route: [B_gas_generator]
    critical_path: false
    problem: "Carrying a third propellant just to drive the pump costs mass and a whole chemical plant."
    requires:
      nodes: [pressure_fed_booster_engine, steam_turbine]
      state: ["has_alloy_steel == true", "bearing_quality >= 3"]
      resources: {alloy_steel_kg: 4000}
      labor_person_days: 3500000
    unlocks:
      effects: ["feed: gas_generator_turbopump. Turbine driven by a fuel-rich burn of the main propellants; chamber pressure to 60 bar. Best booster in the workshop"]
    reads_state: [bearing_quality, has_alloy_steel]
    writes_state: [feed_system, turbopump_quality]
    pages_bundle: liquid_rocket_engines
    without_pages: "4x labor; turbine blades burn until the mixture is run fuel-rich"
    numbers_status: "Gas-generator cycle (F-1, H-1) sourced"
    sources: ["https://en.wikipedia.org/wiki/Gas-generator_cycle"]
    tags: [substantive, accelerant, skill_builder]
    notebook: >
      Burn a little of the main propellants in a small chamber, run it fuel-rich so the gas is cool
      enough for turbine blades, and drive the pump with it. No peroxide plant; a small loss out the
      exhaust. Most American engines of the 1960s worked this way.

  # ---- Beat 7: propellants and the ground --------------------------------------------------------------------------------------------------
  - id: hypergolic_propellants
    name: Storable propellants
    stage: 5
    beat: 7
    kind: project
    critical_path: false
    problem: "Liquid oxygen boils away within days, and a lander must restart its engine after coasting to the Moon."
    requires:
      nodes: [sulfuric_acid, coal_seam_choice]
      any_of: [[niter_beds], [nitrogen_fixation]]
      resources: {steel_kg: 3000, glass_kg: 500}
      labor_person_days: 1500000
    unlocks:
      effects: ["Nitric acid with a coal-tar amine ignites on contact: no igniter, no boil-off. Lander engine option. Nitrate supply caps production"]
    reads_state: [nitrate_source]
    writes_state: [has_hypergolics]
    pages_bundle: propellants
    without_pages: "3x labor; dangerous"
    numbers_status: "Luna 9's KTDU-5A used nitric acid and an amine fuel (sourced)"
    sources: ["https://en.wikipedia.org/wiki/Luna_9"]
    tags: [substantive, accelerant]
    notebook: >
      Some fuel and oxidizer pairs burst into flame on contact. Nitric acid with certain amines from
      coal tar is one, and both stay liquid at room temperature, so an engine can sit for days and
      start every time. Luna 9 landed on them in 1966. Both are corrosive and highly toxic.

  - id: nitrogen_fixation
    name: Fixed nitrogen at scale
    stage: 5
    beat: 7
    kind: decision_option
    critical_path: false
    problem: "Niter beds make a trickle; nitric acid by the ton needs nitrogen pulled from the air."
    requires:
      nodes: [compressors, chlor_alkali]
      state: ["has_nitrate == true"]
      resources: {alloy_steel_kg: 10000, steel_kg: 5000}
      labor_person_days: 3000000
    unlocks:
      effects: ["Choose: arc process (Birkeland-Eyde, electricity-hungry, simple) or ammonia synthesis (Haber-Bosch, 200 atm, catalyst search; needs the industrial chemistry pages). Ostwald nitric acid follows; platinum if found, cobalt oxide otherwise"]
    reads_state: [hydro_kw, power_balance_kw, max_pressure_atm, bundles_taken, mineral_sites]
    writes_state: [nitrate_source, has_nitric_acid]
    pages_bundle: nitrogen_fuels
    without_pages: "Different route: Haber-Bosch is unavailable (the catalyst search took years of systematic work); the arc process is the only option"
    numbers_status: "Birkeland-Eyde 1903, Haber 1909, Oppau 1913, Ostwald 1902 sourced"
    sources: ["https://en.wikipedia.org/wiki/Haber_process", "https://en.wikipedia.org/wiki/Birkeland%E2%80%93Eyde_process"]
    tags: [substantive, accelerant, labor_sink]
    notebook: >
      Air is four-fifths nitrogen, held by one of chemistry's strongest bonds. Lightning breaks it,
      and so does an electric arc, wastefully. Haber and Bosch instead combined nitrogen with hydrogen
      over an iron catalyst at 200 atmospheres, and the Oppau plant started in 1913.

  - id: solid_motors
    name: Composite solid motors
    stage: 5
    beat: 7
    kind: project
    critical_path: false
    problem: "You need small, reliable thrusters for separating stages and settling propellant."
    requires:
      nodes: [chlor_alkali]
      any_of: [[aluminum], [niter_beds]]
      resources: {steel_kg: 500}
      labor_person_days: 1200000
    unlocks:
      effects: ["Separation, ullage and escape motors. Without aluminum and perchlorate: black-powder charges (adds separation_recontact risk)"]
    reads_state: [has_aluminum, has_caustic]
    writes_state: [has_solids]
    pages_bundle: propellants
    without_pages: "4x labor"
    numbers_status: "Scout reached orbit on solids (1960s) sourced; binder chemistry uncertain here"
    sources: ["https://en.wikipedia.org/wiki/Solid-propellant_rocket"]
    tags: [accelerant]
    notebook: >
      An oxidizer salt, aluminum powder and a rubbery binder. Once lit it can't be stopped, but it can
      sit for years and still work. Small solids separate stages and settle propellant before a restart.

  - id: launch_complex
    name: Launch complex and oxygen plant
    stage: 5
    beat: 7
    kind: project
    critical_path: true
    problem: "A fueled rocket weighs hundreds of tons, needs tons of liquid oxygen in its last hours, and would destroy the test stand when it lights."
    requires:
      nodes: [test_stand, air_separation]
      state: ["engine_thrust_kn > 50"]
      resources: {steel_kg: 400000, cement_kg: 3000000}
      labor_person_days: 10000000
    milestones:
      - {at: 0.3, id: lox_plant_scaleup, effect: "Oxygen plant x10 (repeatable later as its own project)"}
      - {at: 0.6, id: pad_and_trench, effect: "Pad and flame trench"}
      - {at: 1.0, id: assembly_and_blockhouse, effect: "Assembly building, loading lines, blockhouse"}
    unlocks:
      effects: ["The biggest project in the game; runs alongside engine development so the stage never idles"]
    reads_state: [rail_km, lox_kg_per_day, has_cement]
    writes_state: [has_launch_pad, lox_kg_per_day]
    pages_bundle: none
    without_pages: "No penalty"
    numbers_status: "Estimate; real pads used thousands of tons of steel and concrete"
    sources: []
    tags: [labor_sink]
    notebook: >
      Liquid oxygen boils at -183 C, so a rocket is loaded in its final hours while vapor pours off
      the tanks. The exhaust at ignition would dig a crater, so it's turned sideways down a concrete
      trench. Launch complexes are the largest structures a space program builds.

  - id: lox_plant_scaleup
    name: Oxygen plant expansion
    stage: 5
    beat: 7
    kind: project
    critical_path: false
    problem: "Every static fire burns tons of liquid oxygen, and a launch will need hundreds."
    requires:
      nodes: [launch_complex]
      state: ["lox_balance < 0"]
      resources: {steel_kg: 60000, copper_kg: 20000}
      labor_person_days: 2500000
    unlocks:
      effects: ["lox_kg_per_day x2 per build (repeatable). Power load rises with it"]
    reads_state: [cryo_process, power_balance_kw]
    writes_state: [lox_kg_per_day, power_balance_kw]
    pages_bundle: none
    without_pages: "No penalty"
    numbers_status: "Estimate"
    sources: []
    tags: [repeatable, labor_sink]
    notebook: >
      A kerosene rocket burns more than two kilograms of oxygen per kilogram of fuel. The oxygen is
      free; separating it takes electricity. Launch sites grew their own oxygen plants.

  - id: tracking_network
    name: Tracking stations
    stage: 5
    beat: 7
    kind: project
    critical_path: true
    problem: "After the engines stop, nobody knows where the vehicle is or whether it's on course."
    requires:
      nodes: [electronics_lab]
      resources: {steel_kg: 30000, copper_kg: 5000}
      labor_person_days: 2000000
    unlocks:
      effects: ["Dish antennas and Doppler ranging; trajectory determination with the computing office. Required for guidance choices in Stage 6"]
    reads_state: [has_radio]
    writes_state: [has_tracking]
    pages_bundle: orbital_mechanics
    without_pages: "Needs 2x calc_hours to reduce tracking data"
    numbers_status: "Estimate; one site sees the Moon only part of each day"
    sources: []
    tags: [labor_sink]
    notebook: >
      A dish measures direction; the Doppler shift of the signal measures speed toward or away. Hours
      of that and a room of computers can fit an orbit. Without it a lunar mission flies blind after
      the last burn.

  - id: human_computers
    name: Computing office
    stage: 5
    beat: 7
    kind: project
    critical_path: false
    problem: "Every trajectory, nozzle and orbit needs thousands of hours of arithmetic, and the engineers are doing it themselves."
    requires:
      nodes: [instrumentation]
      resources: {paper_kg: 2000}
      labor_person_days: 300000
    unlocks:
      jobs: [compute]
      effects: ["calc_hours accumulate; Stage 6 design, tracking and trajectory work spend them. Orbital mechanics pages replace most of it"]
    reads_state: [bundles_taken]
    writes_state: [calc_hours]
    pages_bundle: orbital_mechanics
    without_pages: "Tables computed from scratch: 3x calc_hours"
    numbers_status: "Estimate"
    sources: ["https://en.wikipedia.org/wiki/Computer_(occupation)"]
    tags: [labor_sink, accelerant]
    notebook: >
      Before electronic computers, a computer was a person. Rooms of them integrated trajectories step
      by step from planned worksheets. It's a real way to turn idle people into progress, and one
      reason the orbital mechanics pages are worth their weight.

  - id: gate_engine
    name: "Gate: a booster-class engine"
    stage: 5
    beat: 8
    kind: gate
    critical_path: true
    problem: "An engine big enough for a first stage runs for a full minute on the stand, and there's a pad to fly it from."
    requires:
      nodes: [injector_design, gyroscopes, instrumentation, launch_complex, tracking_network]
      any_of: [[pressure_fed_booster_engine], [hydrogen_peroxide], [gas_generator_turbopump]]
      state: ["energy_w_per_person >= 3500", "engine_static_fire_s >= 60", "engine_thrust_kn >= 250", "has_launch_pad == true"]
    unlocks:
      effects: ["Stage 6 opens: the rocket"]
    reads_state: [feed_system, turbopump_quality, injector_quality, has_hypergolics, has_ethanol, has_kerosene, has_aluminum, has_solids]
    notebook: >
      You have an engine comparable to the V-2's, and somewhere to fly it. The V-2 never reached
      orbit, but everything that did in the next fifteen years grew from engines like it.
