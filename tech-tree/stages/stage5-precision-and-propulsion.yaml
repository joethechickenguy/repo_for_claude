  - id: hypergolic_propellants
    name: Storable hypergolic propellants
    stage: 5
    kind: project
    critical_path: false
    problem: "Liquid oxygen boils away within days, and a lander must restart its engine reliably after coasting to the Moon."
    requires:
      nodes: [ostwald_nitric, coal_gas_tar]
      resources: {steel_kg: 3000}
      labor_person_days: 1200000
    unlocks:
      effects: ["Nitric acid with an amine fuel ignites on contact: no igniter, no boil-off. Lander engine option"]
    reads_state: [has_nitric_acid, has_coal_tar]
    writes_state: [has_hypergolics]
    pages_bundle: industrial_chemistry
    without_pages: "3x labor; dangerous"
    fallback: "LOX lander with igniter and insulated tanks (restart flaw more likely; boil-off limits coast)"
    energy_effect: "None"
    numbers_status: "Luna 9's KTDU-5A retrorocket used nitric acid and an amine fuel (sourced)"
    sources: ["https://en.wikipedia.org/wiki/Luna_9", "https://www.drewexmachina.com/2016/02/03/luna-9-the-first-lunar-landing/"]
    tags: []
    notebook: >
      Some fuel and oxidizer pairs burst into flame the moment they touch. Concentrated nitric acid
      with certain amines, derived from coal tar, is one such pair, and both stay liquid at ordinary
      temperatures. That makes an engine that can sit for days and still start every time. The
      Soviet Luna 9 lander used nitric acid and an amine fuel to make the first soft landing on the
      Moon in 1966. The propellants are corrosive and highly toxic.

  - id: solid_motors
    name: Composite solid motors
    stage: 5
    kind: project
    critical_path: false
    problem: "You need small, reliable thrusters for separating stages and settling propellant, and liquid engines are overkill."
    requires:
      nodes: [chlor_alkali, hall_heroult]
      resources: {aluminum_kg: 500, rubber_substitute_kg: 500}
      labor_person_days: 1500000
    unlocks:
      effects: ["Perchlorate composite motors: separation, ullage and retro motors. Optional all-solid stages in the workshop (Isp ~240-250 s class)"]
    reads_state: [has_caustic, has_aluminum]
    writes_state: [has_solids]
    pages_bundle: industrial_chemistry
    without_pages: "4x labor; perchlorate made by electrolysis of chlorate"
    fallback: "Black-powder separation charges and springs"
    energy_effect: "Electrolysis load"
    numbers_status: "Scout, an all-solid launcher, reached orbit in the early 1960s with stages of ~236-256 s Isp (sourced). Binder chemistry here is uncertain; see open questions."
    sources: ["https://en.wikipedia.org/wiki/RM-90_Blue_Scout_II", "https://en.wikipedia.org/wiki/Solid-propellant_rocket"]
    tags: []
    notebook: >
      A composite solid propellant is an oxidizer salt, ammonium perchlorate, mixed with aluminum
      powder and held together by a rubbery fuel binder. Once lit, it can't be throttled or shut
      off, but it can sit in storage for years and still work. Small solids separate stages and
      settle liquid propellant before an engine restarts. America's Scout rocket reached orbit
      on solids alone.

