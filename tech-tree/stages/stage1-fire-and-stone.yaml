# Stage 1: Fire and stone. Bare hands to metal tools made faster than they wear out.
# ~90 min, ~6 in-game years. Heartbeat: tools. See DESIGN.md for the layer model.

stage: 1
name: Fire and stone
opening_problem: "Ten thousand people on a hillside in eastern Anatolia, holding paper. Nobody has a knife."
heartbeat: tool_wear
labor_tier: people
starting_jobs: [gather_wood, knap_flint, build]
gate:
  id: gate_reliable_smelting
  name: Reliable smelting
  condition:
    energy_w_per_person: 250
    state: ["metal_tools >= 5000", "tool_wear >= 0"]
  routes: [A_wind, B_bellows, C_arsenic, D_tin]

pressures:
  - id: tool_wear
    name: Tools
    drives: tool_wear
    heartbeat: true
    rises_with: ["every gatherer, digger, miner and builder wears a tool; flint lasts ~20 worker-days, copper ~200, bronze ~400"]
    red_when: "tools < tool users"
    effect_when_red: "Workers without a tool drop to quarter speed"
    answers: [ground_stone_axes, stone_molds, tin_bronze, arsenical_copper]
    introduced_in_beat: 1
  - id: wood_distance
    name: Nearest wood
    drives: forest_cover
    rises_with: ["gathering and charcoal burning clear the nearest stands first"]
    red_when: "forest_cover < 70 (stage 1 scale)"
    effect_when_red: "Wood per gatherer falls by a third as crews walk farther"
    answers: [ground_stone_axes, charcoal_clamps]
    introduced_in_beat: 3
  - id: ore_outcrop
    name: Green stone left
    drives: malachite_left_kg
    rises_with: ["every kg of malachite mined"]
    red_when: "malachite_left_kg < 20000"
    effect_when_red: "Ore per miner halves; the outcrop is running out"
    answers: [ore_roasting, tin_survey_kestel]
    introduced_in_beat: 5

workshops:
  - id: furnace_workshop
    name: Furnace workshop
    opens_with: crucibles_blowpipes
    loop: "A campaign is one furnace run (~30 days). Set the dials, run, read metal out, fuel used and failures. Grows through Stages 2 and 3."
    dials:
      - {id: air_supply, name: "Air supply", options: [blowpipes, bellows_crews, wind_site], added_by: crucibles_blowpipes,
         effect: "Blowpipes reach copper's melting point barely and slowly; bellows or a wind site double or triple output per crucible",
         basis: "Forced draft lifts a charcoal fire from ~900 C to 1,200 C+"}
      - {id: fuel_ratio, name: "Charcoal per kg ore", range: [2, 15], added_by: crucibles_blowpipes,
         effect: "Too little: the charge never reaches temperature and the campaign fails. More than needed is just fuel burned",
         basis: "Copper melts at 1,085 C; prototype uses 10 kg charcoal per kg copper"}
    outputs: [metal_kg, fuel_kg, failed_campaigns]

nodes:

  # ---- Beat 1: tools and wood ---------------------------------------------------------------------
  - id: ground_stone_axes
    name: Ground-stone axes
    stage: 1
    beat: 1
    kind: project
    critical_path: false
    problem: "Flint flakes chip and snag on hardwood; felling one oak takes a crew all day."
    requires:
      state: ["tool_wear < 0.8"]
      resources: {blades: 500}
      labor_person_days: 60000
    unlocks:
      jobs: [grind_axes]          # 1 axe per 4 worker-days (estimate); lasts ~100 worker-days
      effects: ["Gather wood with an axe: 60 kg/day instead of 40. First tool-mix decision: knappers vs grinders"]
    writes_state: [metal_tools]
    pages_bundle: primitive_technology
    without_pages: "Different route: the first axes shatter (wrong stone); crews find greenstone after ~6 months of trials"
    numbers_status: "Estimate. Experimental archaeology gives hours to days per axe"
    sources: []
    tags: [substantive, accelerant]
    notebook: >
      A flaked edge is sharp but brittle. Grinding tough fine-grained stone like basalt against
      sandstone with water makes a blunter edge that survives thousands of blows. Neolithic farmers
      cleared much of Europe with ground axes.

  - id: digging_sticks
    name: Fire-hardened digging sticks
    stage: 1
    beat: 1
    kind: project
    critical_path: true
    problem: "The river terraces are full of clay, but it sits under a meter of gravel that bare hands can't move."
    requires:
      state: ["wood_kg > 300"]
      resources: {wood_kg: 1000}
      labor_person_days: 120000
    unlocks:
      jobs: [dig_clay]            # 50 kg/day with a tool
    pages_bundle: primitive_technology
    without_pages: "1.5x labor"
    numbers_status: "Prototype values"
    sources: []
    tags: []
    notebook: >
      Charring the tip of a hardwood stick drives water out of the outer layer and hardens it.
      Scrape off the soft charcoal and you have a point that won't mush on the first stone.

  # ---- Beat 2: clay and fire -------------------------------------------------------------------------
  - id: pit_kiln
    name: Pit kiln
    stage: 1
    beat: 2
    kind: project
    critical_path: true
    problem: "Clay pots dry and crack, and one rain turns them back to mud."
    requires:
      nodes: [digging_sticks]
      state: ["clay_kg > 300"]
      resources: {wood_kg: 5000, clay_kg: 4000}
      labor_person_days: 400000
    unlocks:
      jobs: [fire_pottery]        # 12 kg clay + 24 kg wood -> 2 pots per worker-day
      effects: ["Firing is the first fuel-for-work; the energy slide rule starts to move"]
    pages_bundle: primitive_technology
    without_pages: "Different route: a third of early firings crack until the crew learns to dry pots a week first (~4 months)"
    numbers_status: "Dehydroxylation above ~500-600 C is standard ceramics; rates are estimates"
    sources: ["https://en.wikipedia.org/wiki/Pottery"]
    tags: []
    notebook: >
      Clay crystals hold water in their structure. Drying removes the water between them; only
      above roughly 500 C does the bound water leave, and that change is permanent. The pot is now
      ceramic and won't soften again.

  # ---- Beat 3: charcoal ---------------------------------------------------------------------------------
  - id: charcoal_clamps
    name: Charcoal clamps
    stage: 1
    beat: 3
    kind: project
    critical_path: true
    problem: "Copper melts at 1,085 C, and an open wood fire rarely gets past 900 C."
    requires:
      nodes: [pit_kiln]
      resources: {wood_kg: 20000, clay_kg: 30000}
      labor_person_days: 600000
    unlocks:
      jobs: [burn_charcoal]       # 100 kg wood -> 20 kg charcoal per worker-day
      effects: ["Introduces the forest bar: charcoal eats wood five to one"]
    reads_state: [forest_cover]
    writes_state: [forest_cover]
    pages_bundle: metallurgy_1
    without_pages: "Different route: yield starts at 12% and rises to 20% over ten burns as the crew learns to seal the clamp"
    numbers_status: "Yield 20-30% and 27-33 MJ/kg are sourced; labor is an estimate"
    sources: ["https://energypedia.info/wiki/Charcoal_Production"]
    tags: []
    notebook: >
      Pile wood, seal it under earth and clay, and let it smolder with little air. Water and
      volatile gases cook off, leaving nearly pure carbon at a fifth of the weight. With a strong
      draft, charcoal passes 1,200 C because nothing is left to boil off.

  # ---- Beat 4: ore --------------------------------------------------------------------------------------
  - id: trail_green_stones
    name: Trail to the green stones
    stage: 1
    beat: 4
    kind: project
    critical_path: true
    problem: "Your survey pages mark a malachite outcrop three days' walk east, and there is no path through the scrub."
    requires:
      nodes: [charcoal_clamps]
      resources: {blades: 3000}
      labor_person_days: 1200000
    milestones:
      - {at: 0.4, id: native_copper_find, effect: "Native copper nuggets in a streambed: job hammer_native_copper, finite 300 kg. First metal tools"}
      - {at: 0.8, id: sledges, effect: "Sledges and a graded path: ore haul labor halved"}
    unlocks:
      jobs: [mine_malachite]      # 15 kg/day with a tool
      effects: ["Introduces the outcrop bar (finite ore)"]
    reads_state: [bundles_taken]
    writes_state: [has_copper_ore, malachite_left_kg, haul_distance_days]
    pages_bundle: survey_copper_tin
    without_pages: "Different route: prospecting parties (200,000 person-days) find the outcrop by following green staining in streambeds; the trail then follows"
    numbers_status: "Native copper and malachite near Cayonu/Ergani are sourced; distances and labor are estimates"
    sources: ["https://en.wikipedia.org/wiki/%C3%87ay%C3%B6n%C3%BC"]
    tags: [labor_sink]
    notebook: >
      Malachite is copper carbonate, which is why it's green. Near the surface, copper sulfides
      weather into bright carbonates and sometimes lumps of pure metal. At Cayonu, near today's
      Ergani mines, people hammered native copper into beads and awls 9,000 years ago.

  # ---- Beat 5: smelting -----------------------------------------------------------------------------------
  - id: crucibles_blowpipes
    name: Crucibles and blowpipes
    stage: 1
    beat: 5
    kind: workshop
    workshop: furnace_workshop
    critical_path: true
    problem: "You have ore and charcoal, but nothing survives the heat and no fire burns hot enough without forced air."
    requires:
      nodes: [trail_green_stones]
      state: ["ore_kg > 150"]
      resources: {pots: 400, charcoal_kg: 2000}
      labor_person_days: 800000
    unlocks:
      jobs: [smelt_copper]        # per campaign: ore + charcoal -> copper, 20% yield baseline
      effects: ["Opens the furnace workshop with two dials: air supply, charcoal per kg ore"]
    reads_state: [trained_smiths]
    writes_state: [has_copper]
    pages_bundle: metallurgy_1
    without_pages: "Different route: dials start wrong and the notebook is blank; the first campaigns fail visibly (too little air, too little fuel) until the player finds the window"
    numbers_status: "Reduction chemistry standard; rates are prototype estimates"
    sources: []
    tags: [substantive]
    notebook: >
      Hot charcoal with limited air makes carbon monoxide, which pulls oxygen out of copper
      minerals and leaves metal. The trick is a fire hot enough and starved enough at once.
      Blowing through reed pipes into a small crucible does both, slowly.

  - id: ore_roasting
    name: Ore roasting
    stage: 1
    beat: 5
    kind: project
    critical_path: false
    problem: "The green crust is running out; below it the ore is dark and brassy, and it won't smelt."
    requires:
      nodes: [crucibles_blowpipes]
      state: ["malachite_left_kg < 20000"]
      resources: {wood_kg: 30000}
      labor_person_days: 500000
    unlocks:
      jobs: [roast_sulfide_ore]   # 20 kg ore + 30 kg wood -> 16 kg roasted ore
      effects: ["Sulfide ore replaces the depleted carbonate; the outcrop bar is replaced by a deep deposit. Fumes: forest_cover -3 near the heaps"]
    reads_state: [malachite_left_kg]
    writes_state: [ore_type, forest_cover]
    pages_bundle: metallurgy_1
    without_pages: "Different route: 3 failed campaigns on raw sulfide, then the notebook's hint; roasting found by accident from ore left in a kiln"
    numbers_status: "Chemistry standard; quantities are estimates"
    sources: []
    tags: [substantive]
    notebook: >
      Deeper copper ores are sulfides. Heat them in open air and the sulfur burns off as choking
      sulfur dioxide, leaving oxides that smelt like malachite. The fumes that stripped hillsides
      bare near historic smelters are the raw material for sulfuric acid, much later.

  # ---- Beat 6: casting -----------------------------------------------------------------------------------------
  - id: stone_molds
    name: Stone molds
    stage: 1
    beat: 6
    kind: project
    critical_path: true
    problem: "Flint is sharp but brittle, and crews go through blades faster than knappers can make them."
    requires:
      nodes: [crucibles_blowpipes]
      state: ["copper_kg > 40"]
      resources: {copper_kg: 200}
      labor_person_days: 1000000
    unlocks:
      jobs: [cast_copper_tools]   # 1 kg copper per tool; 4 tools per worker-day
      effects: ["Tool mix: knappers vs casters; copper tools last 10x flint"]
    writes_state: [metal_tools]
    pages_bundle: metallurgy_1
    without_pages: "1.5x labor"
    numbers_status: "Copper lasting 10x flint is a game estimate"
    sources: []
    tags: [substantive]
    notebook: >
      Copper isn't sharper than flint. It bends instead of shattering, can be resharpened, and can
      be melted and recast when worn out. Hammering also hardens it by tangling the crystal
      structure. A carved stone mold lets one smith pour the same shape again and again.

  # ---- Beat 7: scale ------------------------------------------------------------------------------------------------
  - id: wind_furnaces
    name: Wind-draft furnaces on the ridge
    stage: 1
    beat: 7
    kind: decision_option
    route: [A_wind]
    critical_path: false
    problem: "Blowpipe crews are exhausted, and each crucible yields only a little copper."
    requires:
      nodes: [crucibles_blowpipes]
      state: ["campaigns_run > 5"]
      resources: {clay_kg: 60000, copper_kg: 100}
      labor_person_days: 2000000
    unlocks:
      effects: ["air_supply: wind_site. 3x output per campaign, ridge only; output drops 60% in the fixed calm season. Stage 2 iron must then be smelted on the ridge or bellows built"]
    writes_state: [has_wind_furnaces]
    pages_bundle: metallurgy_1
    without_pages: "1.5x labor"
    numbers_status: "Monsoon wind furnaces at Samanalawewa, Sri Lanka (7th c. AD) are sourced; multiplier is an estimate"
    sources: ["https://www.nature.com/articles/379060a0"]
    tags: [substantive, labor_sink]
    notebook: >
      A furnace on a hillside facing the prevailing wind lets the wind do the blowing. At
      Samanalawewa in Sri Lanka, a line of such furnaces caught the monsoon and reached
      temperatures hot enough to make steel.

  - id: pot_bellows
    name: Pot bellows
    stage: 1
    beat: 7
    kind: decision_option
    route: [B_bellows]
    critical_path: false
    problem: "Blowpipes can't move enough air for a bigger furnace, and breath is mostly carbon dioxide."
    requires:
      nodes: [crucibles_blowpipes]
      state: ["campaigns_run > 5"]
      resources: {pots: 300, wood_kg: 5000}
      labor_person_days: 900000
    unlocks:
      jobs: [hunt_for_hides]      # 0.2 hides per worker-day (estimate); leather diaphragms wear out
      effects: ["air_supply: bellows_crews. 2x output anywhere; portable to the iron site in Stage 2"]
    writes_state: [has_bellows]
    pages_bundle: metallurgy_1
    without_pages: "1.5x labor"
    numbers_status: "Pot bellows attested in Egyptian tomb paintings c. 1450 BCE; multiplier is an estimate"
    sources: ["https://en.wikipedia.org/wiki/Bellows"]
    tags: [substantive]
    notebook: >
      A clay bowl with a loose hide over it and a pipe out the side. A worker stands on two,
      lifting one foot to let air in and stepping down to push it out. Moving more oxygen through
      the charcoal is the single biggest lever on furnace temperature.

  # ---- Beat 8: alloys and the gate ---------------------------------------------------------------------------------
  - id: arsenical_copper
    name: Arsenical copper
    stage: 1
    beat: 8
    kind: decision_option
    route: [C_arsenic]
    critical_path: false
    problem: "Copper tools dull and bend within weeks, and toolmakers can't keep up."
    requires:
      nodes: [stone_molds]
      state: ["tool_wear < 0.9"]
      resources: {copper_kg: 300}
      labor_person_days: 600000
    unlocks:
      jobs: [mine_arsenical_ore]
      effects: ["Tools last 1.6x copper. Scar: arsenic_exposure rises per campaign; at fixed thresholds smelters die"]
    writes_state: [arsenic_exposure, metal_tools]
    pages_bundle: metallurgy_1
    without_pages: "Different route: discovered by accident from arsenic-bearing ore after ~1 year of smelting; the game then names it"
    numbers_status: "Arsenical bronze preceding tin bronze in Anatolia is sourced; lifetime is an estimate"
    sources: ["https://en.wikipedia.org/wiki/Arsenical_bronze"]
    tags: [substantive, scar]
    notebook: >
      A few percent of arsenic makes copper harder and easier to cast; for a thousand years it was
      the Near East's main alloy. The price is the smelters' health: arsenic comes off as a toxic
      vapor. Your colonists don't age, but arsenic can still kill them.

  - id: tin_survey_kestel
    name: Expedition to the Taurus tin
    stage: 1
    beat: 8
    kind: project
    route: [D_tin]
    critical_path: false
    problem: "Bronze needs tin, which is rare; the nearest known source is in the Taurus mountains, weeks away."
    requires:
      nodes: [stone_molds]
      state: ["bundles_taken has geological_survey"]
      resources: {blades: 6000, pots: 500}
      labor_person_days: 2500000
    milestones:
      - {at: 0.5, id: camp_halfway, effect: "A supply camp opens; haulers count as trained_miners"}
    unlocks:
      jobs: [mine_cassiterite, smelt_tin]
    writes_state: [has_tin_source, trained_miners]
    pages_bundle: survey_copper_tin
    without_pages: "Unavailable: without the survey there's no reason to go. Arsenical copper is the substitute"
    numbers_status: "Kestel mine and Goltepe (c. 2600 BCE, near Nigde) are sourced; distance and labor are estimates"
    sources: ["https://en.wikipedia.org/wiki/Kestel_(archaeological_site)"]
    tags: [substantive, labor_sink]
    notebook: >
      Tin ore, cassiterite, is heavy, dark and easy to miss. Archaeologists assumed Bronze Age
      Anatolia imported all its tin until a mine at Kestel and a processing town at Goltepe turned
      up in the late 1980s, with crucibles still holding tin slag.

  - id: tin_bronze
    name: Tin bronze
    stage: 1
    beat: 8
    kind: decision_option
    route: [D_tin]
    critical_path: false
    problem: "Pure copper casts poorly, full of bubbles, and wears fast."
    requires:
      nodes: [tin_survey_kestel]
      resources: {copper_kg: 500, tin_kg: 60}
      labor_person_days: 500000
    unlocks:
      jobs: [cast_bronze_tools]   # 0.9 kg copper + 0.1 kg tin per tool
      effects: ["Tools last 2x copper; casting yield +20%. Bronze stays the bearing metal through Stage 3"]
    writes_state: [has_bronze, metal_tools]
    pages_bundle: metallurgy_1
    without_pages: "Different route: the right tin fraction is found by campaigns (too little: soft; too much: brittle), about 5 casts"
    numbers_status: "~10% tin and ~950 C melting are sourced; lifetime is an estimate"
    sources: ["https://en.wikipedia.org/wiki/Bronze"]
    tags: [substantive]
    notebook: >
      Add one part tin to nine parts copper and the larger tin atoms jam the crystal planes so
      they can't slide. The metal gets harder, melts 130 C lower, and flows cleanly into molds.
      An entire age is named after it.

  - id: gate_reliable_smelting
    name: "Gate: reliable smelting"
    stage: 1
    beat: 8
    kind: gate
    critical_path: true
    problem: "Metal tools are made faster than they wear out, and the colony burns fuel for real work at scale."
    requires:
      nodes: [stone_molds]
      any_of: [[wind_furnaces], [pot_bellows], [arsenical_copper], [tin_bronze]]
      state: ["energy_w_per_person >= 250", "metal_tools >= 5000"]
    unlocks:
      effects: ["Stage 2 opens: iron"]
    reads_state: [has_bellows, has_wind_furnaces, has_bronze, arsenic_exposure, forest_cover]
    notebook: >
      Every route ends the same way: tools made faster than they wear out. What you carry forward
      differs. Bellows move with you; ridges don't. Bronze lasts; arsenic leaves a mark.
