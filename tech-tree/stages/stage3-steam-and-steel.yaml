# Stage 3: Steam and steel. Rotative power, precision, cheap steel, first electricity.
# ~90 min, ~25 in-game years. Heartbeat: machine-shop hours.

stage: 3
name: Steam and steel
opening_problem: "You have engine power, but every part is still shaped by hand, one at a time, and no two fit."
heartbeat: shop_hours
labor_tier: works            # unlocked by the foremen node in beat 1
gate:
  id: gate_generator
  name: Electric power from a generator
  condition:
    energy_w_per_person: 1500
    state: ["dynamo_output_kw >= 50"]
  routes: [A_steam_dynamo, B_water_turbine, T_magneto]

pressures:
  - id: shop_hours
    name: Machine shop
    drives: shop_hours_balance
    heartbeat: true
    rises_with: ["every engine, rail, wheel, wire die and instrument needs machine time; the queue is visible and the player orders it"]
    red_when: "queue exceeds a year of shop time"
    effect_when_red: "Projects waiting on parts stall; the player reorders the queue or builds more shop"
    answers: [machine_shop, planer_milling, electric_motors_preview]
    introduced_in_beat: 2
  - id: reject_rate
    name: Parts that don't fit
    drives: tolerance_mm
    rises_with: ["every new machine asks for a tighter fit than the shop can hold"]
    red_when: "a queued part needs a tolerance tighter than tolerance_mm"
    effect_when_red: "That part is remade repeatedly; shop hours burn with no output"
    answers: [machine_shop, bearings_lubrication]
    introduced_in_beat: 2
  - id: haul_labor
    name: Hauling
    drives: haul_workers
    rises_with: ["tons moved x distance between mines, furnaces and works"]
    red_when: "haul_workers > 2000"
    effect_when_red: "A fifth of the colony carries things; production jobs starve"
    answers: [rails_wagonways]
    introduced_in_beat: 3
  - id: iron_quality
    name: Iron and steel quality
    drives: iron_quality
    rises_with: ["phosphorus ore, sulfur coke, over-blown steel"]
    red_when: "iron_quality < 2"
    effect_when_red: "Boiler plate, rails and machine frames crack; life of everything iron falls by a third"
    answers: [furnace_workshop, mineral_prospecting]
    introduced_in_beat: 4

workshops:
  - id: furnace_workshop
    extends: true
    dials:
      - {id: blast_temperature, name: "Blast temperature (C)", range: [20, 600], added_by: hot_blast,
         effect: "Fuel per ton of iron falls by a third at 150 C and by two thirds at 300 C+",
         basis: "Neilson 1828 ([Hot blast](https://en.wikipedia.org/wiki/Hot_blast))"}
      - {id: converter_lining, name: "Converter lining", options: [acid_silica, basic_dolomite], added_by: bessemer_converter,
         effect: "Acid: phosphorus stays in the steel (cold-short with bog iron). Basic: phosphorus goes to the slag. Needs dolomite",
         basis: "Gilchrist-Thomas 1878"}
      - {id: blow_time, name: "Blow time (min)", range: [10, 30], added_by: bessemer_converter,
         effect: "Too short: carbon left, hard and brittle. Too long: over-oxidized, weak. The thermometer milestone shows the flame change that marks the end",
         basis: "Bessemer 1856"}
      - {id: manganese, name: "Manganese addition", options: [none, spiegeleisen], added_by: bessemer_converter,
         effect: "Removes oxygen and sulfur after the blow: cures hot shortness. Needs manganese ore",
         basis: "Mushet, 1850s"}
    play:
      converter_heat_kg: 5000        # pig iron per converter heat; early Bessemer vessels held 5-10 t (estimate)
      converter_heat_days: 1         # a blow is twenty minutes; charging, blowing and pouring take the day (estimate)
      converter_yield: 0.88          # steel per kg of pig; carbon, silicon and some iron burn off (estimate)
  - id: engine_workshop
    extends: true
    dials:
      - {id: flywheel, name: "Rotative output", options: [beam_pump, rotative], added_by: rotative_engine_shafting,
         effect: "Crank and flywheel: the engine turns shafting instead of pumping. Output in kW mechanical",
         basis: "Watt's rotative engines, 1780s"}
      - {id: generator, name: "Generator", options: [none, permanent_magnet, self_excited], added_by: dynamo,
         effect: "Permanent magnet caps at a few hundred watts. Self-excited: 50-100 kW per machine, limited by bearing_quality and shaft speed",
         basis: "Siemens and Wheatstone 1867"}
  - id: machine_shop
    name: Machine shop
    opens_with: surface_plates
    loop: "A queue of parts (engines, rails, dies, instruments, wire) against shop hours. Each part shows the tolerance it needs. Dials improve the tolerance the shop can hold; the queue order is the recurring small decision."
    dials:
      - {id: flat_reference, name: "Reference surface", options: [none, two_plates, three_plates], added_by: surface_plates,
         effect: "Two plates fit each other but can both be curved; three worked in rotation can only be flat. tolerance_mm 1.0 -> 0.5",
         basis: "Whitworth's three-plate method ([Surface plate](https://en.wikipedia.org/wiki/Surface_plate))"}
      - {id: lead_screw, name: "Lead screw", options: [hand_chased, geared], added_by: screw_cutting_lathe,
         effect: "A geared lead screw advances the tool the same distance every turn: interchangeable threads, and a lathe that can make a better lathe. tolerance_mm -> 0.25",
         basis: "Maudslay c. 1800 ([Screw-cutting lathe](https://en.wikipedia.org/wiki/Screw-cutting_lathe))"}
      - {id: gauging, name: "Measurement", options: [rule, go_no_go_gauges, micrometer], added_by: measurement,
         effect: "You can only hold a tolerance you can measure. Gauges: 0.1 mm. Micrometer: 0.02 mm. Also unlocks thermometers and pressure gauges for the furnace and engine workshops",
         basis: "Whitworth's measuring machine, 1840s"}
      - {id: bearings, name: "Bearings and lubrication", options: [wood_and_tallow, bronze_and_oil, hardened_steel], added_by: bearings_lubrication,
         effect: "Sets the speed a shaft can turn and how long it lasts. Turbines, dynamos and (later) gyros and turbopumps read this",
         basis: "Bronze plain bearings and mineral oil were standard 19th-century practice"}
      - {id: shop_power, name: "Shop power", options: [line_shaft, individual_motors], added_by: electric_motors_preview,
         effect: "Individual motors (Stage 4) remove belt losses and let the shop grow: shop hours +50%",
         basis: "Historic; see Stage 4"}
    outputs: [tolerance_mm, shop_hours_per_day, queue_days]

nodes:

  # ---- Beat 1: rotative power -----------------------------------------------------------------------------
  - id: foremen
    name: Foremen
    stage: 3
    beat: 1
    kind: project
    critical_path: false
    problem: "Forty jobs, and half your day is moving people between them."
    requires:
      nodes: [gate_steam]
      state: ["jobs_active >= 20"]
      labor_person_days: 100000
    unlocks:
      effects: ["Labor tier: works. Each facility gets a target output; foremen staff it from the pool and report the crew it took. Jobs stay one expander away and can be pinned"]
    writes_state: [labor_tier]
    pages_bundle: none
    without_pages: "No penalty"
    numbers_status: "Game structure"
    sources: []
    tags: [substantive]
    notebook: >
      No one at a nineteenth-century works assigned individuals. A foreman ran a furnace or a shop
      against a target and found the hands. Delegation is a technology too, and this colony has been
      at it long enough to have people who are good at it.

  - id: rotative_engine_shafting
    name: Rotative engines and line shafting
    stage: 3
    beat: 1
    kind: project
    critical_path: true
    problem: "Engines only pump up and down, but lathes, hammers and bellows need to turn."
    requires:
      nodes: [gate_steam]
      resources: {iron_kg: 30000, wood_kg: 20000}
      labor_person_days: 2000000
    unlocks:
      effects: ["One engine drives a whole workshop by belts; machines no longer need a river. Adds dial: engine_workshop.flywheel (rotative)"]
    reads_state: [engine_type]
    writes_state: [factory_power_kw]
    pages_bundle: steam_engines
    without_pages: "2x labor; crank and flywheel geometry learned by trial (engines stall at the ends of the stroke until the flywheel is heavy enough)"
    numbers_status: "Estimate"
    sources: ["https://en.wikipedia.org/wiki/Line_shaft"]
    tags: []
    notebook: >
      A crank and flywheel turn a piston's back-and-forth into steady rotation. Run that along an
      overhead iron shaft, and belts take power to every machine in the room. For a century
      factories were laid out around their shafting, which is why old mills are long and narrow.

  # ---- Beat 2: precision -----------------------------------------------------------------------------------
  - id: surface_plates
    name: Flat surfaces
    stage: 3
    beat: 2
    kind: workshop
    workshop: machine_shop
    critical_path: true
    problem: "Nobody can make or check a truly flat surface, so every machine slide is a little crooked and parts don't fit."
    requires:
      nodes: [rotative_engine_shafting]
      resources: {iron_kg: 2000}
      labor_person_days: 500000
    unlocks:
      effects: ["Opens the machine shop workshop: the parts queue, shop hours, and the reference-surface dial. Trains machinists"]
    reads_state: [machinists_trained]
    writes_state: [has_flat_reference, machinists_trained, tolerance_mm]
    pages_bundle: machine_tools
    without_pages: "Different route: the dial offers only two_plates at first; the shop discovers matching curves when parts still don't fit, and three_plates appears after ~1 year"
    numbers_status: "Method sourced; tolerance steps are game values"
    sources: ["https://en.wikipedia.org/wiki/Surface_plate"]
    tags: [substantive, skill_builder]
    notebook: >
      Rub two plates together and grind off the high spots, and they fit each other, but one may be
      concave and the other convex. Work three in rotation and the only shape all pairs can share
      is flat. Precision from nothing but patience; every machine tool descends from it.

  - id: screw_cutting_lathe
    name: Screw-cutting lathe
    stage: 3
    beat: 2
    kind: project
    critical_path: true
    problem: "Hand-filed screws are all different, so every nut must be matched to its bolt."
    requires:
      nodes: [surface_plates]
      state: ["has_steel_edges == true OR iron_tools > 5000"]
      resources: {iron_kg: 6000, copper_kg: 500}
      labor_person_days: 1200000
    unlocks:
      jobs: [turn_parts]
      effects: ["Adds the lead_screw dial. Interchangeable fasteners; lathes can make better lathes"]
    writes_state: [has_lathe, machinists_trained]
    pages_bundle: machine_tools
    without_pages: "3x labor"
    numbers_status: "Maudslay c. 1800 sourced"
    sources: ["https://en.wikipedia.org/wiki/Henry_Maudslay"]
    tags: [skill_builder]
    notebook: >
      Maudslay's lathe geared the carriage to the spindle through a lead screw, so the tool
      advanced exactly the same distance every turn. A good screw can then cut a better screw,
      and each generation of lathe improves the next.

  - id: measurement
    name: Gauges and instruments
    stage: 3
    beat: 2
    kind: project
    critical_path: true
    problem: "Workshops disagree on what a millimeter is, and the furnace crew judges heat by color."
    requires:
      nodes: [screw_cutting_lathe]
      resources: {iron_kg: 500, copper_kg: 200}
      labor_person_days: 400000
    milestones:
      - {at: 0.5, id: thermometers_and_gauges, effect: "Thermometers and pressure gauges: the furnace and engine workshops show measured values instead of estimates"}
    unlocks:
      effects: ["Adds the gauging dial. Go/no-go gauges and micrometers: interchangeable parts; tolerance-based checks everywhere"]
    writes_state: [tolerance_mm, has_instruments]
    pages_bundle: machine_tools
    without_pages: "2x labor"
    numbers_status: "Whitworth (1840s) sourced"
    sources: ["https://en.wikipedia.org/wiki/Joseph_Whitworth"]
    tags: [substantive]
    notebook: >
      Making a part accurately is useless if you can't check it. A go/no-go gauge is a pair of
      reference shapes the part must pass and not pass. A micrometer turns a fine screw into a way
      to read hundredths of a millimeter. Measurement is the quiet backbone of every workshop.

  - id: bearings_lubrication
    name: Bearings and lubrication
    stage: 3
    beat: 2
    kind: project
    critical_path: true
    problem: "Shafts running in wooden blocks with tallow heat up, wear oval, and seize at speed."
    requires:
      nodes: [measurement]
      any_of: [[tin_bronze], [arsenical_copper], [stone_molds]]
      resources: {copper_kg: 800, iron_kg: 500}
      labor_person_days: 400000
    unlocks:
      effects: ["Adds the bearings dial. Bronze journals and mineral or plant oil: shafts run 5x faster and last 10x. The bearing thread continues through ball bearings (Stage 5)"]
    reads_state: [has_bronze]
    writes_state: [bearing_quality]
    pages_bundle: machine_tools
    without_pages: "Different route: found from the failures (seized dynamo shafts); appears after the first high-speed machine burns a bearing"
    numbers_status: "Estimate"
    sources: ["https://en.wikipedia.org/wiki/Plain_bearing"]
    tags: [substantive]
    notebook: >
      A bearing is where a turning shaft touches something that doesn't turn. Bronze on steel with a
      film of oil wears slowly and sheds heat; wood and grease don't. Every fast machine in this game,
      from the dynamo to the turbopump, is limited by its bearings before anything else.

  - id: planer_milling
    name: Planers and milling machines
    stage: 3
    beat: 2
    kind: upgrade
    critical_path: false
    problem: "Flat faces on big castings are still chiseled and filed by hand, weeks per engine."
    requires:
      nodes: [measurement]
      state: ["shop_hours_balance < 0"]
      resources: {iron_kg: 12000}
      labor_person_days: 1000000
    unlocks:
      effects: ["Shop hours x3"]
    writes_state: [shop_hours_balance]
    pages_bundle: machine_tools
    without_pages: "2x labor"
    numbers_status: "Estimate"
    sources: ["https://en.wikipedia.org/wiki/Milling_(machining)"]
    tags: [accelerant]
    notebook: >
      A planer drags the work under a fixed tool, a thin strip per pass, until the face is flat. A
      milling machine spins a many-toothed cutter across a clamped part. With these, machines
      began to be built by machines and the cost of an engine fell steeply.

  # ---- Beat 3: hauling -------------------------------------------------------------------------------------------
  - id: rails_wagonways
    name: Iron rails
    stage: 3
    beat: 3
    kind: project
    critical_path: false
    problem: "Carting coal and ore on dirt tracks takes more workers than mining it."
    requires:
      nodes: [rotative_engine_shafting]
      state: ["haul_workers > 1500"]
      resources: {iron_kg: 200000, wood_kg: 150000}
      labor_person_days: 4000000
    milestones:
      - {at: 0.5, id: first_line_open, effect: "Mine-to-furnace line open: haul labor on that route -60%"}
    unlocks:
      effects: ["Haul labor between linked sites -80%. Repeatable per route. Locomotives (needs high_pressure_engine or plate_rolling) remove the rest"]
    reads_state: [haul_distance_days]
    writes_state: [rail_km, haul_workers]
    pages_bundle: steam_engines
    without_pages: "No penalty"
    numbers_status: "Estimate; ~30-60 kg iron per meter of light track"
    sources: ["https://en.wikipedia.org/wiki/Wagonway"]
    tags: [substantive, labor_sink, accelerant]
    notebook: >
      A wheel on a smooth iron rail meets a small fraction of the resistance it meets on dirt, so
      one horse on a wagonway pulled what took a dozen on a road. Mines laid rails long before
      steam locomotives ran on them.

  # ---- Beat 4: steel --------------------------------------------------------------------------------------------------
  - id: bessemer_converter
    name: Bessemer converter
    stage: 3
    beat: 4
    kind: workshop
    workshop: furnace_workshop
    critical_path: true
    problem: "Fined iron comes a few hundred kilograms at a time, and real steel is still a luxury."
    requires:
      nodes: [measurement]
      state: ["iron_kg_total > 200000"]
      resources: {iron_kg: 30000, clay_kg: 20000}
      labor_person_days: 1800000
    unlocks:
      jobs: [blow_steel]
      effects:
        - "Furnace workshop gains a converter mode with dials: blow time, lining (acid / basic), manganese addition. Basic lining needs dolomite (mineral_prospecting); manganese needs manganese ore"
        - "With phosphorus ore and an acid lining the steel is cold-short: iron_quality -1 until basic lining"
        - "Hot shortness from sulfur coke: iron_quality -1 until manganese"
    reads_state: [iron_ore_phosphorus, coal_sulfur, mineral_sites]
    writes_state: [has_steel, steel_quality, iron_quality]
    pages_bundle: metallurgy_2
    without_pages: "Different route: the first blows over-oxidize (brittle); the lining and manganese dials appear only after the phosphorus or sulfur failure is seen, and take 3x labor to find (historically 22 years)"
    numbers_status: "Bessemer (1856), Mushet's manganese (1850s), Gilchrist-Thomas basic lining (1878) are sourced"
    sources:
      - "https://en.wikipedia.org/wiki/Bessemer_process"
      - "https://en.wikipedia.org/wiki/Gilchrist%E2%80%93Thomas_process"
    tags: [substantive]
    trap_lesson: "The acid lining can't remove phosphorus; with phosphorus-rich ore the steel shatters when cold."
    notebook: >
      Blow air up through molten pig iron and the carbon and silicon burn so hot the metal gets
      hotter with no fuel at all; in twenty minutes, tons of iron become steel. It doesn't remove
      phosphorus, which makes steel brittle when cold, until Thomas and Gilchrist lined the
      converter with basic dolomite. Manganese, added after the blow, takes the sulfur.

  - id: hot_blast
    name: Hot blast
    stage: 3
    beat: 4
    kind: upgrade
    critical_path: false
    problem: "Blast furnaces burn tons of fuel per ton of iron, and the coal pits can't keep up."
    requires:
      nodes: [blast_furnace, measurement]
      state: ["fuel_balance < 0"]
      resources: {iron_kg: 8000, clay_kg: 20000}
      labor_person_days: 700000
    unlocks:
      effects: ["Furnace workshop dial: blast temperature. Fuel per ton of iron falls by a third to two thirds"]
    writes_state: [coke_rate]
    pages_bundle: metallurgy_2
    without_pages: "1.5x labor"
    numbers_status: "Neilson 1828: 8.06 -> 5.16 long tons coal per ton iron at 149 C blast (sourced)"
    sources: ["https://en.wikipedia.org/wiki/Hot_blast"]
    tags: [accelerant]
    notebook: >
      Blowing cold air into a furnace spends fuel just heating that air. Neilson preheated the blast
      in 1828 and cut coal per ton of iron by more than a third. Reclaiming heat that would be
      thrown away runs through the rest of the tree, up to the heat exchangers in the liquefier.

  - id: open_hearth
    name: Open-hearth furnace
    stage: 3
    beat: 4
    kind: upgrade
    critical_path: false
    problem: "A Bessemer blow is over in minutes, too fast to test and correct the steel."
    requires:
      nodes: [bessemer_converter, hot_blast]
      resources: {iron_kg: 20000, clay_kg: 40000}
      labor_person_days: 1200000
    unlocks:
      effects: ["Steel to a specification: steel_quality 3; remelts scrap. Pressure vessels and turbines want it"]
    writes_state: [steel_quality, has_open_hearth]
    pages_bundle: metallurgy_2
    without_pages: "2x labor"
    numbers_status: "Siemens-Martin (1860s) sourced"
    sources: ["https://en.wikipedia.org/wiki/Open-hearth_furnace"]
    tags: [accelerant]
    notebook: >
      Exhaust heat stored in brick chambers and fed back to the incoming air keeps steel liquid for
      hours. That time lets you sample and adjust, so steel can be made to order.

  # ---- Beat 5: minerals and chemistry -----------------------------------------------------------------------------
  - id: mineral_prospecting
    name: Prospecting for minor minerals
    stage: 3
    beat: 5
    kind: project
    critical_path: true
    problem: "The converter wants dolomite and manganese, the glassmakers want sand and soda, and nobody has looked for any of it."
    requires:
      nodes: [measurement]
      resources: {iron_kg: 2000, wood_kg: 20000}
      labor_person_days: 1200000
    unlocks:
      jobs: [mine_mineral]        # one crew per site: salt, sand, lead, zinc, sulfur, manganese, dolomite, graphite, mercury, chromite, bauxite...
      effects: ["Reveals mineral sites over several years, nearest first. Later nodes list the mineral they need; a missing one uses the node's substitute"]
    reads_state: [bundles_taken, rail_km]
    writes_state: [mineral_sites]
    pages_bundle: survey_minerals
    without_pages: "Different route: sites turn up in a slower, arbitrary order and scarce ones (tungsten, chromite) may not be found at all; their nodes then use substitutes"
    numbers_status: "Anatolian chromite (Guleman), bauxite (Seydisehir) are sourced; the rest is a design list"
    sources: ["https://www.usgs.gov/centers/national-minerals-information-center/turkey", "https://en.wikipedia.org/wiki/Guleman_mine"]
    tags: [labor_sink]
    notebook: >
      An industrial economy needs dozens of elements, most in small amounts. Anatolia is rich
      because it sits where plates collide, which pushes metal-bearing rock to the surface. The
      hard part is knowing where to dig.

  - id: glassworks
    name: Glassworks
    stage: 3
    beat: 5
    kind: project
    critical_path: true
    problem: "Chemists can't see their reactions or hold acids; clay and metal vessels crack, react or hide what's inside."
    requires:
      nodes: [mineral_prospecting]
      resources: {sand_kg: 20000, lime_kg: 5000, clay_kg: 20000}
      labor_person_days: 600000
    unlocks:
      jobs: [make_glass]          # soda-lime glass; alkali from wood-ash potash until soda ash (Stage 4)
      effects: ["Glassware for chemistry; later gauge glasses, bulbs and tubes. Trains glassblowers"]
    writes_state: [has_glass, glassblowers_trained]
    pages_bundle: industrial_chemistry
    without_pages: "Different route: cloudy, water-soluble glass until the lime fraction is found by trial (~5 batches)"
    numbers_status: "Soda-lime composition standard; labor is an estimate"
    sources: ["https://en.wikipedia.org/wiki/Soda%E2%80%93lime_glass"]
    tags: [skill_builder]
    notebook: >
      Pure sand melts above 1,700 C. Adding potash or soda breaks up the silica network so it
      melts far lower; lime stops the result dissolving in water. Glass is a liquid frozen before
      it could crystallize, which is why it's transparent.

  - id: sulfuric_acid
    name: Lead-chamber sulfuric acid
    stage: 3
    beat: 5
    kind: project
    critical_path: true
    problem: "Nearly every chemical process you want needs a strong acid, and you have none."
    requires:
      nodes: [glassworks]
      resources: {lead_kg: 8000, sulfur_kg: 2000}
      labor_person_days: 900000
    unlocks:
      jobs: [make_sulfuric_acid]
    writes_state: [has_sulfuric_acid]
    pages_bundle: industrial_chemistry
    without_pages: "Different route: only small-batch acid from burning sulfur under a glass bell (a tenth the output) until the chamber design is found, ~3 years"
    numbers_status: "Roebuck's lead chamber (1746) sourced"
    sources: ["https://en.wikipedia.org/wiki/Lead_chamber_process"]
    tags: []
    notebook: >
      Burn sulfur and you get sulfur dioxide; in a lead-lined room with steam and a trace of
      nitrogen oxide it picks up more oxygen and water and becomes sulfuric acid. For two centuries
      a country's acid output was a fair measure of its industry.

  - id: portland_cement
    name: Portland cement
    stage: 3
    beat: 5
    kind: project
    critical_path: false
    problem: "Lime mortar sets slowly and stays weak, and heavy engines and furnaces crack their foundations."
    requires:
      nodes: [lime_burning, rotative_engine_shafting]
      state: ["boiler_explosions > 0 OR factory_power_kw > 100"]
      resources: {iron_kg: 5000, stone_kg: 100000}
      labor_person_days: 1000000
    unlocks:
      jobs: [make_cement]
    writes_state: [has_cement]
    pages_bundle: primitive_technology
    without_pages: "2x labor; early batches are hydraulic lime"
    numbers_status: "Clinker firing near 1,450 C sourced; rates are estimates"
    sources: ["https://en.wikipedia.org/wiki/Portland_cement"]
    tags: [accelerant, labor_sink]
    notebook: >
      Fire limestone and clay together until they partly melt and they form calcium silicates. Mixed
      with water, those grow interlocking crystals, and unlike lime they need no air to harden, so
      concrete sets even underwater. Test stands and launch pads are concrete.

  - id: niter_beds
    name: Niter beds and black powder
    stage: 3
    beat: 5
    kind: project
    critical_path: false
    problem: "Hard rock in the deep galleries stops the picks, and fire-setting fills the mine with smoke."
    requires:
      nodes: [mineral_prospecting, lime_burning]
      resources: {wood_kg: 20000, sulfur_kg: 500}
      labor_person_days: 700000
    unlocks:
      jobs: [tend_niter_beds, make_black_powder]
      effects: ["Blasting: hard-rock mining and tunnelling x2.5. First fixed nitrogen (nitrate_source: niter_beds), a trickle"]
    writes_state: [has_nitrate, nitrate_source]
    pages_bundle: nitrogen_fuels
    without_pages: "Different route: leaching and crystallizing found by trial; first usable powder after ~3 years instead of ~1.5"
    numbers_status: "Beds took a year or more to mature (commonly cited; estimate)"
    sources: ["https://en.wikipedia.org/wiki/Saltpeter"]
    tags: [accelerant, slow_payoff]
    notebook: >
      Before the 20th century nitrate came from rot. Piles of dung, straw and lime, kept damp for a
      year or more, let bacteria turn ammonia into nitrate, which was leached out and crystallized.
      Mixed with charcoal and sulfur it burns without outside air.

  # ---- Beat 6: electricity from scratch -----------------------------------------------------------------------------
  - id: wire_drawing
    name: Copper wire
    stage: 3
    beat: 6
    kind: project
    critical_path: true
    problem: "Your chemists have seen sparks and magnets move, but there's no way to make long thin conductors."
    requires:
      nodes: [measurement]
      resources: {copper_kg: 5000, iron_kg: 2000}
      labor_person_days: 500000
    milestones:
      - {at: 0.6, id: insulation, effect: "Cotton- or silk-wrapped, varnished wire: coils that don't short"}
    unlocks:
      jobs: [draw_wire]
    writes_state: [has_copper_wire, has_insulated_wire]
    pages_bundle: electricity
    without_pages: "2x labor; insulation appears only after the first coil shorts"
    numbers_status: "Estimate. Rubber isn't local; see open questions"
    sources: ["https://en.wikipedia.org/wiki/Wire_drawing"]
    tags: []
    notebook: >
      Pull copper rod through a hardened die slightly smaller than itself and it comes out thinner
      and longer; repeat and you have wire. Copper is the best common conductor after silver, so
      the trail to the green stones pays off a second time.

  - id: electrical_laboratory
    name: Electrical laboratory
    stage: 3
    beat: 6
    kind: project
    critical_path: true
    problem: "Static sparks are useless for work; the engineers need a steady current to test anything."
    requires:
      nodes: [wire_drawing, sulfuric_acid]
      resources: {zinc_kg: 500, copper_kg: 1000, iron_kg: 500}
      labor_person_days: 900000
    milestones:
      - {at: 0.3, id: batteries, effect: "Zinc-copper cells in acid: a steady current"}
      - {at: 0.6, id: electromagnets, effect: "Coils around soft iron lift hundreds of kilograms; galvanometers measure current"}
      - {at: 1.0, id: induction, effect: "A magnet moved past a coil makes current: the principle of the generator"}
    unlocks:
      effects: ["Batteries, electromagnets, induction, in that order, each a notebook entry. Prerequisite for any generator"]
    writes_state: [has_battery, has_electromagnet]
    pages_bundle: electricity
    without_pages: "Different route: the three milestones take 3x as long and induction is found last and by accident, as it was"
    numbers_status: "Volta 1800, Sturgeon 1825, Faraday 1831 sourced"
    sources: ["https://en.wikipedia.org/wiki/Electromagnet"]
    tags: [research_loop]
    notebook: >
      Two different metals in acid, joined by a wire, push a current: the battery. A current in a
      coil around soft iron makes a magnet. Faraday found the reverse in 1831: move a magnet past a
      coil and current flows. That symmetry is what makes generators and motors possible.

  # ---- Beat 7: the generator ---------------------------------------------------------------------------------------------
  - id: magneto_generator
    name: Permanent-magnet generator
    stage: 3
    beat: 7
    kind: decision_option
    route: [T_magneto]
    critical_path: false
    problem: "You want current without batteries, using the strongest magnets you have."
    requires:
      nodes: [electrical_laboratory]
      resources: {iron_kg: 2000, copper_kg: 2000}
      labor_person_days: 600000
    unlocks:
      effects: ["Works. Output capped by the magnets at a few hundred watts; the gate needs 50 kW. The workshop shows the cap"]
    writes_state: [has_magneto]
    pages_bundle: electricity
    without_pages: "Same"
    numbers_status: "Magneto lighthouse machines are historic; the cap is a simplification"
    sources: ["https://en.wikipedia.org/wiki/Dynamo"]
    tags: [trap]
    trap_lesson: "Steel magnets of this era are weak and fade; a generator whose field comes from its own output scales, one using permanent magnets doesn't."
    notebook: >
      Spin a coil between permanent magnets and you get current. But 19th-century steel magnets
      were weak and faded with heat and vibration, so output stayed small however hard you turned.
      Early magneto machines lit lighthouses, one arc lamp at a time.

  - id: water_turbine
    name: Water turbine
    stage: 3
    beat: 7
    kind: project
    route: [B_water_turbine]
    critical_path: false
    problem: "Water wheels turn slowly, but a generator wants to spin hundreds of times a minute."
    requires:
      nodes: [bearings_lubrication, planer_milling]
      state: ["river_sites > 0"]
      resources: {iron_kg: 12000}
      labor_person_days: 1200000
    unlocks:
      effects: ["High-speed shaft power at river sites, no fuel. Cheap electricity in Stage 4 makes aluminum and arc processes attractive"]
    reads_state: [river_sites, bearing_quality]
    writes_state: [hydro_kw]
    pages_bundle: steam_engines
    without_pages: "2x labor"
    numbers_status: "Fourneyron (1827) sourced"
    sources: ["https://en.wikipedia.org/wiki/Water_turbine"]
    tags: [substantive, accelerant, new_energy_source]
    notebook: >
      A turbine runs water through curved vanes in a casing, turning pressure and speed into fast
      rotation. Fourneyron's turbines of the 1830s beat the best wheels and could drive machines
      directly. Eastern Anatolia's rivers drop steeply out of the mountains.

  - id: dynamo
    name: Self-excited dynamo
    stage: 3
    beat: 7
    kind: workshop
    workshop: engine_workshop
    route: [A_steam_dynamo, B_water_turbine]
    critical_path: true
    problem: "Batteries and magnetos give watts; your works needs tens of kilowatts."
    requires:
      nodes: [electrical_laboratory, bearings_lubrication]
      any_of: [[rotative_engine_shafting], [water_turbine]]
      resources: {iron_kg: 8000, copper_kg: 4000}
      labor_person_days: 1200000
    unlocks:
      effects: ["Engine workshop gains a generator dial: field (permanent / self-excited), size (kW). 50-100 kW per machine; arc lighting; opens Stage 4"]
    reads_state: [engine_type, hydro_kw, bearing_quality]
    writes_state: [dynamo_output_kw, electrical_engineers_trained]
    pages_bundle: electricity
    without_pages: "Different route: self-excitation isn't offered until a magneto has been built and shown its cap"
    numbers_status: "Siemens and Wheatstone 1867, Gramme 1871 sourced"
    sources: ["https://en.wikipedia.org/wiki/Dynamo"]
    tags: [substantive]
    notebook: >
      A self-excited dynamo powers its own field magnets from its own output. Leftover magnetism
      gives a trickle, which strengthens the field, which gives more, until it's at full power.
      Siemens and Wheatstone both announced it in 1867, and electricity became an industry.

  - id: electric_motors_preview
    name: Electric motors
    stage: 3
    beat: 7
    kind: upgrade
    critical_path: false
    problem: "Line shafting wastes a third of the engine in belts, and every machine stops when one belt breaks."
    requires:
      nodes: [dynamo]
      resources: {copper_kg: 8000, iron_kg: 8000}
      labor_person_days: 800000
    unlocks:
      effects: ["Machine shop dial shop_power: individual motors. Shop hours +50%; machines placed freely"]
    writes_state: [shop_hours_balance]
    pages_bundle: electricity
    without_pages: "1.5x labor"
    numbers_status: "Estimate"
    sources: ["https://en.wikipedia.org/wiki/Electric_motor"]
    tags: [accelerant]
    notebook: >
      A motor is a dynamo run backwards. Giving each machine its own let factories rearrange
      around the work instead of the shafting; it took owners decades to see that the layout, not
      the motor, was the real gain.

  - id: gate_generator
    name: "Gate: electric power"
    stage: 3
    beat: 8
    kind: gate
    critical_path: true
