    reads_state: [steel_quality, machinists_trained, tolerance_mm, bearing_quality, rail_km, hydro_kw]
    notebook: >
      Electricity is the first energy you can send down a wire and turn into heat, motion, light or
      chemistry at the other end. From here on, what you can do depends as much on the form of your
