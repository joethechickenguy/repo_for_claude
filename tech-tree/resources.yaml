# Resources that node costs consume, and the job that produces each.
# The validator checks each key is used correctly and that the producing job is unlocked by an
# ancestor of the consuming node or by an earlier stage. Production is pull-based in the engine
# (see DESIGN.md); only wood, charcoal and clay spoil in the open.
# Optional: `name` (what the stores panel shows) and `fuel` (the energy.md fuel it counts as when burned).

resources:
  wood_kg:           {produced_by: gather_wood, perishable: true, name: "Wood (kg)", fuel: wood}
  blades:            {produced_by: knap_flint, name: "Flint blades"}
  clay_kg:           {produced_by: dig_clay, perishable: true, name: "Clay (kg)"}
  pots:              {produced_by: fire_pottery, name: "Fired pots"}
  charcoal_kg:       {produced_by: burn_charcoal, perishable: true, name: "Charcoal (kg)", fuel: charcoal}
  copper_kg:         {produced_by: smelt_copper, name: "Copper (kg)"}
  # Read by conditions (ore_kg > 150) and made by Stage 1 jobs; declared for the engine (open question 26).
  ore_kg:            {produced_by: mine_malachite, name: "Malachite (kg)"}
  axes:              {produced_by: grind_axes, name: "Ground-stone axes"}
  copper_tools:      {produced_by: cast_copper_tools, name: "Copper tools"}
  tin_kg:            {produced_by: smelt_tin, name: "Tin (kg)"}
  stone_kg:          {produced_by: quarry_stone}
  lime_kg:           {produced_by: burn_lime}
  iron_kg:           {produced_by: smelt_iron_bloom, note: "Also run_blast_furnace (pig) and fine_pig_iron (bar). Costs accept any."}
  steel_kg:          {produced_by: blow_steel}
  alloy_steel_kg:    {produced_by: make_alloy_steel}
  glass_kg:          {produced_by: make_glass}
  cement_kg:         {produced_by: make_cement}
  caustic_kg:        {produced_by: electrolyze_brine}
  rubber_substitute_kg: {produced_by: electrolyze_brine, note: "Polysulfide rubber from chlorine chemistry; see open questions"}
  paper_kg:          {produced_by: make_soda_ash, note: "Soda pulping"}
  lox_kg:            {produced_by: separate_oxygen}
  # minor minerals: one mining job, one site each
  sand_kg:           {produced_by: mine_mineral}
  salt_kg:           {produced_by: mine_mineral}
  lead_kg:           {produced_by: mine_mineral}
  sulfur_kg:         {produced_by: mine_mineral, note: "Also from roasting sulfide copper ore"}
  zinc_kg:           {produced_by: mine_mineral}
  graphite_kg:       {produced_by: mine_mineral}
  mercury_kg:        {produced_by: mine_mineral}
  silver_kg:         {produced_by: mine_mineral}
  chromium_ore_kg:   {produced_by: mine_mineral}
  tungsten_kg:       {produced_by: mine_mineral, note: "Carbon filaments if none is found"}
  bauxite_kg:        {produced_by: mine_mineral}
