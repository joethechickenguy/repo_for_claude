# Resources that node costs consume, and the job that produces each.
# The validator checks each key is used correctly and that the producing job is unlocked by an
# ancestor of the consuming node or by an earlier stage. Production is pull-based in the engine
# (see DESIGN.md); only wood, charcoal and clay spoil in the open.
# Optional: `name` (what the stores panel shows) and `fuel` (the energy.md fuel it counts as when burned).

resources:
  wood_kg:           {produced_by: gather_wood, perishable: true, name: "Wood (kg)", fuel: wood}
  blades:            {produced_by: knap_flint, name: "Flint blades"}
  clay_kg:           {produced_by: dig_clay, perishable: true, name: "Clay (kg)"}
  pots:              {produced_by: fire_pottery, name: "Fired pots"}
  charcoal_kg:       {produced_by: burn_charcoal, perishable: true, name: "Charcoal (kg)", fuel: charcoal}
  copper_kg:         {produced_by: smelt_copper, name: "Copper (kg)"}
  # Read by conditions (ore_kg > 150) and made by Stage 1 jobs; declared for the engine (open question 26).
  ore_kg:            {produced_by: mine_malachite, name: "Malachite (kg)"}
  axes:              {produced_by: grind_axes, name: "Ground-stone axes"}
  copper_tools:      {produced_by: cast_copper_tools, name: "Copper tools"}
  tin_ore_kg:        {produced_by: mine_cassiterite, name: "Cassiterite (kg)"}
  tin_kg:            {produced_by: smelt_tin, name: "Tin (kg)"}
  bronze_tools:      {produced_by: cast_bronze_tools, name: "Bronze tools"}
  stone_kg:          {produced_by: quarry_stone, name: "Stone (kg)"}
  lime_kg:           {produced_by: burn_lime, name: "Lime (kg)"}
  # Stage 2 (owner playtest 2026-09-27: nothing here was made by any job before).
  iron_ore_kg:       {produced_by: mine_iron_ore, name: "Iron ore (kg)"}
  bloom_kg:          {produced_by: smelt_iron_bloom, name: "Bloom (kg)"}
  iron_kg:           {produced_by: smith_bloom, name: "Iron (kg)", note: "Also run_blast_furnace and run_coke_furnace (pig iron). Costs accept any."}
  iron_tools:        {produced_by: forge_iron_tools, name: "Iron tools"}
  coal_kg:           {produced_by: mine_coal, name: "Coal (kg)", fuel: coal}
  coke_kg:           {produced_by: coke_coal, name: "Coke (kg)", fuel: coal}
  # Delivered shaft work, 1 kWh per unit; counted x2.5 in the energy number (energy.md rule 5).
  engine_work_kwh:   {produced_by: tend_engine, name: "Engine work (kWh)", work: true}
  steel_kg:          {produced_by: blow_steel, name: "Steel (kg)"}
  acid_kg:           {produced_by: make_sulfuric_acid, name: "Sulfuric acid (kg)"}
  soda_ash_kg:       {produced_by: make_soda_ash, name: "Soda ash (kg)"}
  crude_kg:          {produced_by: pump_crude, name: "Crude oil (kg)"}
  kerosene_kg:       {produced_by: refine_crude, name: "Kerosene (kg)"}
  grain_kg:          {produced_by: farm_fuel_crops, name: "Fuel crops (kg)"}
  ethanol_kg:        {produced_by: ferment_and_distill, name: "Alcohol (kg)"}
  # Electricity sent to the grid, 1 kWh per unit; counted x2.5 in the energy number (energy.md rule 5).
  electricity_kwh:   {produced_by: run_power_station, name: "Electricity (kWh)", work: true}
  alloy_steel_kg:    {produced_by: make_alloy_steel, name: "Alloy steel (kg)"}
  glass_kg:          {produced_by: make_glass, name: "Glass (kg)"}
  cement_kg:         {produced_by: make_cement, name: "Cement (kg)"}
  caustic_kg:        {produced_by: electrolyze_brine, name: "Caustic soda (kg)"}
  rubber_substitute_kg: {produced_by: electrolyze_brine, name: "Synthetic rubber (kg)", note: "Polysulfide rubber from chlorine chemistry; see open questions"}
  paper_kg:          {produced_by: make_soda_ash, name: "Paper (kg)", note: "Soda pulping"}
  lox_kg:            {produced_by: separate_oxygen, name: "Liquid oxygen (kg)", workshop: liquefier_workshop}   # the liquefier's runs make it (E4)
  # minor minerals: one mining job, one site each
  sand_kg:           {produced_by: mine_mineral, name: "Sand (kg)"}
  salt_kg:           {produced_by: mine_mineral, name: "Salt (kg)"}
  lead_kg:           {produced_by: mine_mineral, name: "Lead (kg)"}
  sulfur_kg:         {produced_by: mine_mineral, name: "Sulfur (kg)", note: "Also from roasting sulfide copper ore"}
  zinc_kg:           {produced_by: mine_mineral, name: "Zinc (kg)"}
  graphite_kg:       {produced_by: mine_mineral, name: "Graphite (kg)"}
  mercury_kg:        {produced_by: mine_mineral, name: "Mercury (kg)"}
  silver_kg:         {produced_by: mine_mineral, name: "Silver (kg)"}
  chromium_ore_kg:   {produced_by: mine_mineral, name: "Chromite (kg)"}
  tungsten_kg:       {produced_by: mine_mineral, name: "Tungsten (kg)", note: "Carbon filaments if none is found"}
  bauxite_kg:        {produced_by: mine_mineral, name: "Bauxite (kg)"}

# Supply groups (owner playtest 2026-09-27: "over 20 labor controls in Stage 4"). From the next stage
# on, a job with `group:` in its stage file's `jobs:` map folds into its group's row: the player sets
# people for the group, the game splits them by what's being used and what projects wait on. Jobs of
# the current stage, and jobs with no group, stay rows of their own.
job_groups:
  fuel:      {name: "Fuel", what: "Wood, charcoal, coal and coke, then oil and alcohol: whatever the fires and furnaces burn"}
  tools:     {name: "Tools", what: "Tools for everyone who works with one; worn-out tools are replaced with the best the colony makes"}
  building:  {name: "Building materials", what: "Clay, pots, stone, lime, cement and glass"}
  metals:    {name: "Metals", what: "Ore to metal: copper, tin, iron and steel, made the most productive way the colony knows"}
  chemicals: {name: "Chemicals", what: "Minerals, acid, soda ash and caustic"}
