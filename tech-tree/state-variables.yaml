# State variables the tree reads and writes. The validator fails on any variable used but not listed.
# Types: flag | number (unit in name or description) | count | enum | set
# `has_*` flags can be derived by the engine from completed nodes; they're listed so later nodes can
# check a capability ("has_lox") instead of a route ("linde OR claude").

variables:

  # ---- Draft -------------------------------------------------------------------------------------
  bundles_taken: {type: set, description: "Map topic -> page coverage (0-1) from the draft. Nodes use it via three thresholds: known (>=1), partial (>=0.5), absent (without_pages route)."}
  draft_roster: {type: set, description: "Skill pool -> drafted specialists."}

  # ---- Pressures (one bar each; the simulation moves them) ----------------------------------------
  tool_wear: {type: number, description: "Stage 1 heartbeat. tools / tool users; below 1 workers slow down."}
  fuel_balance: {type: number, unit: kg/day, description: "Stage 2 heartbeat. Fuel produced minus fuel used. Negative for 10 days: furnaces stall."}
  shop_hours_balance: {type: number, unit: hours/day, description: "Stage 3 heartbeat. Shop capacity minus the parts queue's demand."}
  power_balance_kw: {type: number, unit: kW, description: "Stage 4 heartbeat. Generation minus load. Negative: brownout."}
  stand_days_balance: {type: number, unit: days, description: "Stage 5 heartbeat. Test-stand capacity minus the firing queue."}
  lox_balance: {type: number, unit: kg, description: "LOX stock minus the next test's need."}
  year: {type: number, description: "In-game year. Stage 6 heartbeat and the score."}
  dv_margin_km_s: {type: number, unit: km/s, description: "Vehicle Δv minus the 15.3 km/s budget. Below 0.3, guidance flaws become fatal."}
  forest_cover: {type: number, unit: percent, default: 100, description: "Forest within two days' walk. Charcoal, construction and fuel crops lower it; coppice sets a floor."}
  malachite_left_kg: {type: number, unit: kg, default: 80000, description: "Ore left in the Stage 1 outcrop. Below 20 t, ore per miner halves."}
  mine_water_m: {type: number, unit: m, description: "Workings below the water table not yet drained. Rises with cumulative extraction and the wet season."}
  haul_workers: {type: count, description: "People carrying things between sites. Roads and rails reduce it."}
  chemical_balance: {type: number, description: "Alkali and acid supply minus demand (Stage 4)."}
  iron_quality: {type: count, description: "0-3, starts 3. Phosphorus ore -1, sulfur coke -1, over-blown steel -1. Below 2: tool life and plate strength fall a third."}
  tolerance_mm: {type: number, unit: mm, description: "Best routine machining fit. Hand 1.0; flat reference 0.5; lead screw 0.25; gauges 0.1; micrometer 0.02; grinding 0.01."}
  known_flaws: {type: set, description: "Flaws revealed by testing (failure-modes.md)."}

  # ---- Labor control ---------------------------------------------------------------------------------
  labor_tier: {type: enum, values: [people, works, departments], description: "How the player assigns labor. Unlocked by the foremen and departments nodes."}
  jobs_active: {type: count, description: "Jobs with at least one person; triggers foremen."}
  works_active: {type: count, description: "Facilities with a target set; triggers departments."}

  # ---- Land, scars -----------------------------------------------------------------------------------
  coppice_area: {type: number, unit: ha, description: "Managed coppice; sets a sustainable charcoal ceiling."}
  river_sites: {type: count, description: "Usable water-power sites. Caps wheels and hydro."}
  haul_distance_days: {type: number, unit: days, description: "Walking days between main mine and works."}
  cropland_ha: {type: number, unit: ha, description: "Land farmed for fuel alcohol."}
  hcl_pollution: {type: flag, description: "Scar: Leblanc soda. Kills nearby coppice growth."}
  arsenic_exposure: {type: number, description: "Scar: arsenical smelting. At fixed thresholds smelters die."}
  boiler_explosions: {type: count, description: "Scar: each kills workers and destroys the engine. Deterministic from the boiler's safety margin."}

  # ---- Ores and fuel ----------------------------------------------------------------------------------
  deposits_known: {type: set, description: "Iron deposits found (bog_iron, hillside_ore)."}
  ore_type: {type: enum, values: [carbonate, sulfide], description: "Current copper ore."}
  iron_ore_grade: {type: number, unit: percent Fe, description: "Below ~50% bloomery yields collapse."}
  iron_ore_phosphorus: {type: enum, values: [low, high], description: "High: Bessemer steel cold-short until basic lining."}
  coal_sulfur: {type: enum, values: [low, high], description: "High: hot-short iron until manganese or a clean seam."}
  coke_rate: {type: number, unit: t fuel per t iron, description: "Hot blast lowers it."}
  mineral_sites: {type: set, description: "Minor-mineral sites found (salt, sand, lead, zinc, sulfur, manganese, dolomite, graphite, mercury, silver, chromite, tungsten, nickel, bauxite, oil_seeps). Missing ones trigger node substitutes."}

  # ---- Capabilities: metals and materials ------------------------------------------------------------
  has_copper_ore: {type: flag}
  has_copper: {type: flag}
  has_bronze: {type: flag}
  has_tin_source: {type: flag}
  has_iron: {type: flag}
  iron_tools: {type: count}
  has_steel_edges: {type: flag, description: "Quench-hardened edges; the lathe wants them."}
  has_cast_iron: {type: flag}
  has_foundry: {type: flag}
  has_coal: {type: flag}
  has_coke: {type: flag}
  has_lime: {type: flag}
  has_rolling_mill: {type: flag}
  plate_quality: {type: enum, values: [hammered, rolled, open_hearth], description: "Boiler and tank plate grade; sets safe stress."}
  wrought_iron_capacity: {type: number, unit: t/year}
  has_steel: {type: flag}
  steel_quality: {type: count, description: "0-3. Bessemer 1; manganese/basic lining 2; open hearth 3. Pressure vessels and turbines want 2+."}
  has_open_hearth: {type: flag}
  has_arc_furnace: {type: flag}
  has_alloy_steel: {type: flag}
  has_aluminum: {type: flag}
  has_duralumin: {type: flag, description: "Aluminum tanks allowed in the rocket workshop."}
  has_glass: {type: flag}
  has_cement: {type: flag}
  has_copper_wire: {type: flag}
  has_insulated_wire: {type: flag}

  # ---- Capabilities: chemistry --------------------------------------------------------------------------
  has_nitrate: {type: flag}
  nitrate_source: {type: enum, values: [none, niter_beds, arc, haber]}
  has_nitric_acid: {type: flag}
  has_sulfuric_acid: {type: flag}
  has_soda_ash: {type: flag}
  has_caustic: {type: flag}
  has_hydrogen: {type: flag}
  has_carbide: {type: flag}
  has_kerosene: {type: flag}
  has_ethanol: {type: flag}
  has_peroxide: {type: flag}
  has_hypergolics: {type: flag}
  has_solids: {type: flag}

  # ---- Energy and power -----------------------------------------------------------------------------------
  water_wheels_built: {type: count}
  engine_type: {type: enum, values: [none, savery, newcomen, watt, high_pressure]}
  coal_per_engine_kw: {type: number, unit: kg per kWh}
  mine_drained_by_engine: {type: flag, description: "Stage 2 gate condition."}
  factory_power_kw: {type: number, unit: kW}
  hydro_kw: {type: number, unit: kW}
  dynamo_output_kw: {type: number, unit: kW, description: "Stage 3 gate condition."}
  grid_kw: {type: number, unit: kW}
  has_ac: {type: flag}
  power_station_efficiency: {type: number, unit: fraction}
  has_magneto: {type: flag, description: "Built the trap."}
  has_electromagnet: {type: flag}
  has_battery: {type: flag}

  # ---- Skills and machines -----------------------------------------------------------------------------------
  trained_smiths: {type: count}
  trained_miners: {type: count}
  machinists_trained: {type: count}
  glassblowers_trained: {type: count}
  welders_trained: {type: count, description: "Weld flaws read it."}
  electrical_engineers_trained: {type: count}
  rocket_engineers_trained: {type: count}
  has_flat_reference: {type: flag}
  has_lathe: {type: flag}
  has_instruments: {type: flag, description: "Thermometers and pressure gauges: workshops show measured values."}
  bearing_quality: {type: count, description: "0-3: wood/tallow, bronze/oil, bronze/mineral oil, hardened steel balls. Caps shaft speed for dynamos, turbines, gyros, turbopumps."}
  has_boring_mill: {type: flag}
  max_pressure_atm: {type: number, unit: atm}
  has_high_vacuum: {type: flag}
  has_dewar: {type: flag}
  has_liquid_air: {type: flag}
  cryo_process: {type: enum, values: [none, cascade, linde, claude], description: "Sets kWh per kg LOX."}
  has_lox: {type: flag}
  lox_kg_per_day: {type: number, unit: kg/day, description: "Stage 4 gate condition; paces Stage 5-6 testing."}
  pump_workers: {type: count, description: "People bailing mines; the engine's visible payoff."}
  rail_km: {type: number, unit: km}
  has_adit: {type: flag}

  # ---- Electronics, guidance, testing ---------------------------------------------------------------------------
  has_tubes: {type: flag}
  has_radio: {type: flag}
  instrumentation_level: {type: count, description: "0-2. Raises flaw discovery per test."}
  calc_hours: {type: number, unit: computer-hours, description: "Computing office output; design, tracking and trajectory work spend it."}
  has_gyros: {type: flag}
  has_tvc: {type: flag}
  guidance_quality: {type: count, description: "0-3. Sets the size of hidden guidance flaws."}
  guidance_mode: {type: enum, values: [none, radio_command, inertial]}
  has_test_stand: {type: flag}
  injector_quality: {type: count, description: "0-2. Lowers combustion instability severity; needed for throttling."}
  has_regen_cooling: {type: flag}
  feed_system: {type: enum, values: [pressure, steam_turbopump, gas_generator]}
  turbopump_quality: {type: count}
  flight_tests: {type: count}

  # ---- Rocket and mission ---------------------------------------------------------------------------------------
  vehicle_design: {type: set, description: "Workshop design: per stage propellant mass, propellants, tank material, feed."}
  has_staging: {type: flag}
  has_launch_pad: {type: flag}
  has_tracking: {type: flag}
  has_midcourse: {type: flag}
  capsule_mass_t: {type: number, unit: t}
  life_support_days: {type: number, unit: days}
  has_pressure_suit: {type: flag}
  has_escape_system: {type: flag}
  lander_design: {type: set}
  lander_throttle: {type: flag}
  has_radar_altimeter: {type: flag}
  landing_tolerance: {type: number, unit: m/s}
  fixed_flaws: {type: set}

  # ---- Stage 1 route flags ----------------------------------------------------------------------------------------
  has_bellows: {type: flag, description: "Portable forced draft."}
  has_wind_furnaces: {type: flag, description: "Ridge-site forced draft."}
  metal_tools: {type: count, description: "All metal tools in stock; Stage 1 gate condition."}
