# Stage 0: the draft. Who goes and what they carry.
#
# People carry principles; paper carries data. A specialist pool makes a whole area's workshops and
# research loops faster. Pages skip the things nobody remembers: where deposits are, tables, and the
# few process recipes that took years of trials. Both are allocated with + / - buttons at the
# category level; each category expands to topics for players who want to go finer. The screen loads
# with the default allocation below (workable, not good) and a player can depart at once or tweak
# for ten minutes.

people_total: 10000
page_budget: 10000

# ---- Roster --------------------------------------------------------------------------------------------
# Pools work like page categories: + / - at the pool level; expand a pool to allocate its specialties.
# Unpinned specialties share the pool's people in proportion to `full`. A specialty's fill = people /
# full (capped at 1) scales the output of its skilled jobs and the speed of its research loops. Anyone
# in a pool can retrain into another; teachers set how fast. `absent` is shown when a pool is under `thin`.
roster:
  - id: builders
    name: Builders and laborers
    default: 5000
    thin: 0
    full: 10000
    absent: ""
    note: "The default pool: everyone not a specialist. Any allocation of the 10,000 is allowed."
    specialties:
      - {id: laborers, name: "Laborers", full: 8000, speeds: "Gathering, digging, hauling, Build"}
      - {id: masons_carpenters, name: "Masons and carpenters", full: 2000, speeds: "Furnaces, kilns, mills, the launch complex: construction projects -20% with a full pool"}

  - id: primitive_skills
    name: Primitive-skills experts
    default: 200
    thin: 100
    full: 500
    absent: "The first year runs on trial and error: Stage 1 projects ~1.5x."
    specialties:
      - {id: flintknappers, name: "Flintknappers and toolmakers", full: 200, speeds: "Blades and axes per worker-day; tool life"}
      - {id: potters, name: "Potters and kiln builders", full: 150, speeds: "Pit kiln, crucibles, furnace linings"}
      - {id: charcoal_burners, name: "Charcoal burners and woodsmen", full: 150, speeds: "Charcoal yield, coppicing"}

  - id: prospectors
    name: Prospectors and miners
    default: 800
    thin: 300
    full: 1500
    absent: "Deposits and seams are found late; hard-rock mining is slow."
    specialties:
      - {id: geologists, name: "Field geologists", full: 300, speeds: "Every prospecting and survey node; reading the survey pages"}
      - {id: miners, name: "Miners", full: 900, speeds: "Ore and coal per worker-day; fire-setting and blasting"}
      - {id: mine_engineers, name: "Mine engineers", full: 300, speeds: "Drainage: bucket chains, adits, pump layout"}

  - id: metallurgists
    name: Smiths and metallurgists
    default: 800
    thin: 300
    full: 1500
    absent: "Every furnace campaign takes twice as many tries to converge."
    specialties:
      - {id: smelters, name: "Smelters and furnace masters", full: 600, speeds: "Furnace workshop campaigns: copper, bloomery, blast furnace"}
      - {id: blacksmiths, name: "Smiths", full: 500, speeds: "Bloom smithing, forging, quench trials, tool output"}
      - {id: steelmakers, name: "Steelmakers and alloy metallurgists", full: 400, speeds: "Converter dials, open hearth, alloy steels, aluminum"}

  - id: mechanics
    name: Machinists and mechanics
    default: 800
    thin: 300
    full: 1500
    absent: "Engines and machine tools are built by trial; the boring mill and condenser arrive years later."
    specialties:
      - {id: machinists, name: "Machinists", full: 600, speeds: "Machine shop: tolerance_mm progression, shop hours"}
      - {id: engine_builders, name: "Engine and boiler builders", full: 500, speeds: "Engine workshop designs; boiler safety margin read correctly"}
      - {id: millwrights, name: "Millwrights and bearing makers", full: 400, speeds: "Water wheels, turbines, bearings, grinding, turbopump machining"}

  - id: chemists
    name: Chemists
    default: 400
    thin: 200
    full: 1000
    absent: "Stage 3-4 chemistry runs as trial and error, about 2x longer; the liquefier takes many runs."
    specialties:
      - {id: industrial_chemists, name: "Industrial chemists", full: 400, speeds: "Acid, alkali, glass, cement, electrolysis"}
      - {id: fuel_chemists, name: "Fuel and propellant chemists", full: 300, speeds: "Alcohol, petroleum, nitrogen fixation, peroxide, hypergolics, solids"}
      - {id: cryogenic_engineers, name: "Cryogenic engineers", full: 300, speeds: "Compressors, liquefier workshop, rectification"}

  - id: electrical
    name: Electrical engineers
    default: 300
    thin: 150
    full: 800
    absent: "Self-excitation, transformers and the triode are found late."
    specialties:
      - {id: power_engineers, name: "Power engineers", full: 400, speeds: "Electrical laboratory, dynamo, grid, motors, arc furnace"}
      - {id: electronics_engineers, name: "Electronics engineers", full: 400, speeds: "Vacuum tubes, radio, instrumentation, radar altimeter, tracking"}

  - id: rocket_engineers
    name: Rocket and aero engineers
    default: 200
    thin: 100
    full: 500
    absent: "Each hidden flaw needs about twice as many tests to find."
    specialties:
      - {id: propulsion_engineers, name: "Propulsion engineers", full: 250, speeds: "Rocket engine workshop; injector and cooling loops; flaw discovery on static fires"}
      - {id: guidance_engineers, name: "Guidance and controls engineers", full: 150, speeds: "Gyroscopes, TVC, inertial platform, guidance_quality"}
      - {id: mission_planners, name: "Mission planners and computers", full: 100, speeds: "Computing office output, trajectories, test campaign planning"}

  - id: teachers
    name: Teachers
    default: 1500
    thin: 500
    full: 2500
    absent: "Retraining is slow; the roster you drafted is roughly the roster you keep."
    specialties:
      - {id: instructors, name: "Instructors", full: 2000, speeds: "Training rate: how fast idle people join a pool"}
      - {id: technical_writers, name: "Technical writers and librarians", full: 500, speeds: "Notebook entries fill faster; partial page coverage counts as known one tier sooner for one topic of the player's choice"}

# ---- Pages ------------------------------------------------------------------------------------------------
# A category's pages are spread over its topics in proportion to `full` unless the player sets topics
# directly. Coverage = pages / full, capped at 1.
#   coverage >= 1.0  : known. Nodes in the topic use their base costs; no discovery loop.
#   0.5 <= c < 1.0   : partial. Discovery loops run at half length; surveys reveal half the sites.
#   c < 0.5          : absent. The node's `without_pages` route applies.
# Sum of `full` over all topics is about 20,000, so the 10,000 budget covers half of everything.
pages:
  - id: survey
    name: Geological survey
    default: 800
    topics:
      - {id: survey_copper_tin, name: "Copper, tin, clay, flint", full: 600, skips: "Stage 1 prospecting; the Kestel tin is only known from this"}
      - {id: survey_iron_coal, name: "Iron ore and coal seams, with sulfur and phosphorus", full: 1200, skips: "Stage 2 prospecting; both deposits and both seams known at once"}
      - {id: survey_minerals, name: "Minor minerals: lead, zinc, sulfur, manganese, dolomite, chromite, bauxite", full: 1200, skips: "Stage 3 mineral prospecting reveals sites at once instead of over years"}
      - {id: survey_oil_hydro, name: "Oil seeps and river sites", full: 600, skips: "Oil and water-power sites known; without it they're found by chance"}
  - id: primitive
    name: First-year field guide
    default: 400
    topics:
      - {id: primitive_technology, name: "Flint, clay, cordage, lime, charcoal", full: 800, skips: "The Stage 1 furnace and kiln dials start at good values"}
  - id: metallurgy
    name: Metallurgy
    default: 1500
    topics:
      - {id: metallurgy_1, name: "Copper and bloomery iron", full: 800, skips: "Furnace ratios and quench window known"}
      - {id: metallurgy_2, name: "Blast furnace, hot blast, Bessemer, basic lining, manganese, alloys, aluminum", full: 2000, skips: "The converter's lining and manganese dials appear at once (historically 22 years)"}
  - id: mechanics
    name: Engines and machine tools
    default: 1500
    topics:
      - {id: steam_engines, name: "Steam engines, drawings and steam tables", full: 1200, skips: "Separate condenser and rotative engine available without first running a Newcomen"}
      - {id: machine_tools, name: "Machine tools, gauges, bearings", full: 1200, skips: "Three-plate method, geared lead screw and thread standards known"}
  - id: chemistry
    name: Chemistry
    default: 1800
    topics:
      - {id: industrial_chemistry, name: "Acids, alkalis, glass, cement, electrolysis", full: 1600, skips: "Lead chamber, Solvay and chlor-alkali built to plan"}
      - {id: nitrogen_fuels, name: "Nitrogen fixation and petroleum", full: 1200, skips: "Haber-Bosch is only available with this; refinery cuts known"}
      - {id: propellants, name: "Peroxide, hypergolics, solid binders", full: 800, skips: "Concentrated peroxide and storable propellants without years of hazardous trials"}
  - id: electricity
    name: Electricity and electronics
    default: 1200
    topics:
      - {id: electricity, name: "Batteries to a three-phase grid", full: 1400, skips: "Self-excitation and transformers known"}
      - {id: vacuum_tubes_radio, name: "Vacuum, tubes, radio, radar", full: 1200, skips: "Triode and radar altimeter designs known"}
  - id: cryogenics
    name: Cryogenics
    default: 600
    topics:
      - {id: cryogenics, name: "Compressors, Linde and Claude cycles, rectification", full: 1400, skips: "Regenerative exchange and the column known; the plant reaches temperature on the first run"}
  - id: rocketry
    name: Rocketry
    default: 2200
    topics:
      - {id: liquid_rocket_engines, name: "Injectors, cooling, turbopumps, and the known failure modes", full: 2400, skips: "One hidden flaw per design is revealed for free; injector baffles known"}
      - {id: guidance, name: "Gyroscopes, accelerometers, control", full: 1200, skips: "guidance_quality +1"}
      - {id: orbital_mechanics, name: "Trajectory and lunar tables", full: 1400, skips: "Replaces most computing-office hours; Δv targets shown at once"}
      - {id: life_support, name: "Cabin air, CO2 scrubbing, suits", full: 600, skips: "Capsule built without leak trials"}

# ---- Weakest area ------------------------------------------------------------------------------------------------
# One line on the draft screen, recomputed on every change: "Weakest area: metallurgy". No numbers, no
# run-length estimate. Score per area = min(roster_fill, pages_coverage) where roster_fill = pool / full
# (capped at 1) and pages_coverage is the category's coverage. Lowest score wins; ties go to the
# earliest stage. The hint is advice only; nothing is blocked.
areas:
  - {id: first_year, name: "First year", roster: primitive_skills, pages: primitive}
  - {id: prospecting, name: "Prospecting", roster: prospectors, pages: survey}
  - {id: metallurgy, name: "Metallurgy", roster: metallurgists, pages: metallurgy}
  - {id: mechanics, name: "Engines and machines", roster: mechanics, pages: mechanics}
  - {id: chemistry, name: "Chemistry", roster: chemists, pages: chemistry}
  - {id: electricity, name: "Electricity", roster: electrical, pages: electricity}
  - {id: cryogenics, name: "Cryogenics", roster: chemists, pages: cryogenics}
  - {id: rocketry, name: "Rocketry", roster: rocket_engineers, pages: rocketry}
